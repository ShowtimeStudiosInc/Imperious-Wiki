<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    --font-display: "Cinzel", Georgia, serif;
    --bg: #02040d; --bg-deep: #07122e;
    --panel: rgba(12, 22, 50, .92); --panel-2: rgba(14, 26, 58, .94); --panel-solid: rgba(6, 11, 28, .92);
    --ink: #eef1fb; --ink-soft: #c3cbe4; --ink-faint: #93a0c2;
    --gold: #d9b45c; --gold-bright: #f0d48a; --gold-pale: #f0d48a;
    --brown-deep: rgba(3, 6, 18, .96);
    --line: rgba(148, 170, 220, .18); --line-strong: rgba(201, 168, 90, .34);
    --chip: rgba(38, 64, 140, .28);
    --quote-bg: rgba(2, 4, 13, .9); --quote-ink: #eef1fb;
    --shadow: 0 18px 44px rgba(0, 0, 0, .35);
    --sp: #0a1024; --sp-bg: #f0d48a; --badge-ink: #0a1024;
  }
  body { font-size: 17px; }
  h1 { letter-spacing: .05em; }
  /* ---------- Space background ---------- */
  .space-bg{
    position:fixed; inset:0; z-index:-3;
    background:
      radial-gradient(1100px 620px at 82% -10%, rgba(38,66,140,.5), transparent 60%),
      radial-gradient(900px 700px at -10% 32%, rgba(24,40,96,.55), transparent 62%),
      radial-gradient(700px 500px at 55% 108%, rgba(16,26,66,.6), transparent 60%),
      linear-gradient(180deg, #030614 0%, #050b22 46%, #02040d 100%);
  }
  .stars, .stars2{
    position:fixed; inset:-60px; z-index:-2; pointer-events:none;
    background-repeat:repeat;
  }
  .stars{
    background-image:
      radial-gradient(1.6px 1.6px at 22px 34px, #ffffff 55%, transparent 56%),
      radial-gradient(1.1px 1.1px at 130px 90px, #dbe7ff 55%, transparent 56%),
      radial-gradient(1.3px 1.3px at 74px 150px, #ffffff 55%, transparent 56%),
      radial-gradient(1px 1px at 180px 44px, #ffeec2 55%, transparent 56%),
      radial-gradient(1.2px 1.2px at 44px 190px, #bcd2ff 55%, transparent 56%),
      radial-gradient(1px 1px at 205px 160px, #ffffff 55%, transparent 56%);
    background-size:230px 230px;
    opacity:.85;
  }
  .stars2{
    background-image:
      radial-gradient(1px 1px at 60px 60px, #ffffff 55%, transparent 56%),
      radial-gradient(1.8px 1.8px at 160px 130px, #fff3cf 55%, transparent 56%),
      radial-gradient(1px 1px at 20px 170px, #cfe0ff 55%, transparent 56%),
      radial-gradient(1.4px 1.4px at 110px 20px, #ffffff 55%, transparent 56%);
    background-size:340px 340px;
    opacity:.55;
  }

  /* ---------- Meteor field ---------- */
  .meteor-field{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
  .rock-wrap{ position:absolute; will-change:transform; }
  .rock{
    display:block;
    background:
      radial-gradient(circle at 32% 30%, rgba(255,255,255,.20), transparent 42%),
      radial-gradient(circle at 68% 72%, rgba(0,0,0,.5), transparent 55%),
      linear-gradient(145deg, #4a546e 0%, #2b3349 46%, #171d2e 100%);
    box-shadow: inset -8px -10px 18px rgba(0,0,0,.55), inset 5px 6px 12px rgba(190,205,240,.14), 0 10px 30px rgba(0,0,0,.45);
    animation: rockFloat ease-in-out infinite alternate;
  }
  .rock::after{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 62% 38%, rgba(0,0,0,.35) 0 9%, transparent 10%),
      radial-gradient(circle at 38% 66%, rgba(0,0,0,.3) 0 7%, transparent 8%),
      radial-gradient(circle at 76% 70%, rgba(255,255,255,.10) 0 5%, transparent 6%);
    clip-path:inherit;
  }
  .r1{ width:118px;height:96px; clip-path:polygon(18% 6%,52% 0%,84% 14%,100% 44%,88% 78%,58% 100%,24% 92%,2% 62%,6% 28%); }
  .r2{ width:64px;height:56px; clip-path:polygon(30% 0%,72% 8%,100% 38%,86% 84%,48% 100%,12% 82%,0% 40%,10% 14%); }
  .r3{ width:150px;height:118px; clip-path:polygon(12% 22%,40% 2%,76% 6%,98% 34%,92% 72%,64% 98%,28% 96%,4% 70%,0% 40%); opacity:.92 }
  .r4{ width:44px;height:40px; clip-path:polygon(24% 4%,66% 0%,96% 30%,88% 76%,52% 100%,14% 84%,0% 44%,8% 16%); }
  .r5{ width:86px;height:72px; clip-path:polygon(16% 10%,54% 0%,88% 18%,100% 52%,80% 90%,44% 100%,14% 84%,0% 48%,4% 22%); opacity:.95 }
  .r6{ width:34px;height:30px; clip-path:polygon(28% 2%,70% 10%,100% 42%,80% 92%,40% 100%,8% 78%,0% 36%,12% 12%); }
  .r7{ width:104px;height:84px; clip-path:polygon(20% 4%,58% 0%,90% 20%,98% 56%,78% 94%,40% 100%,10% 80%,0% 44%,6% 18%); opacity:.88 }
  .r8{ width:52px;height:46px; clip-path:polygon(32% 0%,74% 12%,98% 44%,82% 88%,44% 100%,10% 80%,2% 38%,14% 10%); }
  @keyframes rockFloat{
    from{ transform:translate3d(0,-9px,0) rotate(-2.4deg); }
    to  { transform:translate3d(7px,11px,0) rotate(2.8deg); }
  }

  @media (prefers-reduced-motion: reduce) { .rock { animation: none !important; } }
</style>
<!--mark-->
<svg class="hero-mark" width="200" height="170" viewBox="0 0 118 96" aria-hidden="true"><polygon points="21,6 61,0 99,13 118,42 104,75 68,96 28,88 2,60 7,27" fill="var(--gold)"/></svg>
<!--/mark-->
<div class="space-bg" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
<div class="stars2" aria-hidden="true"></div>

<!-- Meteor rocks: outer wrap takes parallax and scroll drift, inner rock floats on its own -->
<div class="meteor-field" id="meteorField" aria-hidden="true">
  <div class="rock-wrap" data-depth="0.9" style="top:6%;  left:4%;"><span class="rock r1" style="animation-duration:7.5s"></span></div>
  <div class="rock-wrap" data-depth="0.45" style="top:14%; left:86%;"><span class="rock r2" style="animation-duration:6s"></span></div>
  <div class="rock-wrap" data-depth="0.3" style="top:38%; left:-2%;"><span class="rock r3" style="animation-duration:9s"></span></div>
  <div class="rock-wrap" data-depth="1.2" style="top:30%; left:93%;"><span class="rock r4" style="animation-duration:5.2s"></span></div>
  <div class="rock-wrap" data-depth="0.6" style="top:58%; left:90%;"><span class="rock r5" style="animation-duration:8s"></span></div>
  <div class="rock-wrap" data-depth="1.4" style="top:66%; left:7%;"><span class="rock r6" style="animation-duration:4.6s"></span></div>
  <div class="rock-wrap" data-depth="0.4" style="top:82%; left:82%;"><span class="rock r7" style="animation-duration:8.6s"></span></div>
  <div class="rock-wrap" data-depth="1" style="top:88%; left:16%;"><span class="rock r8" style="animation-duration:6.4s"></span></div>
  <div class="rock-wrap" data-depth="0.55" style="top:48%; left:46%;"><span class="rock r6" style="animation-duration:5.6s; opacity:.5"></span></div>
</div>
<script>
(function(){
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;

  var wraps = Array.prototype.slice.call(document.querySelectorAll(".rock-wrap"));
  var stars = document.querySelector(".stars");
  var stars2 = document.querySelector(".stars2");
  var targetX = 0, targetY = 0, curX = 0, curY = 0;
  var hasMouse = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  if (hasMouse) {
    window.addEventListener("mousemove", function(e){
      targetX = (e.clientX / window.innerWidth - 0.5) * 2;
      targetY = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive:true });
  }

  var ticking = false;
  function frame(){
    curX += (targetX - curX) * 0.045;
    curY += (targetY - curY) * 0.045;
    var scroll = window.scrollY || window.pageYOffset || 0;

    for (var i = 0; i < wraps.length; i++){
      var d = parseFloat(wraps[i].getAttribute("data-depth")) || 0.5;
      var mx = curX * d * -26;
      var my = curY * d * -18 + scroll * d * -0.14;
      wraps[i].style.transform = "translate3d(" + mx.toFixed(1) + "px," + my.toFixed(1) + "px,0)";
    }
    if (stars)  stars.style.transform  = "translate3d(" + (curX * -6).toFixed(1) + "px," + (scroll * -0.03).toFixed(1) + "px,0)";
    if (stars2) stars2.style.transform = "translate3d(" + (curX * -11).toFixed(1) + "px," + (scroll * -0.06).toFixed(1) + "px,0)";

    ticking = true;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
