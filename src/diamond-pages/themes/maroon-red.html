<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-body: "Source Serif 4", Georgia, serif;
    --font-display: "Oswald", Impact, sans-serif;
    --bg: #14040a; --bg-deep: #3e0a16;
    --panel: rgba(52, 14, 20, .93); --panel-2: rgba(52, 14, 20, .93); --panel-solid: rgba(32, 9, 12, .92);
    --ink: #fbecec; --ink-soft: #e2bcbc; --ink-faint: #b48787;
    --gold: #e88a5a; --gold-bright: #ffb488; --gold-pale: #ffd3ae;
    --brown-deep: rgba(32, 9, 12, .92);
    --line: rgba(255, 140, 140, .15); --line-strong: rgba(255, 140, 140, .3);
    --chip: rgba(232, 138, 90, .16);
    --quote-bg: rgba(32, 9, 12, .92); --quote-ink: #fbecec;
    --shadow: 0 18px 44px rgba(0, 0, 0, .4);
    --sp: #3a0c12; --sp-bg: #ffb4a0; --badge-ink: #3a0c12;
  }
  body { background: var(--bg) url('{{BASE}}images/diamonds/maroon-red/war-dusk-2.svg') center bottom / cover no-repeat fixed; font-size: 1.04rem; }
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .ember { position:absolute; bottom:-4vh; width:4px; height:4px; border-radius:50%; background:#ff8a4a; box-shadow:0 0 8px 2px rgba(255,110,50,.6); animation: rise linear infinite; }
@keyframes rise { 0% { transform: translateY(0); opacity:0; } 15%,70% { opacity:.9; } 100% { transform: translate(30px,-90vh); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .sky * { animation: none !important; } }
</style>
<!--mark-->
<svg class="hero-mark" width="190" height="190" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 82,50 50,96 18,50" fill="#ff3b3b"/><polygon points="50,4 82,50 50,50" fill="#ff7a6a"/><polygon points="18,50 50,96 50,50" fill="#a01a24"/><path d="M14 36 L86 64 L86 74 L14 46 Z" fill="var(--gold)" opacity=".9"/></svg>
<!--/mark-->
<div class="sky" id="sky" aria-hidden="true"></div>
<script>
  (function () {
    var sky = document.getElementById('sky'); if (!sky) return;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce) for (var i=0;i<22;i++){ var e=document.createElement('span'); e.className='ember'; e.style.left=Math.random()*100+'%'; e.style.animationDuration=(9+Math.random()*9)+'s'; e.style.animationDelay=(-Math.random()*15)+'s'; sky.appendChild(e); }
  })();
</script>
