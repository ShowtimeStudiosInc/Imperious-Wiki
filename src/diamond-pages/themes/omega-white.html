<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-body: "Cormorant Garamond", Georgia, serif;
    --font-display: "Cinzel", Georgia, serif;
    --bg: #0b0d14; --bg-deep: #1c2130;
    --panel: rgba(28, 33, 48, .93); --panel-2: rgba(28, 33, 48, .93); --panel-solid: rgba(18, 21, 32, .92);
    --ink: #f4f6fb; --ink-soft: #c9cfdd; --ink-faint: #98a0b4;
    --gold: #e8ecf5; --gold-bright: #ffffff; --gold-pale: #ffffff;
    --brown-deep: rgba(18, 21, 32, .92);
    --line: rgba(230, 236, 250, .14); --line-strong: rgba(230, 236, 250, .3);
    --chip: rgba(220, 228, 245, .12);
    --quote-bg: rgba(18, 21, 32, .92); --quote-ink: #f4f6fb;
    --shadow: 0 18px 44px rgba(0, 0, 0, .4);
    --sp: #1c2130; --sp-bg: #eef2fa; --badge-ink: #1c2130;
  }
  body { background: var(--bg) url('{{BASE}}images/diamonds/omega-white/hall-of-light-3.svg') center / cover no-repeat fixed; font-size: 1.1rem; }
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .mote { position:absolute; bottom:-10px; width:4px; height:4px; border-radius:50%; background:#fff; box-shadow:0 0 8px 2px rgba(255,255,255,.55); opacity:0; animation: lift 12s linear infinite; }
  @keyframes lift { 0% { transform:translateY(0); opacity:0; } 12%,80% { opacity:.7; } 100% { transform:translateY(-105vh); opacity:0; } }
  .crumbs { color: #f4f6fb; text-shadow: 0 1px 6px rgba(5, 6, 10, .95), 0 0 2px rgba(5, 6, 10, .9); }
  @media (prefers-reduced-motion: reduce) { .sky * { animation: none !important; } }
</style>
<!--mark-->
<svg class="hero-mark" width="190" height="190" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 92,50 50,96 8,50" fill="none" stroke="var(--gold)" stroke-width="3"/><polygon points="50,20 76,50 50,80 24,50" fill="var(--gold)" opacity=".85"/></svg>
<!--/mark-->
<div class="sky" id="sky" aria-hidden="true"></div>
<script>
  (function () {
    var sky = document.getElementById('sky'); if (!sky) return;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    // every mote starts at the same moment, in an even row: Omega's uniformity
    for (var i = 0; i < 14; i++) { var m = document.createElement('span'); m.className = 'mote'; m.style.left = (4 + i * 7) + '%'; sky.appendChild(m); }
    for (var j = 0; j < 14; j++) { var n = document.createElement('span'); n.className = 'mote'; n.style.left = (7.5 + j * 7) + '%'; n.style.animationDelay = '-6s'; sky.appendChild(n); }
  })();
</script>
