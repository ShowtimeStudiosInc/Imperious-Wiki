<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-body: "Lora", Georgia, serif;
    --font-display: "Playfair Display", Georgia, serif;
    --bg: #0b0414; --bg-deep: #2a0c42;
    --panel: rgba(36, 18, 58, .93); --panel-2: rgba(36, 18, 58, .93); --panel-solid: rgba(22, 11, 36, .92);
    --ink: #f1e8ff; --ink-soft: #cdb9ec; --ink-faint: #9d86c4;
    --gold: #b98be0; --gold-bright: #e6d6fb; --gold-pale: #e6d6fb;
    --brown-deep: rgba(22, 11, 36, .92);
    --line: rgba(190, 150, 255, .15); --line-strong: rgba(190, 150, 255, .3);
    --chip: rgba(185, 139, 224, .18);
    --quote-bg: rgba(22, 11, 36, .92); --quote-ink: #f1e8ff;
    --shadow: 0 18px 44px rgba(0, 0, 0, .4);
    --sp: #22103a; --sp-bg: #d7b8ff; --badge-ink: #22103a;
  }
  body { background: var(--bg) url('{{BASE}}images/diamonds/nightshade-violet/castle-town-4.svg') center bottom / cover no-repeat fixed; font-size: 1.05rem; }
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .twinkle { position:absolute; width:12px; height:12px; background:#e6d6fb; clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%); animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity:.15; transform:scale(.6); } 50% { opacity:.9; transform:scale(1); } }
.petal { position:absolute; top:-4vh; width:12px; height:8px; border-radius:80% 0 80% 0; background:#9a6fb0; opacity:.5; animation: fall linear infinite; }
@keyframes fall { to { transform: translate(40px, 110vh) rotate(320deg); } }
  @media (prefers-reduced-motion: reduce) { .sky * { animation: none !important; } }
</style>
<!--mark-->
<svg class="hero-mark" width="190" height="190" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 L57 36 L83 17 L64 43 L96 50 L64 57 L83 83 L57 64 L50 96 L43 64 L17 83 L36 57 L4 50 L36 43 L17 17 L43 36 Z" fill="var(--gold)"/><path d="M50 30 L56 44 L70 50 L56 56 L50 70 L44 56 L30 50 L44 44 Z" fill="#2a0c42"/></svg>
<!--/mark-->
<div class="sky" id="sky" aria-hidden="true"></div>
<script>
  (function () {
    var sky = document.getElementById('sky'); if (!sky) return;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    for (var i=0;i<18;i++){ var t=document.createElement('span'); t.className='twinkle'; t.style.left=Math.random()*100+'%'; t.style.top=Math.random()*55+'%'; t.style.animationDelay=(-Math.random()*4)+'s'; var sc=(.6+Math.random()*.9).toFixed(2); t.style.width=t.style.height=(12*sc)+'px'; sky.appendChild(t); }
if(!reduce) for (var i=0;i<14;i++){ var p=document.createElement('span'); p.className='petal'; p.style.left=Math.random()*100+'%'; p.style.animationDuration=(14+Math.random()*10)+'s'; p.style.animationDelay=(-Math.random()*20)+'s'; if(i%3==0) p.style.background='#b98be0'; sky.appendChild(p); }
  })();
</script>
