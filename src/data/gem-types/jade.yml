role: >-
  Jades are aristocrats and partygoers, seen at social events, balls, and high-ranking gatherings. They dance together
  and fill a room with their light and their outfits. Few gem-types vary as much in looks: short Jades tend to wear
  flowing gowns, medium Jades wear cog-styled dresses, and tall, slim Jades wear sharp uniform patterns.
interactions: >-
  Spotting a Jade alone is considered pretty unusual. They dance in pairs at the very least, and for a big dance they
  gather in large groups, sometimes enough to fill the floor on their own.
