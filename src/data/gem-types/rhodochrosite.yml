role: >-
  Rhodochrosites serve as seamstresses, taking the lead in designing the uniforms and clothing worn by gems throughout
  the empire, and the armor some of them wear into battle. They also help with gem reformation, giving gems suggestions
  on new uniform styling and accessorizing to help them stand out. A Rhodochrosite is never underdressed. Most wear
  large hats and pink, and treat their own outfit as an example for everyone else.
interactions: >-
  Rhodochrosites work alone or with other Rhodochrosites and fashion icons. Most of their day is spent with clients,
  sketching on a holographic mannequin until a design fits. For many gems, a Rhodochrosite is the first one to help them
  look like themselves instead of like their type.
