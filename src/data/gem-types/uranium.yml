    text: >-
      Uranium give off radiation that sickens every Gem and Metal around them. In battle, at the start of each of their
      turns, every Gem and Metal Near them, Uranium included, takes 1d4 damage. Outside of battle, it affects others,
      but not Uranium themselves.
    moves: []
  - section: Signature Ability
    name: Color Shift
    tags:
      - PASSIVE
    cost: null
    text: Uranium look gray in most light, but glow neon green in the dark or under ultraviolet light.
    moves: []
  - section: Latent Ability
    name: Radiogoop
    tags:
      - PASSIVE
    cost: null
    text: >-
      Some Uranium have radioactive fluids, a neon green slime that sticks to whatever it hits. A target it sticks to
      takes 1d4 damage at the start of each of their turns for 2 turns, even once they're no longer Near. Many Uranium
      don't know they can do this.
    moves: []
  - section: Latent Ability
    name: Nuclear Power
    tags: []
    cost: null
    text: >-
      Some Uranium can power machines just by touching them, for as long as they keep contact or until the battery is
      full. Many don't know they can do this.
    moves: []
role: >-
  Uranium have no real job on Homeworld. Their radiation makes anyone who spends long around them sick, including
  themselves. Most end up as test subjects in Kandy Diamond's labs, or wired into generators to keep the power running,
  and neither is much of a life. Left alone, the radiation wears them down too, and most eventually crack under it.
interactions: >-
  Most gems keep their distance from a Uranium, since even a short time close to one makes them sick. Kandy Diamond's
  lab staff and the Silvers and Coppers who work generators beside them are the exceptions, and they rotate out often. A
  Malachite can pull some of the poison out of the air, so a Uranium with a Malachite friend is a lucky one.
