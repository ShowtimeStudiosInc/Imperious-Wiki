role: >-
  Goshenites are researchers and energy analysts. They study and get close to things that would destroy most other gems,
  like plasma storms, unstable ionic fields, and other high energy environments. Within the Northstar Research Institute
  [Part of the United Frontier], they handle energy based research and collect data in places too dangerous for most
  gems to work in. Within Court Emerald, most of their old work has been taken over by Peridots and Serpentine, so the
  ones still active serve as energy analysts spread across the empire, making sure power sources in colonies stay
  properly monitored. Goshenite is a Legacy Gem Type, first made under Omega White Diamond and later recreated by Alpha
  Black Diamond near the end of Era 0. They were most active early in Era 1A before newer gem types like Peridot and
  Serpentine took over most of their work. Only a handful remain today, and few gems across the empire know of them.
interactions: >-
  The few Goshenites still active in the Gempire watch over colony power sources, working with Silvers, Coppers, and Era
  2A Indicolites to keep the energy flowing. Peridots and Serpentines took over most of their old work, which some
  Goshenites still find hard to watch. The Northstar Research Institute in the United Frontier treats them far better.
