role: >-
  Cherry Quartz soldiers are pretty interesting when it comes to personality. They can be hard to get close to. They act
  nice on the outside, but there is always a chance they are talking about you behind your back, picking apart small
  things like your posture or your tone. Despite being both sour and sweet, Cherry Quartzes are known to be solid,
  reliable guards in Court Crimson. They do their job well, even if some of them seem to hold a bit of a grudge against
  everyone around them.
