role: >-
  Orca Agate finds her typical job in the Gempire as a general or manager of Lapis Lazuli along with their terraforming
  expeditions for kindergartens. Despite being made to make sure Lapis Lazuli stay on task and on their best behavior,
  they will also act as scouts and protectors of their Lapis squads, fending off danger from the other gems, treating
  them as their pods.
interactions: >-
  Orca Agates and regular Agates sometimes argue over who gets to give a Lapis her orders, and the Lapis usually sides
  with the Orca Agate. Malachites and Clinohumites on the same terraforming job tend to let her lead once the water gets
  deep. A gem who picks a fight with her Lapis squad finds out quickly why the Lapis call her pod leader.
description: >-
  Orca Agate is typically a mainly black and white striped or spotted agate, though they can come in with red or brown
  as their main colors with black and white as complementary colors. They also have white hair with black streaks that
  ends in shapes that look like fins.
