role: >-
  Cloud Quartzes are Quartz soldiers made for the empire's high places, like stations floating in gas giant skies,
  landing platforms above the cloud layer, and lookout towers on stormy worlds. They're used to thin air, strong winds,
  and not being able to see more than a few feet ahead, so they keep watch where other soldiers get lost. Most of them
  are soft-spoken and a little dreamy, and other Quartzes joke that they live with their heads in the clouds. In a
  fight, a Cloud Quartz uses fog and cloud cover to hide, then attacks from a direction the enemy isn't watching.
interactions: >-
  Cloud Quartzes guard Rutiles and other crews scouting stormy planets, calling out what's ahead when no one else can
  see it. Rose Quartzes tend to look after them, since a Cloud Quartz will forget to come in from watch if nobody
  reminds her. Citrines love teasing them for being spacey, and most Cloud Quartzes don't even notice.
