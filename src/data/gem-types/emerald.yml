role: >-
  Emeralds serve the empire as administrators and fleet commanders. In wartime they command whole fleets. The rest of
  the time, many run scouting vessels on their own or with a small command group. They can pilot their own ships, and
  they know every ship under them well enough to tell when one isn't running right. Their commanding power is a force to
  be reckoned with, as resistance groups know all too well. Daily tasks may include organizing and commanding fleets,
  keeping ships in working order, handling fleet records and reports, monitoring prison areas, and reporting to higher
  ups.
interactions: >-
  Emeralds can fly their own ships, but most hand the flying to an assigned Nephrite so they can keep their full
  attention on command. A good Emerald and Nephrite pair can work together for centuries, with the Nephrite knowing
  where to steer before the order is finished.
