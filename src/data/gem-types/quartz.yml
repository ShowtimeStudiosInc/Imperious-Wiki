role: >-
  Quartzes make up most of the militia and come in several different types and courts. They are known for being tall and
  strong compared to other gems. Quartzes are usually used as facility guards, bodyguards, extra muscle on missions, or
  soldiers on the battlefield. They form with a wide range of weapons, used for both attack and defense. Agates are the
  ones who keep Quartzes in line. They are normally found in stations and take breaks in Quartz cubby holes.
interactions: >-
  A Quartz may be assigned alone as a bodyguard, or in a group to guard a facility or fight on the battlefield. They
  fight beside other militia gems, rank below Agates, and follow orders from Agates and any authoritative gem above
  them.
