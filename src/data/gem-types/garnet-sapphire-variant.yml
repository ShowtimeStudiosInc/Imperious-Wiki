role: >-
  Garnets are fusions between Rubies and Sapphires. They serve the Gempire as brawlers, fortune tellers, and boxers.
  Working both offense and defense, they are very good at predicting an opponent's next move and reacting fast in a
  brawl or boxing match to win their fights. These fusions are usually formed out of a real need to survive a dangerous
  situation.
interactions: >-
  Other gems come to a Garnet for one of two things: a look at their future, or someone to throw punches in a fight.
  Both come straight from her halves, with the foresight from her Sapphire and the fighting from her Ruby, so a Garnet
  is only as good as the two gems inside her get along. A Ruby and Sapphire in sync can hold a Garnet for a long time. A
  pair that argues will lose the fusion fast, which is why most Garnets only last as long as the danger that made them.
