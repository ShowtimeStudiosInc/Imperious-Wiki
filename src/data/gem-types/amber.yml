role: >-
  Ambers are authoritative gems operating under Court Saturn tasked with travelling from planet to planet to retrieve
  items or gems. When not hunting down their target they can be found wandering District 4 of Homeworld or any other
  Gempire owned location. Their speed and strength is something every gem wants to see, but not experience. Known for
  hunting down their target until they are finished, Ambers are extremely determined to complete their mission. Daily
  Amber tasks may include completing cargo runs, tracking down elusive gems, ordering troops around, organizing prison
  operations and so on. It's never a boring time when an Amber is around.
