role: >-
  Flints serve the empire as dispatchers for security and containment. They watch over sectors, log threats like rebel
  attacks and enemy forces as reports come in, and decide where the empire's Steels are sent. A Flint keeps a record of
  every call, from the first report to the moment the threat reaches a containment cell.
interactions: >-
  Flints and Era 2A Steels work as a pair. When a Flint logs a threat, she sends the closest Steels to detain it and
  bring it to a containment cell for questioning. A Steel who shows up to a call usually knows what she's walking into,
  because her Flint already told her.
