role: >-
  Rainbow Quartz were a highly specialized Quartz subtype from Omega White Diamond's original empire. Rather than being
  designed around raw physical strength, they were produced with unusually strong energy-channeling capabilities. This
  allowed them to adapt their existing abilities to different elemental properties, giving them a degree of versatility
  uncommon among Quartz. They were considered exceptionally advanced for their time, with surviving examples remaining
  rare.
