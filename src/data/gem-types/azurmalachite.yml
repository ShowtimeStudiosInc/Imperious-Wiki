    text: >-
      Azurmalachite can reshape the land around herself and the water in it: raising short walls, digging trenches,
      flooding a room, or collapsing a stretch of ground under someone's feet.
    moves:
      - name: Pitfall
        tags:
          - 2 SP
        cost: 2
        text: The ground drops out from under one target. The target resists with SPD. If they fail, they're Knocked Down.
      - name: Upheaval
        tags:
          - 3 SP
        cost: 3
        text: The ground buckles under every enemy who is Near, dealing [1d6 + MAG] EARTH damage to each.
  - section: Signature Ability
    name: Flight
    tags:
      - PASSIVE
