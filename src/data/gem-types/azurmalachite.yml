role: >-
  Azurmalachite are a new Geode, and the Gempire hasn't settled on a job for them yet. For now, most are being tried out
  on terraforming crews, where they drain flooded kindergarten land, water dry ground, and dig the trenches and walls a
  new site needs before anything can be built. A few have been loaned to military engineers for the same work under
  fire.
interactions: >-
  Since they're still being tried out, Azurmalachites move from crew to crew, working beside Lapises, Malachites, and
  Snowflake Obsidians, who each handle one part of what an Azurmalachite can do alone. Rutiles and Demantoids watch how
  they do and report back to the Zoisites deciding whether the type is worth keeping. Theta Gold isn't fond of how much
  Geodes cost to make, so every Azurmalachite knows her crew's opinion of her could decide the future of her whole type.
