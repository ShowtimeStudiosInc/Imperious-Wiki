role: >-
  Malachites are heavy hitting soldiers and brutes, a fusion between any type of Quartz and a Lapis Lazuli. A Malachite
  holds the same rank as her Quartz half, keeps whatever special ability that Quartz has, and gains Water Control from
  her Lapis half. Once fused, they are known as strong soldiers in battle, fighting with a trident for both attack and
  defense, backed by their command over water.
interactions: >-
  Malachites work alone or with each other, assigned to combat duty on the battlefield. Thanks to her Lapis half, a
  Malachite can help with terraforming when it's truly needed, but it isn't her job, and the non-fusion Malachites who
  do it full time will tell her so.
