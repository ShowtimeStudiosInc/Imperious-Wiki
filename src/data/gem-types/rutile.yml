role: >-
  Rutiles are skilled navigators and explorers. They are a must have for any planetary exploration mission, and are
  usually the first ones into unknown terrain, leading the rest of the crew behind them. They are the gem to go to when
  it comes to deciding where to build gem colonies. They are responsible for making sure that the planet's environments
  and conditions are suitable enough for construction. Without Rutiles, a lot of colonies would collapse or fail over
  time.
interactions: >-
  Rutiles usually work in teams but can work alone. They're very good at finding their way in places no one has mapped.
  Once they've scouted an area, they sit down with the terraformers to agree on where the empire should build next.
