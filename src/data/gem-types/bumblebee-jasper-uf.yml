    name: Paralyzing Bite
    tags:
      - PASSIVE
    cost: null
    text: >-
      Bumblebee Jaspers secrete a paralyzing venom from special glands in their mouth. When threatened or utilizing this
      ability in combat, the glands will secrete the venom into their saliva, with which they will bite an opponent and
      paralyze them for anywhere between 1-3 rounds of combat (1 round for large opponents, 2 rounds for medium
      opponents, 3 rounds for small opponents).
    moves: []
role: >-
  A Clear Quartz shifts into a Bumblebee Jasper when they're drawn to wildlife control work. When a dangerous animal
  wanders into a settlement, a worksite, or a trek camp, a Bumblebee Jasper is the one called to deal with it. Her bite
  puts the animal down without hurting it for good, so the crew can move it somewhere safe instead of killing it.
  Bumblebee Jaspers are quick and bold, and they'd rather get close to a problem than wait for it to come to them.
interactions: >-
  Bumblebee Jaspers ride along on Zebra Jasper treks, handling the wildlife so the guide can keep the crew moving.
  Jaspers guarding remote outposts call them in when something big gets too close. Most crews are glad to have one
  around, as long as she isn't biting them.
description: >-
  Bumblebee Jaspers typically take on a gray appearance with yellow or orange hair. They also bear yellow, orange, and
  black markings across their bodies, though the majority of their design is gray and yellow.
