role: >-
  Hematites are dark, aristocratic gems originating from Court Crimson, though they travel across all courts to do their
  job. When needed, they can remove memories and emotions from a gem. Some think of them as a walking rejuvenator,
  though a normal cut can't remove memories instantly the way the weapon does. Technically they count as healers,
  similar to Selenites. If a gem's trauma is too severe for a Selenite's therapy to help, or the job needs to be done
  fast, a Hematite is the best option to spare them from a full rejuvenation.
