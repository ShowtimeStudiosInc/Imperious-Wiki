role: >-
  Iris Agates were a specialized Agate subtype produced within Omega White Diamond's empire. Rather than focusing
  entirely on supervising and organizing other Gems, Iris Agates were designed to function as battlefield commanders.
  Their greatest strength was their ability to keep nearby Gems organized and coordinated, making them valuable leaders
  despite lacking the overwhelming physical strength of many military Gem-types.
