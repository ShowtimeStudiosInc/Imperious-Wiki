role: >-
  Sardonyxes serve the Gempire as comedians, show hosts, and general entertainers in recreational spots like Club
  Imperious. They are a fusion between Pyropes and Pearls, and fall under the aristocratic ranking. They stand tall in
  suits, top hats, visors, and shoulder pads, dressed for the stage at all times. Using their comedy and entertainer
  skills, Sardonyxes help lift spirits when things get stressful across the Gempire.
interactions: >-
  A Sardonyx can carry a whole show by herself, but she's just as happy sharing the stage with other entertainers or
  another Sardonyx. Like Spinels, her whole job is getting gems to laugh, and she'll be as loud and flashy as it takes.
