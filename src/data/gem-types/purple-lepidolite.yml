role: >-
  Purple Lepidolites are fusions between a Lapis Lazuli and a Pyrope. They're a rare fusion, and they usually form when
  a ball is held on a colony covered in water and the event needs a louder voice than one Pyrope can manage. The Pyrope
  half runs the event and can quiet a whole room, and the Lapis half fills the venue with water shows, like fountains,
  floating walkways, and tricks hidden around corners for guests to find. She also acts as the event's announcer,
  quieting the room whenever she needs everyone's attention.
interactions: >-
  A Purple Lepidolite forms when a Pyrope hosting on a water colony brings in a Lapis to help with the venue. She works
  with Pezzottaites to keep the event on schedule, and Scapolites time their songs around her water shows. Jades and
  other guests tend to follow her around the room to catch the next trick.
description: A round, mostly oval gem, a soft purple with spots of white and black. Both of her gemstones take on these colors.
