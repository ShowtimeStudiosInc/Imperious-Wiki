role: >-
  Malachites have a dual purpose. Firstly they're terraformer gems with the ability to control and shape dirt, and
  stones and rocks. They use this ability to work with Yooperlites and Clinohumites to create and shape a landscape
  suitable for kindergartens and other structures. They are also sent into toxic planets to absorb toxic materials from
  the atmosphere and the land below. Once that job is complete, their secondary purpose is in effect, and that's to
  guard the other terraformers on the planet.
interactions: >-
  Malachites work with Yooperlites and Clinohumites to shape land for kindergartens and buildings. On toxic planets they
  go in first to clear the air and ground for everyone else, then stay on as guards for the rest of the terraforming
  crew.
