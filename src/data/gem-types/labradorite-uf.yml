role: >-
  Labradorites are the United Frontier's registrars. When a gem emerges, gets adopted, founds a colony, or is laid to
  rest, it goes on record with a Labradorite, and years later she's the one who can tell you exactly where you came
  from. A lot of that work is done by touch. A Labradorite can hold an old letter, a necklace, or a worn tool and feel
  who it belonged to and what it went through, so when the paperwork runs out, the objects fill in the rest of the
  story. Gems bring her boxes of things a relative left behind and ask her who that gem really was. Most of the time,
  she can tell them.
interactions: >-
  Labradorites keep the Frontier's records, working with Iolites on school records and Astrophyllites on career paths.
  Melanites send them the record of every gem laid to rest, and Yellow Tourmalines bring them goods to read before a
  trade, since a Labradorite can tell in a moment whether something was stolen. After a disaster, Almandines call one in
  to help get lost belongings back to the right families.
