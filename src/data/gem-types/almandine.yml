          <:Stuck:1569710918638510141>Stuck.
  - section: Latent Ability
    name: Fire Generation
    tags: []
    cost: null
    text: >-
      Almandine may learn to create and control small fires with focus, or reignite a dying one, mostly to stop fires
      from spreading, clear a path, or provide heat in an emergency. Its moves and SP costs are set when it's unlocked.
    moves: []
role: >-
  Almandines serve as first responders within the United Frontier's emergency services. They arrive at disaster sites,
  collapsed structures, and other crisis situations to rescue trapped gems and manage the chaos around them. Despite
  doing life saving work, Almandines are one of the less recognized garnet types, quietly handling emergencies while
  flashier gems get the public attention. They are a humble garnet type and don't care for recognition beyond thanks
  from the gems they save.
