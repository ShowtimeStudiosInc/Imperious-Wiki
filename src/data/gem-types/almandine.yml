    text: >-
      Almandine can move debris and shift her surroundings with her mind, sense where survivors are and how they are
      doing from a distance, and calm down panicked gems in an emergency. She always knows the HP and statuses of her
      allies. These abilities grow stronger with training and time on the job.
    moves:
