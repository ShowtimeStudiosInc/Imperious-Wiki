role: >-
  Zircons serve as prosecutors and defense in Trials hosted by a Kyanite or the Supreme Judge. Some take on cases
  themselves, and others are assigned to a gem by a higher-up. Not every Zircon stays in the courtroom. Some become
  Detectives under Court Nightshade, using the same skill for building a case to track down what really happened before
  a trial ever starts.
interactions: >-
  Zircons work with other gems in court roles. In a trial, they take the prosecuting or defending side and work with
  their clients, witnesses, the authorities, and the Kyanite judging the case. A Detective Zircon's case often ends up
  in front of another Zircon in court.
