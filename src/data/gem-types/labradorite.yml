role: >-
  Labradorites work as the Gempire's artists, painting requests for fellow aristocrats and even Cubic Zirconias! They
  are also responsible for recording history visually in the form of their art. Many murals of today were made by a
  group of talented Labradorites! The ends of their hair seem to always produce a colorful assortment of paint they use!
  It's said it has a shiny gleam to it. They are often found in Court Theta or Court Saturn.
interactions: >-
  Labradorites take commissions from aristocrats like Pyropes and Jades, and a Cubic Zirconia who asks for a portrait
  expects it done fast and done well. For their history work they lean on the library Opals, who dig up the records a
  mural needs. Catseyes and Scapolites are favorite subjects, since a Labradorite will paint a good performance whether
  anyone asked for it or not.
