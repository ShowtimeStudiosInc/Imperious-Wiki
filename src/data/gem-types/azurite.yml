role: >-
  Azurites handle the administrative and clerical work in court settings. They manage records and documents tied to
  trials and hearings, process legal forms, and schedule cases and hearings, making sure files stay complete and
  accurate. For trials, an Azurite puts together the documents and materials needed for the case, and reviews everything
  to make sure procedures are described correctly. During busy case periods, Azurites can often be seen working with
  specialized Opals to gather the information they need.
