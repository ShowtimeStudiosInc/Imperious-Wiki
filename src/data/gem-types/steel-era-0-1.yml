role: >-
  Era 0-1 Steels are wranglers and organic rehabilitators. They respond to calls about organic beings that need to be
  moved elsewhere, gently keeping the organic safe the whole time, and bring them to rehabilitation facilities to see to
  their upkeep under Epsilon Blue's order. They did the same work for the Metal Society long before it joined the
  Gempire. As they are not mass produced by the Gempire, only the original Era 0-1 Steels of this kind exist, and each
  one goes by her real name.
interactions: >-
  An Era 0-1 Steel usually works with a team of Era 2A Steels. She handles the organics, and they handle anything that
  fights back. Many of the younger Steels picked up their sense of patience from watching one work.
