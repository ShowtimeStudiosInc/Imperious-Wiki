role: >-
  Sapphires are elite aristocratic gems who work under various Diamonds with the sole purpose of predicting the future.
  They can usually be found wandering diplomatic locations or other tightly guarded Gempire sites. Their powerful eyes
  can catch even the smallest shift in the future, and they are always ready to report it. A Sapphire doesn't just warn
  gems about what's coming. She advises them on how to prepare for it and get through it. Sapphires have even accurately
  predicted resistance group attacks. Daily tasks may include touring new locations, reporting upcoming predictions, and
  assessing other gems.
interactions: >-
  Sapphires usually work alone, but they're rarely left unguarded. Rubies, Eucryptites, or other foot soldiers are
  assigned to protect them. A Sapphire's gemstone is hard, but Sapphires are rare and their sight is worth too much to
  risk, so the empire would rather send a squad than lose one.
