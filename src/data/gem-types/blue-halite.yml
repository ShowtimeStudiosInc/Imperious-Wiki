role: >-
  Blue Halites are fusions between a Lapis Lazuli and an Orca Agate. Most of them start the same way: an Orca Agate
  manages the same Lapis squad for years, and she and one of her Lapis grow close enough to fuse. The empire doesn't
  assign this fusion, so inside the Gempire a Blue Halite only appears through a licensed marriage. There she does
  underwater excavation, cutting into the seafloor with her water when the empire needs resources from the bottom of an
  ocean. That isn't often, since most water planets are left untouched. Many pairs who can't get a license leave
  instead. Among the Rogues, Blue Halites use those same untouched water planets as hiding places, carving shelters into
  the seafloor where the empire rarely looks.
interactions: >-
  Inside the Gempire, a Blue Halite usually stays with the Lapis squad her halves came from, and Tungstens and other
  miners work under her on seafloor jobs. Regular Agates tend to see her as a sign that an Orca Agate got too close to
  her Lapis. Among the Rogues, Blue Halites take in water gems who want out, and Bluebird Azurites bring them new
  arrivals who need somewhere to hide.
description: >-
  A deep blue gem with small cracks that can be seen inside. It seems to have flowing water inside that shimmers, giving
  it a striped look.
