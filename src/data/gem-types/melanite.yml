role: >-
  Melanites serve as funeral directors in the United Frontier. When a gem is shattered, a Melanite is called in to
  collect the shards, keep them safe, and plan the service with the gem's family and friends. They keep a record of
  every gem they've laid to rest, and those records are often the only full account of a gem's life once they're gone.
  Melanites are also called to med bays when a gem is badly cracked and not expected to recover, so they can sit with
  them and prepare their family for what comes next. Because their work puts them close to every shattering in the
  Frontier, Melanites are often the first to notice when too many gems are being lost in one place.
