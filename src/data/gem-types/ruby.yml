role: >-
  Rubies are some of the most common militia gems in the empire. They serve as both foot soldiers and personal escorts
  to high ranking gems, often Morganites or Sapphires. Most form with small daggers, used for both attack and defense.
  Rubies are typically assigned in groups of three, five, or more to boost their efficiency. While mostly focused on
  combat, they can also pilot roaming eyes and handle other small technical tasks needed to complete a mission.
interactions: >-
  Rubies work in groups, and are often paired with a Eucryptite cohort of the same size, with both squads answering to
  the same commander. Their most common posting is guarding aristocrats like Sapphires and Morganites.
