role: >-
  An Andean Opal is an Agate fused with a Pearl, and her colors come from whatever colors her two halves were. Since
  she can't do anything her halves couldn't already do on their own, the Gempire never gave Andean Opals a job. If one
  ever shows up there, it's through a licensed marriage, and she usually just goes back to working whatever post one of
  her halves had before. Out in Drift or the Rogue Settlement, it's a different story. Rogue camps have plenty of gems
  who left their posts and no one telling them what to do, so an Andean Opal ends up running things. She sets the guard
  shifts, splits up the work, and keeps track of supplies, and her holograms let her be in more than one place while
  she does it.
interactions: >-
  Andean Opals usually form between an Agate and the Pearl assigned to her station. Quartzes who left the Gempire often
  end up working under one in rogue camps.
