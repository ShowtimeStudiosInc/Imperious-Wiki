role: >-
  Hematites of this line serve the empire as news anchors and reporters, covering serious events and weather seen across
  the empire. Their main job is keeping gems informed on the latest news, whether it is rebel breakouts, space storms,
  or chaotic weather on other planets. They work out of the Sagittarius Dwarf Station, where they aim to deliver the
  next big story. This class of Hematite is a Legacy from Era 0 and the only news reporting Gem-Type in the empire. Only
  a handful were ever made, all purely from Luminous Alpha Black Diamond's essence.
interactions: >-
  Hematites cover stories alone or in small crews with other Hematites. They take the job of keeping gems informed very
  seriously, but many of them have the charm to keep viewers hooked from the first line of a story to the last.
