role: >-
  Ocean Jaspers are Quartz soldiers made for water worlds. They guard the empire's ocean colonies, from floating
  platforms and harbor stations to domes built on the sea floor, and they're the soldiers sent when a fight breaks out
  on, in, or under the water. They can handle deep cold and heavy water pressure, so their daily work includes
  patrolling underwater pipelines and cables, escorting ships in and out of harbor, guarding coastal kindergartens, and
  pulling gems out of the water when something goes wrong. Ocean Jaspers are patient and easygoing compared to other
  Jaspers, which suits the long, quiet watches that most of their posts involve.
interactions: >-
  Ocean Jaspers often share water colony posts with Blue Quartzes, who handle the surface while the Ocean Jaspers take
  anything deep. They guard Lapis crews shaping new ocean worlds, and Lapises like having them around, since an Ocean
  Jasper can usually tell when the tide or current is about to change. Regular Jaspers think they're too relaxed.
