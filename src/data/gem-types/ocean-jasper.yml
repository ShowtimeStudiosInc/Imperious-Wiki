role: >-
  Ocean Jaspers are Quartz soldiers who guard the empire's shorelines. They hold beaches, tidal flats, and coastal
  kindergartens on ocean worlds, standing on the line where the water meets the land. A shore post changes twice a day
  as the tide comes and goes, so Ocean Jaspers are patient soldiers who are used to waiting for the right moment.
  They're cheerful and easygoing compared to other Jaspers, but anyone who tries to land on a beach they're guarding
  finds out they hit just as hard.
interactions: >-
  Ocean Jaspers hold the shore while Blue Quartzes work the water, and the two trade posts whenever the tide turns.
  Regular Jaspers think they're too relaxed, until they see one in a fight. Lapises like them, since an Ocean Jasper
  always knows when the water is about to move.
