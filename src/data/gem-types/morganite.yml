role: >-
  Morganites are one of the many aristocrats of Homeworld. They serve the gempire as bubble keepers and maintainers,
  making sure gems are properly bubbled and that ones already bubbled stay safe, especially over long periods of time. A
  bubble left unkept for too long can pop, and the gem inside reforms without anyone knowing. Making sure that never
  happens is the whole reason Morganites exist. They are commonly found at the Cosmic Mausoleum, where most of their
  work takes place.
interactions: >-
  It only takes one Morganite to check, restore, or maintain a bubble, so most of their work is done alone. For large
  bubble fields, they call on each other and split the field up. Since the work is delicate, and unbubbling a gem
  stronger than them can go badly, Morganites are usually guarded by small groups of foot soldiers like Rubies or
  Eucryptites, who protect both the Morganite and the bubbles.
