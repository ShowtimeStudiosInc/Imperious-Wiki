role: >-
  Rainbow Angelites were a specialized medical subtype produced within Omega White Diamond's empire. Their bodies were
  particularly suited to restorative abilities, allowing them to provide medical support to injured Gems in the field.
  They were not frontline combatants and instead served as dedicated medical personnel. Their unusual coloration,
  appearance and medical abilities are believed to have influenced the design philosophy behind some of the Angelites
  later produced by the United Frontier.
