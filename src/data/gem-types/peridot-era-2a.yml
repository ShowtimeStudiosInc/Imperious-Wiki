role: >-
  Peridots take on the role of Kindergarten Workers and Technicians. They monitor Kindergartens, maintain injectors, and
  make sure that the gem creation process goes smoothly. Because of their role as tech gems, they have knowledge of both
  simple and advanced technology. Era 2A Peridots are small on their own, so most are issued limb enhancers that add to
  their height and let them handle heavier work.
interactions: >-
  Peridots work alone for inspections and quick checks, but managing a large kindergarten takes a group. They take
  orders from higher-ups, most often Demantoids, who organize where Peridots are sent.
