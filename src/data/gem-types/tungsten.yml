role: >-
  Tungsten handles heavy debris movement and extreme temperature operations. She moves massive loads during colonization
  and terraforming in environments with extreme heat, and can work near volcanic activity, stellar bodies, and high
  energy construction without getting hurt. She is the densest and most heat resistant metal type.
interactions: >-
  Tungstens work in teams, usually with the fire and lava terraformers. A Clinohumite or Yooperlite melts and reshapes
  the land, and the Tungstens haul away what's left while it's still too hot for anyone else to touch. They're slow, so
  they're rarely the first ones on a site, but they're often the last ones still working when the heat gets too high for
  everyone else.
