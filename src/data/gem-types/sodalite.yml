role: >-
  Sodalites are fusions between Larimars and Lapis Lazulis, serving the empire as ice terraformers and builders. With
  water from one half and ice from the other, a Sodalite can pull water up out of the land and freeze it in place, which
  makes her one of the best gems for raising spires and shaping land out of whatever her environment has to offer. Most
  wear baggy pants and loincloths, with structural details that show both halves.
interactions: >-
  Sodalites work alone or in teams with other Sodalites, depending on the size of the job. They work closely with other
  terraformers to agree on where to build and how much land to reshape. With both halves able to work water and ice, a
  Sodalite gets more done than her two halves would apart.
