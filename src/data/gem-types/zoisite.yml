role: >-
  Zoisites are authoritative scientists. They serve the empire by working out the combinations of gem essence used in
  kindergartens. They have deep knowledge in their field, capable of creating gem types and studying how different
  kindergarten environments and materials shape gem growth. Most carry large chemical tanks on their backs full of raw
  essence, which they take straight to test sites. They dress in lab coats, visors, and work gloves, and their colors
  run from purple to green, with some showing patches of both. They are key members of Court Emerald, along with other
  groups like Court Theta, leading the Gempire's research efforts.
interactions: >-
  Zoisites sit over the empire's technical gems, especially anything to do with making new gems. Demantoids run
  kindergarten production day to day, but they report to Zoisites on how it's going and whether the injectors are
  working.
