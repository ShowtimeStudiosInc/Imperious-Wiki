role: >-
  Era 1 Indicolites serve the empire as shrine keepers, looking after sacred places like the Indigium Shrine where
  fallen gems are laid to rest. They keep order on the grounds and won't tolerate any disrespect toward the fallen. Like
  Morganites, they can bubble gems, though an Indicolite's work is with the cracked and the shattered, not the captured.
  Most are small, and wear high collars and long sleeves. When the empire needed power relays in Era 2A, it remade
  Indicolite for that job, so the shrine keepers are the older line, and few new ones are made.
interactions: >-
  Indicolites keep a shrine in small groups, staying in close contact to keep its upkeep and duties running. They
  command Tanzanites and other guards to protect the shrine and themselves. A gem who comes to the shrine to grieve is
  welcome. A gem who comes to cause trouble deals with an Indicolite first.
