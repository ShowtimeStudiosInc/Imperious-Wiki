role: >-
  A Clear Quartz shifts into a Carnelian when drawn toward work in deserts, arid badlands, and scorched planet surfaces.
  They take on the outdoor labor jobs that would wear down almost any other gem, handling heavy clearing, surface
  drilling, and road building under harsh suns and heatwaves. While other crews have to rotate out to avoid overheating,
  Carnelians can stay on-site all day without losing their footing or slowing down. They tend to be tough, stubborn, and
  relaxed about harsh living conditions. Most Carnelians enjoy the wide-open space of desert colonies and prefer the dry
  heat over indoor work stations. Off the clock, many of them stick around the sand dunes to build detailed sand
  structures and small sculptures, taking time to carve out little temporary landmarks around their campsites just for
  fun.
interactions: >-
  Carnelians work the desert jobs other crews have to rotate out of, often beside Smoky Quartzes on drilling sites and
  Zebra Jaspers who guide them across the badlands. Milky Quartzes worry about them, since a Carnelian rarely admits she
  needs a break. Most would rather finish the road first.
