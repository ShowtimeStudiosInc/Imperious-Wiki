role: >-
  This Mega Pearl is a Pearl fused with a Specialty Pearl. Since a Specialty Pearl looks like a certain gem-type, the
  fusion looks like that type fused with a Pearl. If the Specialty Pearl looked like a Sapphire, the fusion looks like
  a Tanzanite. That makes her easy to mistake for a real fusion of that type, which is useful for a gem who isn't
  supposed to exist. Inside the Gempire she only shows up through a licensed marriage, working the job of one of her
  halves. Most of them live as Rogues in places like Drift or the Rogue Settlement, and they tend to look after gems of
  the type they resemble, since that's who their support works best on.
interactions: >-
  This fusion usually forms between a Specialty Pearl and a regular Pearl who serve the same owner. Specialty Pearls
  are won at auction, so their owners tend to want them back, and some hire Aquamarines to find them.
