role: >-
  A Clear Quartz shifts into a Milky Quartz when they gravitate toward caretaking, field recovery, and post-shift rest
  management. They run recovery wards, quiet quarters, and field clinics across frontier settlements, specializing in
  helping overworked crews wind down and recover from physical exhaustion. Easygoing, patient, and deeply gentle, a
  Milky Quartz treats proper rest as a serious skill, often taking the time to guide gems who don't know how to turn
  their minds off after a rough shift. They are legendary sleepers themselves, famous for taking nap breaks in the
  middle of quiet work hours and sleeping through background noise that would keep anyone else awake. Once a Milky
  Quartz goes out for the night, waking them up takes serious effort, leaving most crews to wonder why a gem built for
  restoration needs so much downtime of their own.
