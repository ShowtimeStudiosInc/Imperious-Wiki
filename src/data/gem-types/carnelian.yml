role: >-
  Carnelians do really well in desert like biomes. These soldiers are often assigned to guard facilities on organic
  planets with a lot of sand. They come from the Omicron Kindergarten, which produces gems that can handle some of the
  hottest temperatures around. Not every Quartz soldier has a soft spot for organic planet life, but more than a few
  Carnelians have been caught rolling around in the sand while off duty, making little structures out of it for fun.
  They are no match for the empire's actual terraformers, but it is a cute hobby all the same.
