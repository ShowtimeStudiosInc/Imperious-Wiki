role: >-
  Alexandrites are fusions between Sapphires and any Quartzes, serving the empire as elite advisors and strategists.
  Their Sapphire half lets them see the future, and their Quartz half knows combat, so together they make excellent
  tactical advisors. Most Alexandrites are tall, and look even taller than they are, since they float some height off
  the ground.
interactions: >-
  Alexandrites usually operate on their own as far as their own Gem-Type goes, but often check in with other
  Alexandrites when it comes to tactics and battle plans. They work closely with militia gems, making sure they're
  advised on the best course of action.
