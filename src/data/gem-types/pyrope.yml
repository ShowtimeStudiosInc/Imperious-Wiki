role: >-
  Pyropes were created to organize gatherings, and most host the events they plan, usually for high-ranked gems. They
  can be found wandering high ranking locations and keeping an eye on the venues that make up the Empire's entertainment
  side. Pyropes are known for being quite formal in their work, so formal that they may throw a small tantrum over the
  tiniest thing going wrong. Daily tasks may include touring possible event locations, organizing invites, setting up
  celebration supplies, and general planning.
interactions: >-
  Pyropes host alone or in groups, depending on how big the event is. Hosting takes real social skill, so a Pyrope
  spends as much of an event talking to guests as running it. For anything large, she brings Pezzottaites along to keep
  things on schedule while she oversees the room.
