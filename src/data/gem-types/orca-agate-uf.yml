role: >-
  In the United Frontier, though they still have a group of close friends they call their pods, Orca Agates are often
  found working as tour guides as well as any job close to water! Nobody is assigned to an Orca Agate in the Frontier,
  so her pod is whoever she chooses to keep close, and she looks after them the same way. On water colonies she shows
  visitors and new arrivals around the reefs, harbors, and coastlines, and outside of tours she takes on harbor work,
  diving jobs, and water rescues. She still scouts ahead like Gempire Orca Agates do, so she usually spots danger before
  her tour group reaches it.
interactions: >-
  Orca Agates and Zebra Jaspers both lead tours in the Frontier, and on a long trip they often split it, with the Zebra
  Jasper taking the land and the Orca Agate taking over at the water. Almandines call on them for floods and water
  rescues, since an Orca Agate can reach a trapped gem underwater faster than anyone. Her pod of friends tends to follow
  her from colony to colony.
description: >-
  Orca Agate is typically a mainly black and white striped or spotted agate, though they can come in with red or brown
  as their main colors with black and white as complementary colors. They also have white hair with black streaks that
  ends in shapes that look like fins.
