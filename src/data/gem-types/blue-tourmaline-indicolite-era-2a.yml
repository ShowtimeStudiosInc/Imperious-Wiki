    text: >-
      Indicolite can't make her own electricity like Silver can, but she can pull current out of one source and move it
      into another, acting as a living relay between power grids, machines, and teleportation hubs.
    moves:
      - name: Discharge
        tags:
          - 2 SP
        cost: 2
        text: >-
          Indicolite releases stored charge through a target she's touching, dealing 2d4 + MAG Electric damage. She must
          have drawn power from something since her last Discharge, like a machine, an ally such as a Silver or Copper,
          or an Electric attack.
role: >-
  Indicolites are durable and speedy gems, deployed near generators and teleportation hubs where their toughness makes
  them ideal for conducting and producing the electricity needed to keep the machines running. Male presenting
  Indicolites carry a medium square prism on their chest, while female presenting ones carry it on their forehead. This
  line was made in Era 2A for power work. The original Era 1 Indicolites are shrine keepers, and still serve in that
  role.
interactions: >-
  Indicolites work near generators and teleportation hubs, usually in pairs or small crews. They pull power from Silvers
  and pass it along to wherever it's needed, often handing it to Coppers to carry the rest of the way. When a hub goes
  down, an Indicolite is usually the first gem called in.
