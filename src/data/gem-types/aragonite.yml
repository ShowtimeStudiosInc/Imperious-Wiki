role: >-
  Aragonites are simple fodder, though their skill in navigation should not be overlooked. Though not as good as a
  Rutile's, they are good enough to pilot a ship all the same, with instincts better suited for stellar combat and
  dogfighting. Because of this, they are often deployed as space pirates. Aragonites tend to have light builds. Since
  they are mass produced, many end up with uneven gemstone placement, which can cut their limbs short. Those without
  this problem are seen as a cut above their peers, even if they are not a Perfect Cut.
