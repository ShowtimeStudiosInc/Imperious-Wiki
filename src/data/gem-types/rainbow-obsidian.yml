role: >-
  Rainbow Obsidian was a rare Obsidian variant produced within Omega White Diamond's empire. They retained the immense
  physical strength and durability expected from Obsidian while possessing unusual elemental properties not found in
  modern Obsidian. Their bodies were large, heavy, and difficult to damage, but their physical size limited their speed.
  Very few Rainbow Obsidians were ever produced, making surviving members exceptionally uncommon in the modern Gempire.
