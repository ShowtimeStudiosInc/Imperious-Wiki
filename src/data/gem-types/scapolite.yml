role: >-
  Scapolites serve the empire as singers and entertainers. They can sing a wide range of music and usually perform at
  high ranking events such as balls or clubs. Their voices are powerful enough to shatter glass, so venues that book one
  tend to move the glassware first. They're also one of the few bioluminescent gem-types, so a Scapolite can light her
  own stage.
interactions: >-
  Scapolites perform alone or in groups, depending on what the event calls for and what they've worked out with each
  other. They often plan shows with other gems in entertainment, like Spodumene lines or a Sardonyx host.
