role: >-
  Bluebird Azurite is a fusion of a Ruby and an Aquamarine, and is only found among the Rogues. She is not related to
  the Azurites who work as court clerks; the two just share a name. She keeps her Aquamarine half's water wings and her
  Ruby half's heat.
interactions: >-
  A Bluebird Azurite has good reason to stay clear of Gempire Aquamarines, since tracking down gems who have gone
  missing is an Aquamarine's job, and a Bluebird is half of one.
