role: >-
  Bluebird Azurites are fusions of a Ruby and an Aquamarine, and almost all of them live among the Rogues. Most began as
  an Aquamarine sent out to bring a gem back and the Ruby assigned to guard her on the trip, who fell for each other
  along the way and never came home. Among the Rogues they do the opposite of an Aquamarine's job: they slip into
  imperial territory, find gems who want out, and carry them back to the rogue camps in Sector Null. The Aquamarine half
  knows how a hunter thinks and where she will look, and the Ruby half knows how to keep someone alive on the road.
  Their wings let them lift a passenger over a wall or a crowd, and their steam lets them vanish when a chase goes bad.
  Bluebirds are small, soft spoken, and jumpy, since every one of them knows there is a bounty out with her name on it.
  Inside the Gempire a Bluebird only appears through a licensed marriage, and there she works her Aquamarine half's job
  of retrieval, with her Ruby half as her own escort. She isn't related to the Azurites who work as court clerks. The
  two only share a name.
interactions: >-
  A Bluebird Azurite has good reason to stay clear of Gempire Aquamarines, since tracking down gems who have gone
  missing is an Aquamarine's job, and a Bluebird is half of one. The Topazes who work for Aquamarines are the ones she
  fears most, because a Topaz is usually the one who does the catching. Rubies on escort duty are a different story:
  many of them have heard how Bluebirds begin, and some look the other way. In the rogue camps, Bluebirds are the ones
  who bring the new arrivals in.
