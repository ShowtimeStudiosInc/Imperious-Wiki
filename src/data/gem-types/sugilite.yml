role: >-
  Sugilites are fusions between a Ruby and any Quartz, serving the empire as demolition supervisors. Their job is making
  sure the right structures come down, not just anything in reach, and helping the crews doing the work finish it. They
  swing large demolition axes, used to tear down old structures the empire no longer needs. Unlike most fusions, a
  Sugilite doesn't take her Quartz half's rank. Two militia gems fusing into a supervisor is rare enough that the empire
  ranks Sugilite as Authoritative, so she can give orders on site.
interactions: >-
  Sugilites usually work alone, overseeing the demolition side of construction. Verdelites and other demolition gems
  take their orders from her, and she decides what comes down and in what order.
