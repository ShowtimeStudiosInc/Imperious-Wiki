role: >-
  A Tiffany Stone doesn't have one set job, rather the placement can entirely depend on its components. Most often
  they're either assigned to scout on dangerous missions as both muscle and a way to collect data, or sent to encourage
  and invigorate troops. They are considered a Low Authoritative figure due to their overall sense of empathy and
  responsibility regarding troops, as well as the abilities given to them surpassing the average Quartz. As a fusion,
  they do not have a specific set court, and are instead variable based on where their components originate. This
  often results in them being a part of Theta Gold's court, due to the majority of Orange Spodumenes being from there.
interactions: >-
  Quartzes assigned to Tiffany Stones are often excitable in their presence, as they bring an invigorating and joyful
  feeling to the mission. Tiffany Stones get along well with Orange Spodumenes, most often exchanging stories of
  dangerous colonies and being in battle. The relationship between most Tiffany Stones and Agates is one of passive
  aggression, with the Agate considering it a disrespect to their status and a sort of "loophole."
