role: >-
  Sardonyxes serve the Gempire as comedians, show hosts, and general entertainers in places like Club Imperious. This
  variant is a fusion between a Hessonite and a Pearl. Just as funny as any other Sardonyx type but with a deep
  understanding of the battlefield's tragedies, she helps lift the spirits of militia gems and the Gempire alike. This
  sub-type exists because of years of service from a Hessonite to Crimson Red Diamond. After many sessions with Court
  Crimson's Hematites, she became immune to the memory erasure effect and retired to serve a new purpose instead, a well
  earned retirement from the battlefield, celebrated with her own ceremony.
interactions: >-
  Unlike the Pyrope variant, who hosts for high society, this Sardonyx performs mostly for the militia, at bases,
  stations, and after hard battles. Her comedy comes from what she lived through, which lands with soldiers but can go
  over badly at a gala, so aristocratic hosts tend to book a Pyrope variant instead. Since Hematites can't take her
  memories, she carries every battle she fought, and Selenites sometimes check in on her between shows. Plenty of
  Hessonites still treat her like one of their own.
