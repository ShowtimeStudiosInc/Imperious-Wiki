role: >-
  A Clear Quartz shifts into a Smoky Quartz when she gravitates toward heavy, grounded labor like excavation, demolition
  prep, and foundation work. She handles tasks that require a direct feel for the terrain, using her vibrations to check
  stone stability, loosen packed earth, or crack stubborn rock layers before heavy equipment moves in. Smoky Quartzes
  are right at home in deep soil, dusty worksites, and underground shafts. She is down-to-earth, relaxed, and easy to
  laugh with on the job. No matter how tough, dusty, or miserable a shift gets, a Smoky Quartz keeps her balance and
  uses her quick humor to keep everyone's spirits up. Her steady nature and physical connection to the ground make her a
  reliable presence on any crew, keeping the work moving without letting the stress get to her or the people working
  beside her.
