role: >-
  A Clear Quartz shifts into a Cherry Quartz when they show a sharp mind for catching small mistakes, flaws, and errors
  before anyone else notices. They handle quality assurance, safety inspections, and final reviews across Frontier
  shipyards, factories, and construction sites. Nothing gets put into service or handed over for public use until a
  Cherry Quartz has gone over it with a fine-tooth comb. They are direct, blunt, and don't bother sugarcoating their
  findings when pointing out a bad weld or flawed blueprint. Because of their strict standards, people can sometimes
  find them tough to deal with at first. However, crew members know that a Cherry Quartz's honest critique is what keeps
  everyone safe, and those who earn their respect have a reliable teammate who will always catch a problem before it
  turns into a disaster.
