role: >-
  Padparadschas are often called the poor man's Sapphire, and for good reason. They don't have Clairvoyance the way a
  standard Sapphire does. Instead they draw from a deck of tarot cards made of light, which predicts a set of events
  that may or may not happen that day, depending on whether the gem being read follows the path the cards point to.
  Because their sight comes through cards instead of a direct vision, Padparadschas are seen as less reliable than
  standard Sapphires, which is also why they rank lower. That lower rank opens them up to a much wider range of clients
  than a standard Sapphire gets, and low ranked gems make up a good chunk of who comes to them for a daily reading.
