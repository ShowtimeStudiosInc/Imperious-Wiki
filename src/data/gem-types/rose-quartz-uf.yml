role: >-
  A Clear Quartz shifts into a Rose Quartz when she gravitates toward community-focused work, social support, and
  frontline morale management. She spends her time where people gather, working in settlement hubs, active mess halls,
  or housing quarters, any job that keeps her right in the middle of the group. Rose Quartzes hate being alone and
  thrive on group energy, making them the heart of whatever community or crew they land in. She is rowdy, open, and
  intensely warm, bringing a loud, welcoming presence that brings people together. Because she is constantly tuned into
  the emotions of those around her, she catches personal stress, hidden worries, or rising arguments long before they
  turn into actual problems. She is usually the first person to step in with a harsh reality check or a loud laugh to
  clear the tension, keeping the crew close and making sure no one gets left to struggle on their own.
