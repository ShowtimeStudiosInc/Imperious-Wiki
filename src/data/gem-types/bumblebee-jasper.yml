role: >-
  Bumblebee Jaspers are Quartz soldiers made to guard the places other gems can't stay in for long, like volcanic
  worlds, sulfur vents, and poisoned land that hasn't been cleaned up yet. The fumes that make other soldiers sick
  barely bother them, so they hold posts at mining camps and early kindergarten sites until the ground is safe. They
  work in tight squads of three or four and treat their post like a hive. Each one knows her part of the perimeter, and
  if one is attacked, the whole squad comes running. They're loud and pushy like other Jaspers, but they're very
  protective of the gems working inside the lines they guard.
interactions: >-
  Bumblebee Jaspers usually guard the Malachites who clear toxic planets, since they can stay in the fumes as long as
  the Malachite can. Regular Jaspers tease them for smelling like sulfur, and a Bumblebee Jasper always teases back.
  Agates like having a squad of them, because they rarely need to be told twice to hold a line.
