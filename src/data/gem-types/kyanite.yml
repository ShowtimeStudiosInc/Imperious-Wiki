role: >-
  Kyanites serve the gempire as elites within Epsilon Blue's entourage, taking on the role of judge in trials, though
  not the highest ranking kind. They sit at the head of the stand in court to oversee cases and decide the fate of a
  Zircon's client. They are known for their sharp intuition, shown by how easily they can tell when a gem is lying or
  telling the truth, which makes them very well suited to the role.
interactions: >-
  From the high seat, a Kyanite runs everything that happens inside a case. She works with the Zircons arguing it, their
  clients, witnesses, the authorities who brought the case in, and other judges when a case is too big for one. Azurites
  keep her paperwork in order.
