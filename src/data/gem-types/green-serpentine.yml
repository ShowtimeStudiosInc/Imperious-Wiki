role: >-
  A Green Serpentine's job isn't much different from a Scapolite's. She acts as a change of pace for when a Scapolite's
  voice starts to feel dull. By fusing with a Lapis Lazuli, her singing voice grows even stronger and gains more range.
  Gems say listening to a Green Serpentine sing feels like a lullaby, and while her soft voice is calming, it can also
  pull listeners in without them meaning to be drawn.
