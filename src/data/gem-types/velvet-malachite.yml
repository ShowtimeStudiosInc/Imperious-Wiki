role: >-
  Velvet Malachites are fusions between a Catseye and a non-fusion Malachite. They're usually formed when a high-ranking
  official wants a job done quickly and quietly, so most of them work as spies or assassins. Their dark green coloring
  helps them blend into the dark. The Catseye half gives them the agility to get in and out of tight spaces, and the
  Malachite half lets them shape stone to open a way in and handle toxic air that would stop other gems.
interactions: >-
  A Velvet Malachite takes her orders from the official who had her formed, and rarely from anyone else. She keeps away
  from Catseyes and Malachites working their normal jobs, since being recognized ruins the work. Era 0 Hessonites, who
  handle Court Alpha's spying, sometimes bring one in for a job that needs more strength than stealth.
description: >-
  Tall, lean, and strongly built, like a dark green black panther with four arms. She looks a lot like a Catseye, only
  taller and without the liquid parts.
