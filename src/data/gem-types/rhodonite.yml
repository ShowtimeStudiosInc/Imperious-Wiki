role: >-
  Rhodonites are not much more than souped up Rubies, their biggest edge being higher health. They usually show up mid
  battle when a Pearl joins a squad of Rubies, and serve as support soldiers and guards. Most fight with a dagger-staff,
  used for both attack and defense. Court Maroon is where they show up most, though they can appear in any court.
interactions: >-
  Because of her Ruby half, a Rhodonite often fights with the rest of that Ruby's squad. If her Pearl half serves a
  higher-up, the fusion works alone instead, guarding that gem, often a Sapphire or another aristocrat.
