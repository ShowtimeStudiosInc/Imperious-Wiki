role: >-
  A Clear Quartz shifts into an Aventurine when they get drawn toward farming, crop management, and land care. They
  handle most of the food growth and green space maintenance across frontier settlements, spending their days working
  directly with crops, trees, and soil. Most Aventurines prefer working outside with their hands in the dirt over
  staying indoors or handling heavy machinery. They tend to be patient and easygoing, usually keeping a steady pace that
  fits the slow process of growing food. On farming settlements, they use their plant control to speed up harvest
  cycles, save dying crops, or weave heavy root walls to protect fields from bad weather and wild animals. If a
  settlement gets attacked, an Aventurine can turn thick vines and sharp thorns into quick barrier walls to keep trouble
  out until help arrives.
interactions: >-
  Aventurines grow the Frontier's food and keep its green spaces, working with Blue Quartzes who manage the water lines.
  They supply the mess halls where Rose Quartzes gather crews. Milky Quartzes often send overworked gems to spend a
  quiet day on an Aventurine's farm.
