role: >-
  Strawberry Quartzes are the militia's runners. When a battle cuts off communication, or a message is too important to
  send over a line someone could be listening to, a Strawberry Quartz carries it by hand. They run orders between
  squads, bring reports back to Agates and Hessonites, and go for help when a unit is pinned down. They're cheerful,
  chatty, and always on the move, and most of them know every gem in the barracks by name, since they've delivered
  something to all of them at least once.
interactions: >-
  Strawberry Quartzes take their orders from Agates and Hessonites and carry them out to every squad on the field. Rose
  Quartzes love them, since a Strawberry Quartz always has news. Cherry Quartzes get along with them a little too well,
  because a runner hears everything and a Cherry Quartz wants to know all of it.
