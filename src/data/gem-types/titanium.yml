role: >-
  Titaniums are powerhouses of a gem, seen on the battlefield as high ranked soldiers. Being strong metals, they can
  take a lot of hits before poofing, and they're among the hardest gems in the empire to shatter. That's why they're
  sent to the front, pushing through enemy lines with a large battle hammer and a light shield. Combined with their
  ability to summon shields, this makes them a dangerous foe, often taking the lead in combat.
interactions: >-
  Titaniums work in teams, taking orders from the Platinums who oversee them. On the front line, they stand side by side
  and line up their shields into one wall against incoming fire.
