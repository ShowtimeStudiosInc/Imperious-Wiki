role: >-
  Eucryptites are small but mighty grunt soldiers and scouts. They work as bodyguards and escorts, and back up other
  soldiers in battle. Their glow and natural versatility make them a great choice for any environment. Each one is
  issued a pair of daggers, one for striking and one for blocking, and is trained to guard whatever gem she's assigned
  to.
interactions: >-
  Eucryptites deploy in cohorts of 3 to 5, and are often paired with Ruby cohorts of the same size. The Rubies bring the
  brute strength, and the Eucryptites bring speed and light. Both answer to high-ranking militia like commanders and
  lieutenants.
