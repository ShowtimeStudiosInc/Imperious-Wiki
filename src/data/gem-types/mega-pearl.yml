role: >-
  A Mega Pearl is two Pearls fused into one, and she's taller than both of her halves put together. The Gempire never
  found a job for her, since she can't do much more than a regular Pearl. If one ever shows up there, it's through a
  licensed marriage, and she goes back to one of her halves' old posts. Most Mega Pearls leave instead. In places like
  Drift or the Rogue Settlement, she's the one holding everything. Supplies, tools, spare clothes, and the camp's
  records all get stored in her Hammerspace, which makes her the first gem anyone looks for when something goes
  missing.
interactions: >-
  Mega Pearls usually come from two Pearls who worked in the same household. In rogue camps, they often work with
  Andean Opals to keep things running.
