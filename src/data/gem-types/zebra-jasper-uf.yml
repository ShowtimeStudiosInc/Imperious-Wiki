role: >-
  A Clear Quartz shifts into a Zebra Jasper when they are drawn toward working as wilderness guides, leading crews
  through caves, storms, unmapped terrain, and disorienting badlands, and open-plains trek leaders. Whenever a crew
  needs to cross exposed badlands, sprawling savannahs, or unmapped frontier territory where hostile wildlife or sudden
  weather poses a threat, a Zebra Jasper leads the way. They generally like jobs where they can spend their days
  outdoors navigating rough country with a crew. They thrive on the open trail, matching their high physical stamina
  with a keen eye for terrain hazards. A Zebra Jasper stays aware of the whole group's pace, making sure nobody lags
  behind or gets separated in blinding dust or tall brush.
