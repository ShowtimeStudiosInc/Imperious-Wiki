role: >-
  A Clear Quartz shifts into a Jasper when they gravitate toward heavy physical labor, site security, and frontline
  protection work. They take on jobs that require raw durability and staying power, from guarding remote outposts to
  clearing heavy collapse hazards on dangerous worksites. Jaspers are built to take a beating and keep moving forward,
  serving as the physical shield for whatever crew they join. On the surface, Jaspers come across as loud, brash, and
  aggressive about getting the job done. Beneath that rough exterior, they carry a deep sense of responsibility for
  their teammates, actively putting themselves in harm's way so others don't have to take the hit. They are the ones who
  hold the line when an overhang gives way or a site security breach happens, ensuring everyone else makes it home in
  one piece.
