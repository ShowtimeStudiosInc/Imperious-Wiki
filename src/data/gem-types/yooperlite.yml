role: >-
  Similarly to Clinohumites, Yooperlites work with heat. Contrary to them, Yooperlites are not as physically strong or
  resilient, but appear to be more capable of large scale destruction solely with their lava terraforming abilities
  rather than fire. On smaller jobs, they slice through terrain with lava so construction workers can build facilities
  and spires.
interactions: >-
  Yooperlites usually work alone, but join other terraformers, including other Yooperlites, on bigger jobs. They check
  with the rest of the crew before they start, since lava is hard to take back once it's poured.
