role: >-
  Opals are fusions between any Quartz and a Pearl, serving the empire as long-range archers. They fight with a bow and
  arrows made of light, used for both attack and defense, with the strength of the Quartz behind each shot and the
  Pearl's aim guiding it. Most are formed when a Quartz fuses with her Pearl to handle a fight the two couldn't win
  apart. Not to be confused with the non-fusion Opals who run the empire's libraries.
interactions: >-
  Opals usually work alone, assigned to their posts by higher-ups. When a battle needs planning, they'll sit down with
  other Opals or other militia to work out where the archers should stand.
