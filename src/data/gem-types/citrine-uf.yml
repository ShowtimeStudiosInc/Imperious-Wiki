role: >-
  A Clear Quartz shifts into a Citrine when they gravitate toward demolition and salvage work. They specialize in
  tearing down old structures, breaking apart wreckage, and stripping usable metal out of scrap piles that would
  otherwise take a full crew days to clear using heavy machinery. The Prism shift gives them the exact tools for the
  job, letting their body produce an acid sharp enough to dissolve worked metal on the spot. Citrines are blunt, direct,
  and say exactly what they think without filtering it. That no-nonsense attitude works well on demolition sites, where
  their entire day consists of deciding a structure needs to come down and physically making sure it does. Off the job,
  their straightforward honesty makes them easy to read and reliable teammates who never beat around the bush.
interactions: >-
  Citrines tear down and salvage what other crews leave behind, handing usable metal to Amethysts for new builds. Smoky
  Quartzes usually prep a site before a Citrine moves in. Their bluntness clashes with Rose Quartzes, but Cherry
  Quartzes find it refreshing.
