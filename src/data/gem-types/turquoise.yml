role: >-
  Turquoises have long been made to craft weapons for the Gempire, bringing a long lineage of forge masterwork and
  armaments production. They run heavy foundries, weapons bays, and field armories, turning raw ores and alloys into
  reliable gear for frontline forces. They treat weapon crafting as a serious, hands-on discipline rather than simple
  assembly line work. A Turquoise takes personal pride in the balance, durability, and edge of every piece that leaves
  their forge, often testing their creations directly to ensure they hold up under real combat conditions. Practical and
  sharp-minded, they are the backbone of supply lines, making sure anyone heading into danger has gear they can trust.
