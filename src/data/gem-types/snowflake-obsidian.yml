role: >-
  Snowflake Obsidians serve the empire as terraformers for metal-rich land, which makes them a perfect fit for
  construction and building sites. They're natural excavators, able to dig through soil full of metal with ease and
  carve out holes and trenches wherever the empire needs them. Most are medium to tall, with large shoulder pads.
interactions: >-
  Snowflake Obsidians work in teams, digging and terraforming land with heavy metal deposits. They often work with
  Bismuths and other construction gems. The Snowflake Obsidians clear the ground, and the Bismuths build on it.
