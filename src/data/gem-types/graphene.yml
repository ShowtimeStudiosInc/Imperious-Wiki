    text: >-
      Graphene shrinks her body way down, small enough to fit into tight spots or get a close look at things. While
      shrunk, attacks need +2 to hit her, but her <:Fight:1568035371974135940>FIGHTs deal half damage. Growing back is
      free. Her gemstone stays the same size, which limits how small she can get.
    moves: []
role: >-
  Graphenes are built for shapeshifting. They are mainly used for science, being able to shrink down to tiny
  proportions, get into small spots, and get a good view for observation. They are also sometimes used as meat shields
  because of their tankiness. Her gemstone is a small gray torus, about the size of a sesame seed.
interactions: >-
  Graphenes assist Serpentines in the lab, shrinking down to see what goggles can't. On colonies they help Peridots by
  crawling inside broken machines. Since they're tanky, Steels and Topazes sometimes use one as a meat shield, which
  most Graphenes put up with better than they should.
