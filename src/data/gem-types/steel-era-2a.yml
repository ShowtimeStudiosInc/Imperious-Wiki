role: >-
  Era 2A Steels serve the empire as security and containment agents. They respond to calls about rebel attacks, enemy
  forces, and anything else that puts the empire's gems in danger. When a threat needs to be held, a Steel restrains it
  and brings it to a containment cell for questioning.
interactions: >-
  Era 2A Steels work with the Era 0-1 Steels who handle organics. When a call involves something dangerous, like a beast
  that won't calm down or a rebel hiding among the wildlife, an Era 2A Steel goes in first and holds it in place so the
  older Steels can work safely.
