role: >-
  Celestites run the Gempire's med bays and medical wards. They were made in Era 1 from Era 0 records of the Celestine,
  since the empire could never produce a true Celestine of its own. The copy came out close, but not quite there. A
  Celestite can seal a crack, but not mend it, and most never learn to fly. They make up for it in knowledge. A
  Celestite assigns Angelites to their patients, sets the Arch-Angelites over each ward, and decides which cases get
  sent on to a Selenite or a Hematite. They serve every court, and you'll find at least one wherever the empire keeps a
  med bay.
interactions: >-
  Celestites work over Arch-Angelites and Angelites, and next to Polyhedroid Agates on stations where Quartz soldiers
  need healing. When a patient's trouble is in their mind, not their body, a Celestite hands the case to a Selenite, or
  to a Hematite if it can't wait. They tend to keep a short list of the cracks they've sealed, and check on each one
  until it's been properly mended.
