role: >-
  Lead doesn't really fit into Homeworld, at least not the way they were made to. In the Metal Society they were the
  main makers of ammunition, producing small, forceful bullets for guns. Homeworld doesn't use bullets or guns, so that
  job was dropped when Metals joined the Gempire. Now they work in groups around construction sites as anchors for heavy
  material handling and shipping. Lead are very dense and fairly common, so a group of them is extremely heavy, which
  makes them ideal as dead weight for levers and pulley systems. Their bodies also make a toxin, which is harmless in
  passing but dangerous to anyone who handles a Lead for a long time.
interactions: >-
  Lead work beside Tungstens on construction and shipping sites, with the Tungstens moving loads and the Lead holding
  them in place. Bismuths and other builders set up their pulleys and cranes around a group of Lead. Most gems keep
  their gloves on around one, since a Lead's toxin builds up the longer you touch her.
description: >-
  Lead is spiky and usually jagged, but when made it forms a silvery-gray, textured, blocky substance that is extremely
  dense, durable, and mildly toxic to handle.
