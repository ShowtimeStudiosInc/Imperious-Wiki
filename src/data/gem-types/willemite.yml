  - section: Signature Ability
    name: Bioluminescence
    tags:
      - PASSIVE
    cost: null
    text: >-
      Willemite's body makes its own light. While she's in the party, total darkness counts as dim for the Star Gauge,
      so her party still gains marks at the start of each round.
    moves: []
role: >-
  Willemites work in the Empire as aerial surveillance and overwatch, monitoring surrounding areas with radar to make
  sure they're clear of threats or anything else that needs reporting. They usually ride along with Nephrites or on
  larger ships, where someone else does the flying and they can keep their eyes on the radar. New Willemites will
  typically be under Court Maroon, while those of Era 1 and Era 0 will typically be seen in Alpha Black's Court.
interactions: >-
  Willemites work with militia gems, watching their routes from inside a ship, especially in the air. When a combat site
  gets rough, the Willemite is the one telling the soldiers what's coming and where it is. Threats she spots away from a
  battle usually go to a Flint, who sends in the Steels.
