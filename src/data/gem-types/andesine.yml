role: >-
  Andesines serve the Gempire as demolition workers and excavators. They're stationed at colony sites and sent in to
  clear land for building. With heavy tools and blasting charges, they break down boulders and rubble. Their job is
  only to take things apart, so other gems harvest or refine whatever they dig up.
interactions: >-
  Andesines work in pairs or small teams of three to five, along with other geoformers, depending on how big the site
  is. They're usually sent to active dig zones and old, shut-down structures to clear a path. They take direct orders
  from Sugilites and Blastoids, who run the sites and decide where and when a charge can go off, so the planet and the
  site aren't damaged.
description: >-
  Most Andesines are medium to tall, with a sturdy build made to take shockwaves and falling rubble. They wear utility
  belts, visors, goggles, or hardhats.
