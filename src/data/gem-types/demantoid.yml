role: >-
  Demantoids are technical supervisors who run technical tasks and oversee material and gem production sites. They can
  usually be found wandering technically involved locations, often falling under Kandy Innovations, or handling
  technical tasks across the Empire. Demantoids are known for being dedicated to their work and deep into their studies,
