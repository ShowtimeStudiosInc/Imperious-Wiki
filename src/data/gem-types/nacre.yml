role: >-
  Nacres are the only gem type capable of creating life besides the Diamonds, and gems often call them the Mother of
  Pearls. While they do not hold much authority compared to other high ranking figures, they have full control within
  the Reef, where they create Pearls and send them out to gems and places that need help with small tasks. A Nacre can
  rejuvenate a Pearl she made, but most see it as the hardest part of the job and only do it when nothing else can help.
  This gem type was created by Alpha Black Diamond, making it one of the few Legacy Gem Types that exist, and an even
  rarer Era 0 Legacy on top of that. Most Nacres near Homeworld are Era 0 gems, with Era 1 Nacres showing up further
  out, and Era 2 Nacres being the rarest of all.
interactions: >-
  Nacres work alone or in pairs, and a Reef rarely has more than two. They keep new Pearls on standby until they're
  chosen, and give each one etiquette training suited to the kind of higher-up she's likely to serve.
notes:
  - 'Staff note: rejuvenating a player''s Pearl always needs that player''s agreement out of character first.'
