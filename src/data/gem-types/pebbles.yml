role: >-
  Pebbles are rarely made intentionally, as they're often the result of injector byproduct/kindergarten byproduct and
  thus are treated with very little respect outside of their job as the assistants to Rhodochrosites. As the assistants
  to Rhodochrosites, their job is to do artisanal detail-oriented outfits for the upper class. Since Rhodochrosites
  aren't tied to one court, Pebbles usually stay in the court they were made in and work for whichever Rhodochrosite is
  present in the court.
interactions: >-
  Pebbles work in small groups under a Rhodochrosite, doing the stitching and detail work while she designs. Most gems
  barely notice them, but a Rhodochrosite who loses her Pebbles finds out fast how much they were doing. When a Ruby is
  the guard for a Rhodochrosite, a Pebble may become attached to her in hopes of kinship in their height and
  insignificance, and the Rubies often find them irritating. Bismuths sometimes stumble upon small holes and burrows in
  their architecture while working on improvements, making it potentially unstable for expansion, so most of them see
  Pebbles as vandals. Pearls can sometimes be found acting as models for Pebbles, in a mutual understanding of what it
  means to be a servant, with the Pebble getting practice and the Pearl receiving a fashionable new look.
