role: >-
  Sphenes are fusions between Peridots and Pearls, combining each gem type's strengths to create a gem proficient in all
  technologies. A Peridot may fuse with her Pearl to take some of the weight off running a kindergarten. They typically
  are found in the Empire either helping with kindergarten work or maintaining damaged technology as repair technicians.
  Most float a little off the ground and carry modular limb enhancers, built up from the ones their Peridot half was
  issued.
interactions: >-
  Sphenes usually work alone but will team up with other Sphenes or technical gems. They travel the empire on request,
  or on their own when they spot a problem, making sure production runs smoothly and fixing or updating any hardware
  that needs it.
