role: >-
  Amazonites are fusions between Peridots and Lapis Lazulis, serving the empire as weather modifiers and strong
  terraformers. Since they can work both metal and water, they're good at changing weather patterns, which helps
  construction go ahead when the weather would otherwise be too dangerous to build in. Most Amazonites are medium to
  tall, wearing basic empire uniforms with baggy pants or shorts. They have two sets of wings, four in total.
interactions: >-
  Amazonites usually work on their own, but often spend time with other Amazonites or with technical and terraforming
  gems. With a Lapis half and a Peridot half, they can handle terraforming and tech work alike.
