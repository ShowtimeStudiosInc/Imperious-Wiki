role: >-
  Dark Blue Hawk's Eyes are fusions between a Topaz and a Jasper. They aren't a common fusion. They usually form in the
  middle of a battle, when the fight needs a lot of muscle, either to take on enemies or to move heavy objects out of
  the way when no Tungsten can be reached. Most don't last long and unfuse once the job is done. Not all of them are
  only soldiers, though, and some are protective and caring toward the gems around them. A Hawk's Eye whose Topaz half
  has learned Shockwave Generation can knock enemies down and collapse structures, but it throws off the whole
  battlefield, for better or for worse.
interactions: >-
  Hawk's Eyes form on the front line, usually from a Topaz and a Jasper who were already fighting side by side. Agates
  sometimes call for one when a wall or blockage needs to come down and no Tungsten is nearby. Tungstens don't mind,
  since it means one less heavy job for them.
description: >-
  The gem is mostly blue, very dark in color, with stripes of color coming out of it, in this case yellow. It looks like
  an eye from certain angles, and it's said a stare from this fusion makes even the strongest soldiers flinch.
