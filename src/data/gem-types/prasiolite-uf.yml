role: >-
  A Clear Quartz shifts into a Prasiolite when she gravitates toward hands-on technical construction and assembling gem
  tech across the United Frontier. Instead of spending time studying schematics or measuring layouts, she works by raw
  instinct, assembling complex machinery straight out of the box or off the scrap pile. She is the builder crews call
  when an entire installation needs its tech systems put together from scratch on a tight deadline. Prasiolites are
  hardware enthusiasts through and through, taking clear pride in going from a mess of loose gears and wiring to a fully
  operational machine in record time. On breaks, she is the type to talk your ear off about new tech releases, lab
  prototypes, and hardware design. Her knack for seeing how individual components fit into the big picture makes her a
  huge asset on any job site where building things quickly and correctly matters.
