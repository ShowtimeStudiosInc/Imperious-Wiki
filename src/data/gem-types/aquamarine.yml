role: >-
  Aquamarines are bounty hunter gems operating under Court Epsilon, tasked with traveling from planet to planet to
  retrieve items or gems. When they are not hunting down a target, they can be found wandering the Canis Major station
  or any other imperial location. Their speed and strength are something every gem wants to see, but not experience
  firsthand. Known for hunting down a target until the job is done, Aquamarines are extremely determined to finish their
  mission. Daily tasks may include cargo runs, tracking down elusive gems, ordering troops around, and organizing trial
  operations. They are quite bossy little things.
