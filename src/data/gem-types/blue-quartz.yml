role: >-
  Blue Quartz soldiers are honestly really chill, both in mood and in nature. These soldiers seem to be in tune with
  water and ice. They pair nicely with Aventurines, who know a lot about a planet's earthly matter and plant life. If
  you're ever tense and worked up, a Blue Quartz knows just how to calm you down. If these Quartzes were assigned to a
  planet with lots of water, they would be the best soldiers for that kind of environment, since they swim well and move
  easily through water. It's no wonder Lapises fuse with Blue Quartzes so often, their interests in water just line up.
