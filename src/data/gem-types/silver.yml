role: >-
  Silvers are one of the many technical gems in the Empire. These guys serve the Empire as electrical generators and
  conductors. They can generate their own electricity, making their work a whole lot easier. Most wear electrical
  equipment on their backs to store and route the power they make.
interactions: >-
  Silvers work with Coppers and other technical gem-types. A Silver makes the power, and a Copper carries it to the
  panels and ports that need it. Between the two of them, the empire's facilities and tech stay running.
