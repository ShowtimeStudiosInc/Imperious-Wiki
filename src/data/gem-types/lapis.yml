role: >-
  Lapis Lazulis are the pride of the Empire's terraforming forces, used mostly for large, destructive projects. Work
  such as carving the canyons for kindergartens, redirecting water, and emptying or creating bodies of water generally
  goes to a Lapis. On smaller jobs, they slice through terrain with water and move the land so construction workers can
  build facilities and spires. They are also very capable of defending themselves despite not being physically strong.
  No number of soldiers is going to easily power through a tidal wave.
interactions: >-
  Lapis Lazulis usually work alone. On bigger projects they join other terraformers, including other Lapises, with each
  one taking a stretch of the land.
