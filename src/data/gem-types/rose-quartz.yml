role: >-
  Rose Quartz soldiers are pretty rowdy and fun to be around. They crack jokes a lot and are caring toward the gems they
  are close to. Rose Quartz soldiers hate being alone and really like company, so they are often assigned with other
  Quartz groups to guard and defend facilities or structures. They tend to get in trouble with Agates a lot though. This
  Quartz type seems to rebel every so often, just to grab a little freedom, take a break, and have some fun.
interactions: >-
  Rose Quartzes hate being alone, so Agates post them with other Quartz groups and almost never on solo watch. They're
  the ones who sneak off with Milky Quartzes for a break, which keeps both in trouble. Selenites tend to like them,
  since a Rose Quartz will talk about how she feels without being asked twice.
