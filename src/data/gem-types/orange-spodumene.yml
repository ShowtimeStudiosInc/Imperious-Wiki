role: >-
  Orange Spodumenes monitor the pH levels of new colonies, eating native plant life to predict which places would be
  best for kindergartens. They can do this thanks to a tube-like pocket in their abdomen that holds a light-based acid.
  The acid breaks down the plants and projects what it finds over the Orange Spodumene's inner body, turning it Red,
  Orange, Yellow, or Green, while her glossy outer shell stays the same and keeps the acid contained. They're usually
  found on the ground of recently colonized planets, in thick plant life like forests, jungles, or coral reefs, and once
  they have a finished report for an area, they hand their findings to their supervisors. Most of them are part of Theta
  Gold's court, since they're so good at finding the best conditions for kindergartens, but they can be found in any
  court, because expansion can't happen without them.
interactions: >-
  Orange Spodumenes report their findings to Demantoids and Rutiles, who decide where kindergartens go. They work beside
  Aventurines and Green Tourmalines in thick plant life, though gardeners don't love watching them eat the samples.
  Regular Spodumenes see them as distant cousins with a very strange job.
