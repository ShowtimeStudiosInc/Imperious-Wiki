role: >-
  Hessonites command the empire's ground troops. Where an Emerald runs a fleet from the bridge, a Hessonite is down on
  the field with her soldiers, sword in hand. She uses it to cut a path open as often as to hold one, and a Hessonite
  who hasn't drawn her sword by the end of a battle usually counts it as a bad one. Off the field, they keep combat
  installations in working order, check weapons and supply counts, and report to higher ups.
interactions: >-
  Hessonites usually work alone, with a unit of lower-ranked militia under them. They look after their own court's
  militia first, but in a crisis a Hessonite will take command of any soldiers in reach, whatever court they belong to.
  Most soldiers have learned it's easier to follow her than to argue.
