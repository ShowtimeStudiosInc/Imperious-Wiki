role: >-
  Spinels are the empire's bubbliest performers! With their elastic forms and larger-than-life personalities, these gems
  will never leave you bored. Most are assigned to a high-ranked gem as her own personal entertainer, though some
  perform for whole crowds. A Spinel lives to entertain, whether they're performing for a crowd of observers or their
  own dedicated elite!
interactions: >-
  A Spinel can entertain a gem alone, or team up with other Spinels and entertainers for a bigger show. They're bubbly
  and social, and they'll do whatever it takes to get a gem laughing, which makes them some of the best morale boosters
  in the empire.
