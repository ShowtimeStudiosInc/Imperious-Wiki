role: >-
  Irons are training assistants, capable of training gems to be better fighters in service of the Gempire. This
  typically applies to militia, but they can also assist any gem with some combative ability. They're small, but they
  hit a lot harder than they look, and they can take many hits before poofing.
interactions: >-
  Irons spar with militia gems and with each other. During a session, an Iron watches for the spot where a gem slips up,
  like a dropped guard or a slow step back, and tells her how to fix it. A soldier who has trained with an Iron usually
  has the bruises to prove she learned something.
