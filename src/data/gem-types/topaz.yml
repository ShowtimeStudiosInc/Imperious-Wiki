role: >-
  Topazes are high ranking soldiers within the Gempire. Their duties often take place on battlefields or in high class
  facilities as guards, using their strength to protect other gems from threats or danger. They fight with a pugil, used
  for both attack and defense. Topazes often fuse with each other to get stronger, and a guard post with one tall Topaz
  on it may really have two.
interactions: >-
  Topazes guard facilities and fight alongside other militia, usually hand to hand. Higher-ups like Aquamarines assign
  them their tasks, and a Topaz often travels with an Aquamarine, Amber, or Beryl on duty.
