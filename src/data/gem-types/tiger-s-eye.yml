role: >-
  Tiger's Eyes are Quartz soldiers made for the night watch. They patrol bases, borders, and wild planets after dark,
  when most other soldiers are resting or can't see far. They move quietly, keep low, and would rather pounce on an
  intruder than chase one. Tiger's Eyes are proud and a bit showy, and they love being called the empire's hunters, but
  they take the safety of the gems sleeping behind them very seriously.
interactions: >-
  Tiger's Eyes take over from Cloud Quartzes and Zebra Jaspers when the sun goes down, and Milky Quartzes are always
  glad to hand them the overnight watch. They don't get along with Citrines, since both like to be the loudest in the
  room. A Tiger's Eye who catches an intruder will tell the story to every Quartz in the barracks.
