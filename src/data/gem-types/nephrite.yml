role: >-
  Nephrites serve the empire as transport and cargo pilots. These gems have innate skills in aviation and piloting.
  They're also skilled technicians, adept with both the simple and incredible tech that the empire has to offer.
interactions: >-
  Nephrites fly alone or in teams, and are assigned to higher-ups who need to get somewhere. Emeralds and Fluorites rely
