role: >-
  Cactus Quartzes are Quartz soldiers made for dry worlds, where water is hard to find. Most of them learn to store
  water inside their forms, so they're assigned to squads that need it. Malachites and Lapises can't use their water
  powers without water nearby, so a Cactus Quartz travels with them and carries their supply. She also carries extra for
  putting out fires, cooling down machines, and keeping organic samples alive. In a fight, tiny spikes come out of her
  hands and add damage to every punch, so Agates usually put her at the front of the squad.
interactions: >-
  Cactus Quartzes travel with Malachites and Lapises on dry worlds and carry the water they need to work. They share
  desert posts with Carnelians, who handle the heat and sand while the Cactus Quartz handles the water. Rubies and
  Eucryptites learn not to stand too close to one in a fight.
description: >-
  Their gem is like any other quartz, but what's different is that they have tiny, sharp grooves within them, imitating
  a real life cactus.
