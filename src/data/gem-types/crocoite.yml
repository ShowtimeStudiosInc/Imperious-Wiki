    text: >-
      Crocoite picks up tracks, scent trails, and signs of passage that most gems walk right past. Outside of battle,
      she can follow any creature's trail that's less than a day old. In battle, hidden or camouflaged enemies can't
      hide from her, and wild creatures can never catch her party by surprise.
