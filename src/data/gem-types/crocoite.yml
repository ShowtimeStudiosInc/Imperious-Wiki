role: >-
  Crocoites serve the empire as wranglers and outback rangers. They track down, round up, and move dangerous wildlife
  out of sectors where it shouldn't be. Armed with capture tools and a sharp eye for tracks, they keep colony building
  sites and active facilities clear of threats, whether those threats are wild creatures or stray gems. Most Crocoites
  come in deep reds and oranges, and wear rugged uniforms made for rough terrain.
interactions: >-
  Crocoites patrol border zones alone or in pairs, and sweep a site with construction crews and other geoformers before
  any building starts. They are the gem side of the work Era 0-1 Steels do. A Crocoite tracks down and corners a
  creature like a Crystal Crab or Crystal Crocodile, and the Steel moves it safely to a containment sector or one of
  Epsilon Blue's rehabilitation facilities.
