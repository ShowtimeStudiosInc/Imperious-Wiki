    text: >-
      Cubic Zirconia carries a fragment of her Diamond sibling's essence. It gives her a lesser version of that
      Diamond's powers, or her own set of abilities drawn from a Sub-Domain of her Diamond's Domains. The umbrella has
      no SP cost. Each move built under it does, and is set on her own sheet.
    moves: []
role: >-
  Cubic Zirconias are Diamond-like transcendent gems, created as regional managers who oversee specific territories
  within the Empire. Though not true Diamonds, they carry a fragment of their sibling's essence, giving them powers that
  resemble, but never fully match, the abilities of the Diamond they emerged alongside. Their authority stays local,
  making sure each region stays loyal, efficient, and lined up with the bigger goals of their ruling Diamond. Diamonds
  and their Zirconias share a sibling bond. When not working, they can usually be found at Club Imperious or other high
  ranking locations.
interactions: >-
  A Cubic Zirconia answers only to their Diamond and gives orders to every rank below them within their region. They
  work most closely with the Authoritatives who run that territory day to day, like Emeralds, Hessonites, and Zoisites.
  Because of the sibling bond, a Zirconia can be the easiest way to get a Diamond's ear, or the hardest wall to get
  past.
