role: >-
  Beryls are authoritative bounty hunter gems operating under Court Emerald, tasked with traveling from planet to planet
  to retrieve items or gems. When they are not hunting down a target, they can be found wandering District 3 of
  Homeworld or any other Gempire owned location. Their speed and precision are something every gem wants to see, but not
  experience firsthand. Known for hunting down a target until the job is done, Beryls are extremely determined to finish
  their mission. Daily tasks may include cargo runs, tracking down elusive gems, ordering Topazes around, and organizing
  scouting operations. Most Beryls are small in height and wear square shaped hairstyles, sticking to standard Gempire
  uniforms rather than anything decorative.
interactions: >-
  Beryls usually work alone, but can assign a Topaz to join them on scouting missions. The Topaz guards the Beryl and
  brings extra blunt force if a job turns physical.
