role: >-
  Pezzottaites serve the empire as official party and event helpers, working as assistants to Pyropes. With their
  heart-shaped checklists, confetti, streamers, and colorful lights, they can turn up at any event and make it a little
  flashier. They range from pink to red in color.
interactions: >-
  Hosting a large event with a lot of guests can overwhelm even a Pyrope, so Pezzottaites handle the running order while
  the Pyrope oversees the room. A Pezzottaite always knows what's on the checklist next, usually because she's holding
  it.
