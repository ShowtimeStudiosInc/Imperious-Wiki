role: >-
  Tanzanites serve the empire as guardians for the Indigium Shrine and other shrines like it. Quartzes and Topazes can
  handle guard work, but shrines needed gems made for it, so Tanzanites were created as a specialty and are rarely sent
  anywhere else. Most are tall and stocky, with helmets that cover their eyes and large shoulder pads. They fight with
  large swords, used for both attack and defense.
interactions: >-
  Tanzanites work alongside each other and serve under shrine keepers like the Era 1 Indicolites. They guard parts of a
  shrine directly, protecting its statues, figures, and remnants. They can be assigned to war duties, but most are kept
  at the shrines.
