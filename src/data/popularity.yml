# Diamond Approval Rating: how the Gempire as a whole feels about each Diamond and Grand Regent.
# This is in-world standing, not a member vote.
#
# It updates by itself. Every 2 hours scripts/world-events.mjs rolls a small event from
# src/data/events/pool.yml, every few days a medium one, and every Sunday morning a weekly report
# (a big event, an update roll for everyone, and a new poll). Medium and weekly ones post to Discord.
# To run one by hand: GitHub, Actions, "World events", Run workflow.
#
# You can still edit this file by hand (for example after a story event). Add a line at the TOP of `log`:
#   who: a slug from the lists below, change: +3 or -2, kind: event, text: what happened, in-world
# and change that gem's `score` to match. `previous` is filled in by the script (score 7 days ago).
# `unrest` (0 to 100) is the Gempire-wide Unrest meter. High Unrest unlocks worse events.
# Diamonds without a page yet need a `name:`.
