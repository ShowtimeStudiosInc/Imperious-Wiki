# Gempire Popularity: how the empire as a whole feels about each Diamond and Grand Regent.
# This is in-world standing, not a member vote. Staff update it:
#   - with a roll for each entry (rise, drop, or stay the same), and
#   - by hand after major events, based on how each Diamond or Regent reacted.
#
# To post a new update:
#   1. Copy each `score` into `previous`, then write the new `score` (0 to 100).
#   2. Change `updated` to today's date.
#   3. Add log lines at the TOP of `log` with the same date. Each one has:
#        who: a slug from the lists below
#        change: how many points it moved (+3, -2, 0)
#        kind: event (something they did) or roll (the update roll)
#        text: what happened, in-world
#      The changes for one update should add up to score minus previous.
# The home page screen and the Popularity page sort by score on their own.
