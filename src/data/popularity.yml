earlier_news:
  - title: The Gugungagap Disaster
    news: gugungagap-disaster
    source: The Homeworld Times
    unrest: 10
    unrest_text: The broadcast told gems the administration can't always be trusted to see a storm coming.
    changes:
      - who: bi-colored-kandy
        change: -5
        text: The Gugungagap Nautical Base, a terraforming hub in Kandy's expansion, was destroyed in a storm, and thousands of gems were lost. The Homeworld Times blamed the base's Sapphires and overseers for ignoring the warnings, but gems are still asking how it happened under Kandy.
      - who: nightshade-violet
        change: 1
        text: Court Nightshade's investigators were named to look into the Gugungagap disaster. Gems are waiting on them for answers.
  - title: Survivors of Gugungagap
    news: survivors-of-gugungagap
    source: The Homeworld Times
    unrest: -5
    unrest_text: Survivors, a named culprit and a Diamond promising safety calmed things down, but the attacker is still out there.
    changes:
      - who: epsilon-blue
        change: 4
        text: Epsilon Blue spoke to the whole empire about the Gugungagap disaster. She promised stronger defenses and rewards for the two Lapis Lazulis who survived it.
      - who: nightshade-violet
        change: 3
        text: The Gugungagap survivors gave their testimony to Court Nightshade, and Epsilon credited his court with finding out what happened. A full report is on its way.
      - who: bi-colored-kandy
        change: 2
        text: Survivors of Gugungagap say the base was attacked by a rogue gem hiding in the storm. Gems are starting to blame the attacker more than Kandy's overseers.
  - title: A New Colony, an Engine Crackdown and a Storm Warning
    news: colony-crackdown-and-storm-warning
    source: The Homeworld Times
    unrest: 5
    unrest_text: A wave of cosmic radiation is heading for the outer colonies, and gems in its path were told to evacuate. Pilots are also angry about the engine crackdown.
    changes:
      - who: bi-colored-kandy
        change: 4
        text: Kandy's court finished terraforming Colony 0G4K-12L in record time. The frozen planet now has a working kindergarten making Quartzes.
      - who: maroon-red
        change: 1
        text: Court Maroon is taking ships and flying rights from pilots caught with illegal engines, after two ships exploded near an asteroid belt. Most gems call it fair. Pilots don't.
      - who: alpha-black
        change: 2
        text: Alpha Black's court released a new batch of early Era 1 records to the public data centers. Gems are reading them on their rest cycles.
  - title: The Outer Rim Evacuation
    news: outer-rim-evacuation
    source: The Homeworld Times
    unrest: 2
    unrest_text: An unknown attacker in a white ship destroyed an outer rim town during its evacuation and left the survivors trapped in the storm. Florentino's rescues took some of the edge off.
    changes:
      - who: florentino
        change: 6
        text: Grand Regent Florentino went colony to colony across the outer rim during the radiation storm evacuation. He broke open locked doors and filled every transport, and thousands of gems got out before the blackout.
      - who: saturn-light
        change: 2
        text: Court Saturn got credit for Florentino's rescue work on the outer rim.
  - title: The Storm Reaches the Inner Colonies
    news: storm-reaches-inner-colonies
    source: The Homeworld Times, weather desk
    unrest: 6
    unrest_text: The cosmic storm passed most of the outer colonies and is heading for the inner colonies of Saturn and Maroon. Homeworld expects the first impacts in two weeks, with about a month of communication losses after.
    changes: []
