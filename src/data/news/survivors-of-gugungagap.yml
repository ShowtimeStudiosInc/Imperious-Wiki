title: Survivors of Gugungagap
date: 2026-08-01
anchor: Vevila Dei
guests:
  - Lapis Lazuli 3XH
  - Lapis Lazuli 3XL
  - Epsilon Blue Diamond
credits: ''
summary: Two Lapis Lazulis who lived through Gugungagap tell the empire what really happened, and Epsilon Blue Diamond sends a video address.
transcript: |
  [BROADCAST GOING LIVE...]
  * The Homeworld Times logo fades out. The camera opens on Vevila Dei sitting behind her large news desk. The bright studio lights shine down. Sitting next to her are two Lapis Lazulis, 3XH and 3XL.
  @Vevila Dei
  - Good evening, gems of the Empire. I am Vevila Dei, and this is The Homeworld Times.
  - A few days ago, I sat at this desk and told you about the total destruction of the Gugungagap Nautical Base. I told you a terrible storm wiped out the colony and shattered thousands of gems. I also made it seem like there were no survivors.
  - Tonight, I am very happy to tell you I was wrong.
  * Vevila gestures to the two gems sitting next to her.
  - Sitting beside me are two Lapis Lazulis who lived through the disaster. They are here to tell the whole empire what really happened.
  - Welcome to the broadcast. Let us start from the beginning. Our warning systems did not see this storm coming. Tell the viewers what happened in the sky that day.
  * 3XH decided to start.
  @Lapis Lazuli 3XH
  - First of all, we would like to thank you for deciding to broadcast us. Me and Lapis 3XL here were both late emergences, and we emerged from beneath the waves of the ocean. With the little sunlight we did have down in the depths, we saw the clouds growing in the sky, and were aware that something was off..
  * 3XL then also spoke, a little nervous, but less so with 3XH by their side.
  @Lapis Lazuli 3XL
  - We both decided as a collective that we should wait out the storm, as it was typical of storms to come and go. I, myself, observed a figure above, and we figured it to be fellow Lapises coming to get us. A few minutes later...horror.
  @Lapis Lazuli 3XH
  - Yes, we heard terrible sounds coming from the surface prior, initially we thought of it as light-hearted Lapis activity, but upon inspection, the scene was just horrific. There were no gems in sight, aside from shattered remains.
  * Both Lapises seldomly looked at Vevila, as their emotions were on their sleeves, taking great advantage of emotional appeals of gems who may be watching.
  * Vevila listens quietly as the two Lapises speak. She keeps her face serious and respectful for the cameras.
  @Vevila Dei
  - Thank you for sharing that. It takes real bravery to talk about something so terrible on live holovision. What you just said confirms our worst fears. This was not just bad weather. This was a targeted attack by a rogue anomaly hiding in the clouds.
  - But for all the damage they caused, they made a massive mistake. They did not finish the job.
  - Tell me, how did you manage to survive when the attackers were hitting the base so hard? It sounds like these criminals were very sloppy to leave witnesses behind.
  * Again, 3XH spoke.
  @Lapis Lazuli 3XH
  - We were survivors from the grace of instinct. Though Lapis' have immaculate control over water, 3XL here has a special...affinity, to water specifically. It seemed that the rogue gem hadn't accounted for late emergers, and 3XL suggested that we stay put instead of putting ourselves in harms way.
  * 3XL nodded.
  @Lapis Lazuli 3XL
  - We were never found, because by the time we emerged and were aware of what was happening, the attackers were likely finishing the job. We are forever grateful of the fate that we had of emerging last of our kindergarten. I knew that because of the way sound travels through water, staying put would be the best outcome for us both, both for our survival and for sitting here telling the story of what happened. We wouldn't have been heard by them because we were so far beneath the surface..
  * 3XL wiped a lone tear from their eye, not of sadness but of gratitude of them being able to tell this to the gempire.
  * Vevila gives a slow nod. She looks at 3XL with a warm and supportive expression.
  @Vevila Dei
  - You made the smartest choice possible. You stayed hidden while cowards attacked from the dark. Because of your quick thinking, those criminals completely failed to cover their tracks. They left the two, now most important gems behind.
  - Now, I know losing your fellow workers is a very hard thing to deal with. But looking at you both right now, I do not see victims. I see strength. How are you holding up today, and what is your main focus right now to honor the gems we lost?
  * This time, 3XL started.
  @Lapis Lazuli 3XL
  - We are doing better, increasing as the days go by. We plan to visit for therapy sessions in between working days. Our main focus, at least in the short term, is now to ensure that the savage beast is brought to justice. Those Lapis', Aquamarines, and other gems that were slaughtered, if they were here with us, would only want that for us to do.
  * 3XH spoke up as well.
  @Lapis Lazuli 3XH
  - Of course, we will continue with our purpose of terraforming, despite everything. We mustn't let this get in the way of what makes us Lapises after all. We are hopeful that this will be a speedy process so that we can get back to what we do best.
  * The Lapis's nodded in agreement with eachother, though survivors, it brought a message of growth despite their trauma, and working to better the future of Homeworld, not allowing this tragedy to stump their lives.
  * Vevila gives a small, respectful nod. She is very pleased to hear them talk about their duty.
  @Vevila Dei
  - That is exactly what the empire needs to hear. You are true Homeworld gems. You put your purpose and your Diamond's vision first, even after a tragedy.
  - But you are completely right about accountability. We cannot let these attackers go unpunished. You mentioned you have details about the suspect. To get this justice, who are you sharing this information with? What are the next steps for your report?
  * They both were unresponsive for a moment before 3XH spoke.
  @Lapis Lazuli 3XH
  - We will leave the investigation to Nightshade Diamond and his team, as they have our testimony, along with a description that Lapis 3XL gave of the perpetrator. We believe that his team is the most suited for the job at the moment. We are awaiting further information from them in accordance with what we need to do moving forward. Afterwards, perhaps we could come back with more detailed information.
  * 3XL nodded, with no further comment aside from what 3XH had told them.
  * Vevila looks at both of them with deep respect. She gives them a final nod before turning her chair to face the main camera.
  @Vevila Dei
  - Thank you both for coming on the show tonight. The whole empire is very proud of your bravery. With Court Nightshade leading the hunt, I know those criminals will be caught very soon.
  - Now, to close out tonight's broadcast, we have a very special message. Epsilon Blue Diamond has sent a direct video address to the empire regarding this tragedy.
  * Vevila taps her desk. The screens behind her change to the bright symbol of Epsilon Blue Diamond.
  [PLAYING EPSILON EMPIRE ADDRESS]
  * She got a notification that the drone would be recording, to which she understood, walking towards the window to capture her at the most elegant angle, giving her the appearance of both grief but hope. Grace, yet beauty. Somber, yet hopeful. Her voice was steady, with subtle hints of emotions to invoke a sense of tragedy to the audience. She cleared her throat as the drone began to record...
  @Epsilon Blue Diamond
  - Greetings gems from across the gempire. As you all have known, there was a recent incident on one of our newly established colonies, namely, Gamma-Laporis 455G-12XM. It is with a heavy heart that I say that the tragedy and damage there was catastrophic. Rogue individuals plagued the planet with a superstorm, one Sapphires were unable to predict, Lapis' unable to control, and others unable to shield. By the grace of everything that happened, we have had survivor Lapis Lazulis, and I assure you, as your Diamond Epsilon Blue, we have been working tirelessly to bring those responsible to justice. I am happy to report that investigations have concluded with Court Nightshade and their wondrous efforts to find exactly what happened, a report will be coming shortly. As we continue to be guided through this New Era, be assured that defenses will be strengthened, production will be prosperous, and Homeworld and surrounding colonies will continue to remain strong and safe. We applaud the brave survivors for their testimony, and for their vast bravery, will be awarded for their actions. It is a new age for Homeworld, let us not be driven by fear but by hope, hope that shall pave a new path for us all. Thank you, and please, give a warm welcome to the survivors as they return to their duties on other colonies. This has been Epsilon Blue Diamond, primary advisor for Homeworld.
  * As she closed, she looked away from the camera and up to the sky above, painting a cinematic shot of her overlooking the rest of Homeworld, really nailing in the point that she was protector of them all.
  [VIDEO FILE ENDS...]
  * The camera cuts back to Vevila Dei sitting at the desk.
  @Vevila Dei
  - You heard Epsilon Blue Diamond. Court Nightshade is on the hunt, and the empire remains strong.
  - That is all for this [Time of Day]. I'm Vevila Dei. And I hope you will join me again for more news...
  - And remember, trust US! With your News.
  * The broadcast cuts to the sleek, imposing logo of The Homeworld Times as the sharp, orchestral theme music plays out.
