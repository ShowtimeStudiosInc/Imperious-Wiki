title: A New Colony, an Engine Crackdown and a Storm Warning
date: 2026-08-05
anchor: Vevila Dei
guests: []
credits: ''
summary: Colony 0G4K-12L is terraformed, Court Maroon cracks down on illegal ship engines, Court Alpha opens up old records, and a wave of cosmic radiation heads for the outer colonies.
transcript: |
  [BROADCAST GOING LIVE...]
  * The Homeworld Times logo fades out. The camera opens on Vevila Dei sitting behind her large news desk. The bright studio lights shine down.
  @Vevila Dei
  - Good evening, gems of the Empire. I am Vevila Dei, and you are watching The Homeworld Times.
  - We begin tonight with a major success for our expansion teams. Court Emerald has officially finished the main terraforming phase on Colony 0G4K-12L. The rocky planet was completely covered in thick ice, but the local Lapis Lazulis and Bismuths worked together to clear the surface in record time. The new kindergarten is now open and ready to produce strong Quartzes. This is a great win for the empire.
  - Moving on to our next story, I have a strict warning for all pilots. Court Maroon security forces are cracking down on illegal ship upgrades. We know many gems are buying cheap, unregistered engines to make their transport ships fly faster. This is incredibly foolish. Two private ships exploded near their solar systems asteroid belt yesterday because their cheap engines could not handle the speed.
  - Let me be very clear. If Court Maroon catches you flying with illegal parts, they will take your ship away. You will lose your flying rights, and you will be sent back to work on the ground. Do not risk your safety just to arrive a few minutes early.
  - In local news, Court Alpha has just released a new batch of early Era 1 historical records to the public data centers. If you have free time during your rest cycle, I suggest you go read them. It is important to look back at our history. You need to understand the hard work that built the ground you walk on today.
  - Now, I need your full attention for our final story.
  * Vevila taps her desk. The screens behind her change to show a massive map of the galactic filament, there was a highlight which covered 11% of the bottom of the screen it was clearly supposed to signify the area the Gampire currently occupies. Pretty soon, a large, dark red wave is moving toward the the outer rim of the highlighted area and a bit outside of it.
  - Our tracking stations have found a massive cosmic weather event moving toward the outer colonies. This is not just a heavy rain storm. This is a severe wave of radiation and magnetic winds.
  - When this cosmic weather hits a planet, it acts like a giant pulse of very bad energy. It will fry the local technology. It will completely break the communication towers. The local warp pads will shut down, and the sky will go pitch black.
  - This blackout will keep those outer colonies in the dark for several weeks.
  - If you are stationed in the direct path of this wave, you need to act right now. Stop your work. Pack up your crews. Take your nearest universe warp and move to the inner colonies where it is safe.
  - Do not think you can wait it out. If you stay behind, you will lose all contact with Homeworld. No one will be able to hear you, and no one will be able to come get you. Evacuate today.
  * She straightens up, the holoscreens instantly dissolving into light and retreating back into her gemstone. Her composure returns.
  - You have been warned. Do not ignore the sky.
  - That is all for tonight's broadcast. I'm Vevila Dei.
  - And remember, trust US! With your News.
  * The broadcast cuts to the sleek, imposing logo of The Homeworld Times as the sharp, orchestral theme music plays out.
