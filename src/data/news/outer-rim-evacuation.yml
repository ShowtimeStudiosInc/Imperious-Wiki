title: The Outer Rim Evacuation
date: 2026-08-11
anchor: Vevila Dei
guests: []
credits: ''
summary: An unknown attacker destroys an outer rim town in the middle of its evacuation, while Grand Regent Florentino goes colony to colony getting gems out before the blackout.
transcript: |
  [BROADCAST GOING LIVE...]
  * The Homeworld Times logo fades out. The camera opens on Vevila Dei sitting behind her large news desk. The bright studio lights shine down.
  @Vevila Dei
  - Good evening, gems of the Empire. I am Vevila Dei, and you are watching The Homeworld Times.
  - During my last broadcast, I gave a direct warning to the outer colonies. I told you a massive cosmic storm was coming. I told you to pack your things and evacuate immediately.
  - Many of you listened. Our logs show the warp pads were busy. But for one specific town, the evacuation was violently interrupted by something much worse than bad weather.
  * Vevila taps her desk. The screens behind her change to show security camera footage. The video is shaky and cuts to static often.
  - This video came from the colony perimeter feeds just hours ago. While the workers were packing their transport ships, a bright white vessel crashed directly next to the main control tower. A glowing figure stepped out. They were holding a massive weapon shaped like a musical instrument.
  - Without any warning, this figure attacked the town.
  * The screens show a massive arc of light cutting the control tower in half. Then the video completely cuts to black static.
  - The attacker unleashed huge waves of light. They brought down the control tower. They destroyed the medical bay. They leveled the residential blocks. And very specifically, this figure targeted every single camera and communication dish in the area. They intentionally plunged the colony into a total blackout before the cosmic storm even arrived.
  - Once the town was destroyed, the attacker got back in their white ship and flew away. They left our working class gems trapped in the rubble.
  * Vevila waves her hand and the static screens disappear. She looks directly into the camera.
  - We do not know who this white figure is. But we know they are fast, they are heavily armed, and they are extremely dangerous. The cosmic weather wave is now moving over that sector. We cannot reach the survivors right now, but we are monitoring the edge of the storm.
  - Now, while this rogue attacker brought fear to the outer rim, I want to share a very different story from another colony. A story about true leadership.
  - As the radiation storm moved closer, many outer colonies were running out of time. Bases were in a total panic. They had too many gems and not enough transport ships. Newly emerged gems were trapped behind locked doors when the systems started to fail.
  * Vevila smiles slightly. She looks very impressed.
  - That is when Grand Regent Florentino of Court Saturn stepped in. He traveled from colony to colony across the entire outer rim to personally help with the evacuations.
  - He took total control everywhere he went. He used his own physical strength to crash through locked emergency doors and free trapped gems. He told the local crews to throw away the paperwork and rip the seats out of the transport ships. He made sure they crammed every single gem inside so no one was left behind.
  - Thanks to his quick thinking and raw power, fleet after fleet of transports launched safely just seconds before the sky went completely black.
  - Thousands of gems are alive right now across the outer rim because a Grand Regent decided to take action. When the rules get in the way of saving lives, a real leader breaks the rules. We give our highest thanks to Grand Regent Florentino for his amazing work today. He proved that even when the sky goes dark, Court Saturn will protect its people.
  * She straightens up, the holoscreens instantly dissolving into light and retreating back into her gemstone. Her composure returns.
  - That is all for tonight's broadcast. I'm Vevila Dei.
  - And remember, trust US! With your News.
  * The broadcast cuts to the sleek, imposing logo of The Homeworld Times as the sharp, orchestral theme music plays out.
