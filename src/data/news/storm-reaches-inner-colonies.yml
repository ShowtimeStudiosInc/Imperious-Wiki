title: The Storm Reaches the Inner Colonies
date: 2026-09-03
anchor: Black Star Sapphire
guests: []
credits: ''
summary: The weather desk tracks the cosmic storm past the outer colonies and toward the inner colonies of Saturn and Maroon. Homeworld itself has about two weeks.
transcript: |
  [BROADCAST GOING LIVE...]
  * The usual Vevila DEI logo flashes on screen, its familiar ring scorching through like a siren. Once it disappears after a few seconds, Black Star Sapphire is instead greeting the screen, her posture fixed and her voice serious, her star earrings glistening in the light of the studio as she had a picture of a 24 hour timeloop of the visual representation of the wave sweeping through the colonies.
  @Black Star Sapphire
  - Good Evening gems of the empire. It is I, Black Star Sapphire and you're watching The Homeworld Times. I come to you all with a news update on the cosmic storm ravishing the colonies in the outer filament.
  * Black Star then points to the screen projecting the storm's path, which includes homeworld in it.
  - Now as you can see, the storm has swept past a majority of the outer colonies and is now threatening the inner colonies, forged by Saturn Light and Maroon Red Diamond. We have lost contact with our field observers in the stations orbiting these colonies—
  * Now, the diagram shows the storm's "bands" of heavy UV radiation and cosmic dust scraping ever-so-closely to homeworld itself.
  - Homeworld will expect impacts in 2 weeks time, as there will be short-lived bursts of energy emitting from the sky. As the storm approaches, expect widespread communication losses and technological problems, persisting through the next month afterwards. Evacuation away from outside areas is critical for your survival.
  * The serious tone of Black Star subsided, giving a more positive view of the immediate forecast.
  - For today's forecast, expect a light rain shower to start your morning commute, but by midday, expect a beautiful day for tomorrow. Temperatures will be lovely for everyone, and aside from Sarnus' dust storm, which will blanket the planet in dust and gusty winds for a majority of today and tomorrow, the rest of the inner colonies will have pleasant weather for their respective planets.
  - This has been your weather update on the cosmic storms and your daily weather forecast with Black Star Sapphire, and remember, TRUST US! With your news!
  * The broadcast cuts to The Homeworld Times Logo as Black Star Sapphire now gets off air, the familiar ring of The Homeworld Times rings, signaling its end.
