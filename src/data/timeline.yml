# The Timeline (/timeline/), laid out like a game's timeline screen.
#
# eras:   every Era that has its own lore page (/timeline/<slug>/, text in src/data/timeline/<slug>.md).
# pages:  one page per Era (0, 1, 2). Each page has tracks (lines) stacked top to bottom.
#
# A track:
#   key, label, name   the line's id and the label at its left
#   color              the line's color
#   style              solid or dotted
#   from_left          true if the line carries on from the page before (draws an arrow in)
#   to_right           true if the line carries on to the next page (draws an arrow out)
#   ends_at            an event id where the line stops early (the rest of the track is empty)
#   starts_on          on a page that spills over, the page number (1, 2, 3...) where this line first appears
#   parts              pull events from an Era's lore sections: a list of { slug, segment, labels }
#                        labels  the name each section gets on the line (by section id); the lore page keeps its own headings
#                        only    BU or AU: only take the sections whose date has it (one lore page split across two Eras)
#   events             events written by hand: { id, title, when, segment, link, at, status }
#                        at      line this event up with another event's spot on the page (by id)
#                        link    where it opens (a page on the wiki)
#                        status  open (default), pending, or sealed
#                        kind    news for a Homeworld Times broadcast (drawn as a small round marker)
#                        x       pin the event to a spot on the line, in percent
#   note               shown on a track with no events yet
#   events can also set big: true (with emblem, tagline, kicker) to draw a large node like a chapter's
#
# A page can set start: true to be the one the Timeline opens on (otherwise the first page).
#
# A page with per_page carries on to extra pages (Era 2, Era 2 · II, Era 2 · III...) once its busiest line passes that many events.
# Events on its other lines stay on the first page unless they set "at" (the page holding that event) or "page" (1, 2, 3...).
#
# Finishing a chapter: add one event for it on the same line, placed where the chapter starts, with
#   id: the-seven-fractals            (its page will be /timeline/the-seven-fractals/)
#   title: The Seven Fractals
#   tagline: one short line
#   emblem: five                      (any drawing from EMBLEMS)
#   includes: [orientation-day, gugungagap-disaster, ...]
# The events it lists vanish from the line and the chapter's page gathers their recaps and broadcasts, in that order.

