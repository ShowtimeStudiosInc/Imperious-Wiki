title: I Thought It Was About a Boat
date: 2026-11-25
host: Alina
guests:
  - Vik
  - Ira
  - Remy
  - Dex
  - Ray
  - Rook
  - Joss
  - Greer
credits: ''
summary: Alina asks a stunt champion what a song choice can say behind his back, sits a comic down with a story he can't joke his way out of, and puts the colosseum's loudest feud on one couch with a referee in the middle.
transcript: |
  [THE CRYSTAL HOUR · LIVE FROM DISTRICT 4]
  * The studio lights come up in pink and gold. Tambour and the house band kick into the theme, and the audience is on its feet before the first chorus ends.
  * Alina comes out from behind the curtain in a cream pleated blouse with a big pink bow, a black vest, and a long skirt striped in red and gold. Her pink curls bounce as she walks. She waves with one gloved hand. The other holds her usual warm cup.
  @Alina
  - Thank you! Oh, you're too kind. Sit, sit. Save some of that for the end, you're going to need it.
  - Good evening, Gempire, and welcome back to The Crystal Hour! I'm Alina. Last night we had a shoe song, a thumb war, and a Kyanite who clapped twice. My producers asked me to keep tonight a little calmer. I said yes. I lied.
  * The audience laughs.
  - Before anything else, a quick update. After last night's show, at least nine of you wrote in to tell me the shoe song is stuck in your head. One of you said you sang it under your breath through a whole court meeting, and your Diamond asked if you were all right.
  * The audience laughs. Tambour plays the first three notes of the shoe song on the keys, then stops.
  - Tambour, don't you dare.
  * Tambour holds up both hands. The audience laughs harder.
  - Okay. The news. Let's start with love, because love had a rough week.
  - You all know The Gilded Court. Best drama of the season, the one with the palace and the poisoned tea set. Well, Hana, a Jade, and Dae, a Quartz, met on that set years ago and have been the sweetest pair in District 4 ever since.
  - This week, both of their houses said they've split. Work kept them apart. They say they'll stay good friends and good colleagues.
  - And I believe them. I do. Hana has signed on for a new drama, Dae just finished a long tour of duty and is going straight into a new show. They are so busy, they had to schedule the breakup.
  * Alina sips from her cup.
  - Hana, Dae, if you're watching, the couch is open. Separately. Or together. I'm not picky.
  - Next. Fashion. Vera, a Rhodochrosite, everybody.
  * The audience cheers.
  - Before the big music awards, Vera posted a little cast from her hotel washroom. No face paint, a tray of fried snacks in her lap, and she looks right into the camera and says her dresser is going to end her if the red gown doesn't close.
  - And then her whole team crowds into that tiny room. Four gems squeezed into that washroom to pull one zip, and they got it closed! She walked that carpet like she'd never seen a fried snack in her life, and she handed out Song of the Year without a single stitch giving up.
  - Vera, sweetie, I respect it. Eat the snack. Then wear the gown. That's the order. Everybody knows that's the order.
  * The audience laughs and applauds.
  - Also at the Star Music Awards, the sweetest moment of the night. The wind picks up on the carpet, and Bree's gown starts going places a gown should not go. And Wren, a Spinel, reaches over without even looking and holds it down for her.
  - Now, some of you have been saying things about that group lately. Something about tension, something about the photo session. All I saw was a Spinel saving her friend from the sky. If that's tension, I'd like some.
  - And at the ticket halls, a comeback! Vance, a Spinel, everybody. He's been gone from the big screen for years, and his new picture, The Miser of Winter's End, has lines out the door every single night.
  - It's about a cold-hearted merchant who gets visited by three spirits on a winter night. I've seen it twice. I cried both times. Once at the end, and once when the gem behind me ate my snacks.
  * The audience laughs.
  - And it has already filled more seats than The Lost Isle, the big cartoon from District 3 that took years to make. I'm not saying anything about The Lost Isle. I'm just saying when I went, I had a whole row to myself, and I lay down on it.
  - Finally, Lila, a Spinel, joins the Tallow family in their newest picture, which opens in the ticket halls tonight. The critics have been rough on it. Lila, if you're reading the reviews, stop. Go see your own picture. Bring a snack. Take a row.
  - Okay. That was the warm up.
  - Tonight, I have three gems who all said something in public that they'd like to take back. One played the wrong song. One got a story written about him that he can't laugh off. And two of them have been yelling at each other through their slates for a week.
  - Stay with us. When we come back, the champion of this season's stunt trials. He can jump off a ship. He can walk through fire. But he cannot pick a song. And he's here!
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT ONE]
  * The band plays a short, loud sting. Alina is at her desk. Next to it, on the long pink couch, sits a broad Quartz with short white hair and a stunt-trials medal pinned to his jacket. He keeps touching the medal like he's checking it's still there.
  @Alina
  - Please welcome the winner of this season's stunt trials, Vik!
  * The audience cheers. Vik raises one hand and smiles a little.
  @Vik
  - Thanks. Thanks for having me. I think.
  @Alina
  - You think?
  @Vik
  - I've jumped through a ring of fire, Alina. Twice. I wasn't this nervous.
  @Alina
  - Sweetie, the fire didn't have a studio audience. Let's start somewhere nice. Congratulations! You won the trials.
  @Vik
  - Thank you. It was a long season. Lots of falls. One of them was off a landing platform in District 6, and I still don't fully remember that week.
  @Alina
  - And you met someone on another show before all this. The big house.
  @Vik
  - Yeah. The big house. Twelve gems, one house, no doors on anything. That's where I met Ira.
  * A few gems in the audience go "aww." Vik rubs the back of his neck.
  @Alina
  - Ira the Spinel. You two told everyone you were together on another show after. Very public. Very sweet. And then this week, fans noticed something.
  @Vik
  - We stopped following each other's casts.
  @Alina
  - You stopped following each other's casts. And the Gempire did what the Gempire does, which is make up a whole story in about an hour.
  @Vik
  - Less than an hour. I timed it.
  * The audience laughs.
  @Alina
  - So you posted a cast of your own. And I watched it, and I'll tell everyone what I saw. You said sorry. And you said the split was your fault.
  @Vik
  - It was.
  @Alina
  - Just like that?
  @Vik
  - Just like that. I'm not going to sit here and make it sound complicated. I wasn't there for her the way I should have been. I was training, I was traveling, and when I was home, I was tired. That's on me.
  * Nobody in the audience laughs. Alina nods.
  @Alina
  - Most gems would have blamed the schedule.
  @Vik
  - I had a lot of time to think about it. Mostly upside down, on a rope.
  @Alina
  - Okay. Now. I have to ask about the song.
  * Vik puts his face in his hands. The audience laughs.
  @Vik
  - I knew it.
  @Alina
  - You knew it. Everybody knew it. Tell them what happened.
  @Vik
  - So I also play songs at clubs. Small sets, nothing big. I was doing a night in District 4, and I played this old song. Hollow Promise.
  @Alina
  - Which is about?
  @Vik
  - It's about a lover who isn't faithful.
  * Tambour plays two low, slow notes on the bass. The audience groans and laughs.
  @Alina
  - Vik. Sweetie. You played the cheating song. The week of the breakup.
  @Vik
  - I didn't pick it for that! It's a good song! It's got a great drop in the middle! I've played it at every set for a year!
  @Alina
  - And nobody in the room thought, maybe not this week?
  @Vik
  - The room was dancing! The room loved it! Then I woke up the next morning and the room had told everyone.
  * The audience laughs.
  @Alina
  - Okay, a real question. What do you do when a song says more than you meant?
  @Vik
  - You say what you actually meant. Out loud. In your own words. Which is why I made the cast. The song wasn't about her, and I wasn't trying to say anything. If I wanted to say something to her, I'd say it to her.
  @Alina
  - Would you?
  @Vik
  - Yes.
  @Alina
  - Right now?
  * Vik looks up. He doesn't answer. Alina smiles wider.
  @Alina
  - Because I have a surprise. Ira, would you come out?
  * The audience gasps, then cheers. A slim Spinel with long ribbon-like pigtails steps out from behind the curtain. She walks to the far end of the couch and sits down. Vik stands up, sits back down, and then stands up again.
  @Ira
  - Sit down, Vik.
  @Vik
  - Yeah. Okay.
  * He sits. The audience laughs.
  @Alina
  - Ira, thank you for coming. I know it's a lot.
  @Ira
  - It's fine. I've been on worse couches. The big house couch had a spring that tried to kill me every night.
  @Alina
  - You heard all of that from backstage.
  @Ira
  - I did.
  @Alina
  - Is there anything you want to say?
  * Ira thinks about it. She looks at Vik, then at the audience.
  @Ira
  - I want to say that nobody cheated. I know what everyone's been saying. It isn't true. We just stopped working, and it took us too long to say so.
  * Somebody in the front row says "oh" out loud.
  @Ira
  - And he's right. It was mostly him.
  @Vik
  - Hey.
  @Ira
  - Mostly.
  * The audience laughs. Vik nods.
  @Vik
  - Mostly. That's fair.
  @Alina
  - And the song?
  @Ira
  - I've heard him play that song a hundred times. He plays it because the middle part is loud and gems jump up and down. He doesn't know what half the words mean. I asked him once and he said it was about a boat.
  @Vik
  - I thought it was about a boat!
  * The audience bursts out laughing. Even Ira smiles.
  @Alina
  - So we've solved it. The song isn't about Ira. It isn't about cheating. It's about a boat, and Vik can't read.
  @Vik
  - I can read.
  @Ira
  - Not lyrics.
  * The audience laughs and applauds.
  @Alina
  - Can I ask the big house question? Would you two ever be friends?
  * Vik and Ira look at each other. Neither one wants to answer first.
  @Ira
  - Not yet. Maybe one day. Right now I'd like him to stop playing that song.
  @Vik
  - Done. It's gone. I'll play something about a boat that's actually about a boat.
  @Alina
  - Vik and Ira, everybody! Hollow Promise is a boat song now. We'll be right back.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT TWO]
  * The band plays a softer sting. Alina is at her desk with a folded copy of a District 4 paper in front of her. On the couch sits a skinny Spinel in a loose striped shirt, one leg bouncing. He's smiling a lot more than the topic calls for.
  @Alina
  - My next guest is one of the funniest gems in the Gempire. He just hosted the big late-night show, and he's doing a run of live shows on club row all week. Please welcome Remy!
  * The audience cheers. Remy waves with both hands.
  @Remy
  - Hi! Hello! Thank you! Please keep clapping, it's the only thing holding me up right now.
  @Alina
  - Remy, you're a comic.
  @Remy
  - I'm told.
  @Alina
  - So I want to start with something easy. Tell me a joke.
  @Remy
  - Right now?
  @Alina
  - Right now.
  @Remy
  - Okay. Why don't Pearls ever win at cards?
  @Alina
  - Why?
  @Remy
  - Because they always say exactly what's in their hand.
  * The audience laughs. Remy points at the band. Tambour plays a quick drum roll and a cymbal hit.
  @Alina
  - That's a good one. I'd like to point out that I'm half Pearl, and I'm taking that personally.
  @Remy
  - You should. It was aimed at you.
  * The audience laughs.
  @Alina
  - Now. You know why I invited you.
  @Remy
  - I had a feeling.
  * Alina holds up the folded paper.
  @Alina
  - Liv, a Pearl, your former partner, wrote a piece. It ran in this paper. It's long, it's personal, and I'll be honest with you, Remy, I read it twice.
  @Remy
  - So did everyone. My neighbor read it twice. My neighbor can't read.
  * A few gems laugh. Alina doesn't. She sets the paper down.
  @Alina
  - Sweetie. I'm going to ask you to do something hard. I'm going to ask you to not make a joke for the next two minutes.
  * Remy opens his mouth, then closes it. The audience goes quiet.
  @Remy
  - Okay.
  @Alina
  - In the piece, Liv says she found months of messages on your slate. Sweet ones. To another gem. And she says that's how it ended.
  @Remy
  - Yes. That's what she wrote.
  @Alina
  - And you answered through a trade cast. You said you had good times together. You said splits are hard. You said you wish her well. And you didn't say anything about the messages.
  @Remy
  - No.
  @Alina
  - Why not?
  * Remy doesn't answer right away. His leg stops bouncing.
  @Remy
  - Because anything I say about the messages turns into an argument with her. In public. And she already said her part, and she said it well. She's a good writer. She was always a better writer than me. I'd write a joke, she'd fix it, and it would get the laugh.
  @Alina
  - So you're not saying it's untrue.
  @Remy
  - I'm saying I'm not going to stand up here and tell her she's wrong about her own life.
  * Somebody near the back says "wow."
  @Alina
  - That's not a joke.
  @Remy
  - I know. I'm very uncomfortable. Can I have a cymbal or something?
  * Tambour gives him one, very softly. The audience laughs a little.
  @Alina
  - I asked Liv to come tonight.
  @Remy
  - Oh no.
  @Alina
  - She said no. She was very polite about it. She sent me a note instead, and she said I could read one line of it on the air. Do you want to hear it?
  * Remy grips the arm of the couch. He nods.
  @Alina
  - She wrote, "I didn't write it to hurt him. I wrote it so I'd stop carrying it around."
  * Remy rubs his thumb along the arm of the couch and doesn't look up.
  @Remy
  - Yeah. That sounds like her. That's a better line than anything I wrote all year.
  @Alina
  - Is there something you'd say back? And no joke this time.
  @Remy
  - I'd say I hope she put it down for good. And I hope whoever reads it next is kinder to her than I was.
  * The audience starts clapping. Alina reaches over and squeezes his hand.
  @Alina
  - Thank you, sweetie. Okay. Joke rights restored.
  @Remy
  - Oh, thank the stars. Okay. My piece in the paper is going to be called "Things I Found On My Own Slate," and it's just going to be three hundred pictures of my lunch.
  * The audience laughs. Remy relaxes back into the couch.
  @Alina
  - And the late-night show. Liv's piece mentioned it too. You hosted the big one. How did that feel?
  @Remy
  - Big. Very big. Bigger than me. I did one joke about gym clothes that I thought was harmless, and about forty Quartzes wrote in to tell me exactly where I could put my gym clothes.
  @Alina
  - Did you learn anything?
  @Remy
  - Never joke about a Quartz's gym clothes. They will find you. They know where the gym is.
  * The audience laughs.
  @Alina
  - Remy, everybody! He's on club row all week. Go see him, and if he tells the Pearl joke, boo for me. We'll be right back.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT THREE]
  * The band plays a loud, brassy sting, like the start of a fight. The couch has been pulled apart again, two halves set a good ten feet from each other, the same way it was last night.
  * In the middle stands a short, round Zircon in a striped referee's shirt with a whistle around her neck. She has her arms folded and hasn't smiled once.
  * Off to the side, at a small booth with two microphones, sit Rook and Joss.
  @Alina
  - Welcome back! Some of you might remember this couch. We broke it last night. We broke it again tonight. Our stagehands are thinking about leaving me.
  * The audience laughs.
  @Alina
  - Before we start, a big welcome back to the voices of the District 2 colosseum, who are here tonight on special assignment. Rook and Joss, everybody!
  * The audience cheers loudly. Rook waves with his whole arm. Joss gives a small nod.
  @Rook
  - Good to be back, Alina! We're on speaking terms now. It's been a great week.
  @Joss
  - It's been one day.
  @Rook
  - A great day.
  @Alina
  - And our referee for the evening. Please welcome Greer, a Zircon, who usually works the lower rings in District 2, and who told me backstage she has broken up forty fights and lost zero.
  @Greer
  - Forty-one, counting your stagehands.
  * The audience laughs.
  @Alina
  - Now, all week, two fighters have been going back and forth on their slates. One of them is the reigning light champion of the colosseum. The other one wants his belt. Let's bring them out. Rook, Joss, if you would.
  @Rook
  - Coming out from the left side of the stage, the challenger! Short, red, and angry about it! He has called out the champion nine times this week! It's DEX!
  * A stocky Ruby with a buzzed head and a jacket covered in patches marches out. He points at the audience, then at the other side of the stage, then sits on the left half of the couch with his arms crossed.
  @Joss
  - And from the right side of the stage. The reigning light champion of the District 2 colosseum. Undefeated in his weight for three seasons. A gem who answers every question with as few words as possible. Ray.
  * A tall Jasper with orange stripes on his arms walks out slowly. He sits down on the right half of the couch, leans back, and looks at the ceiling.
  @Alina
  - Gentlemen. Welcome. Thank you for not fighting in my hallway.
  @Dex
  - The night's young.
  @Ray
  - No.
  @Alina
  - No what, sweetie?
  @Ray
  - No fighting in the hallway.
  @Alina
  - Thank you, Ray. Now. Dex. This week, you posted a private chat between you and Ray for the whole Gempire to see.
  @Dex
  - I did. And I'd do it again.
  @Alina
  - Why?
  @Dex
  - Because he's been ducking me for a whole season! I wanted everyone to see him talk big in private and then hide in public!
  @Alina
  - Ray?
  @Ray
  - I'm not hiding. I'm sitting right here.
  * The audience laughs. Rook leans into his microphone.
  @Rook
  - A clean counter from the champion! Dex is rattled!
  @Dex
  - I'm not rattled!
  @Joss
  - He is a little rattled.
  @Alina
  - Let me read what you posted, Dex, so everyone at home knows what we're talking about. You told Ray, and I'm cleaning it up a lot, to stop talking and fight you.
  @Dex
  - That's it. That's the whole message.
  @Alina
  - And Ray, you wrote back that he should watch his words, and if the talk kept up, you'd settle it in the ring.
  @Ray
  - Yes.
  @Alina
  - So, I have to ask. You both want to fight each other. You both said so. In writing. Why hasn't anyone signed anything?
  * The audience goes "ooooh." Dex and Ray both look at Alina, then at each other.
  @Dex
  - Because he won't sign it!
  @Ray
  - Nobody's sent me anything to sign.
  @Dex
  - What?
  @Ray
  - You keep yelling at me on my slate. You never sent a match card. You sent pictures of yourself flexing.
  * The audience bursts out laughing. Rook slaps the booth.
  @Rook
  - OH! He didn't send the card! The challenger did not send the card!
  @Joss
  - A basic mistake. You can't win a match you never asked for.
  @Dex
  - I thought it was obvious!
  @Ray
  - It's a lot of flexing pictures, Dex.
  @Alina
  - How many flexing pictures?
  @Ray
  - Thirty.
  @Dex
  - It's a big arm! It takes a few angles!
  * The audience laughs harder. Greer blows her whistle once, very short. Everyone stops.
  @Greer
  - Gentlemen, I'm going to ask you to keep it about the match. The arms can wait.
  @Alina
  - Thank you, Greer. Now. Here's my idea. I am a talk show host, and I love a surprise. So I had my producers bring something.
  * Alina snaps her fingers. A stagehand walks on with a small table and sets it between the two halves of the couch. On it sits a single match card, glowing faintly, and one pen.
  @Alina
  - That's a real match card from the District 2 colosseum. The match masters sent it over this morning. It's blank. All it needs is two names.
  * The audience cheers. Dex leans forward. Ray stays leaning back.
  @Alina
  - So the question for tonight is simple. Who signs first?
  @Rook
  - Oh, this is good! This is very good! Joss, who signs first?
  @Joss
  - The challenger. The challenger always signs first. It's his match to ask for.
  @Rook
  - But Dex is proud! Dex doesn't want to look like he wants it more!
  @Joss
  - He sent thirty flexing pictures, Rook. That ship has left the platform.
  * The audience laughs. Dex stands up, walks to the table, and picks up the pen. Then he stops.
  @Dex
  - Wait. If I sign first, it looks like I'm asking him.
  @Ray
  - You are asking me.
  @Dex
  - I'm TELLING you!
  @Ray
  - Then write it on the card.
  * The audience goes "ooooh." Rook stands up in the booth.
  @Rook
  - Dex has the pen! Dex has the pen! Will he sign? Will he do it?
  @Joss
  - He's thinking. That's new for him.
  @Dex
  - I can hear you!
  @Joss
  - You're supposed to. It's a microphone.
  * The audience laughs. Dex looks at the card. Then he looks at Alina.
  @Dex
  - Can I say something first?
  @Alina
  - It's your couch, sweetie.
  @Dex
  - I posted the chat because I was mad. And I shouldn't have posted something private. That was a cheap move. I want to win against him in the ring, not on a slate.
  * Ray sits up a little for the first time all segment.
  @Ray
  - That's fair.
  @Dex
  - Yeah?
  @Ray
  - Yeah. I've done cheaper.
  * Dex signs the card in big, messy letters and holds the pen out. Ray stands, walks over, and signs it in small, neat letters. Then they shake hands. Greer blows her whistle twice.
  @Greer
  - That's a match!
  * The audience jumps to its feet. Tambour and the band play a big brassy fanfare.
  @Rook
  - IT'S SIGNED! IT'S SIGNED! THE CHALLENGER AND THE CHAMPION, IN THE DISTRICT 2 COLOSSEUM! JOSS, CAN YOU BELIEVE IT?
  @Joss
  - I can, actually. It was on a table in front of them.
  * The audience laughs. Alina claps her hands together.
  @Alina
  - Now, I have one more question for both of you. Rook and Joss will be calling this match. They had a little trouble with each other this week, and they sorted it out on this very couch. Is there anything you'd like to ask them?
  @Dex
  - Yeah. Rook. You're a Ruby. You're picking me, right?
  @Rook
  - I'm a professional, Dex. I call it down the middle.
  @Dex
  - Rook.
  @Rook
  - ...I'm picking you.
  * The audience laughs. Ray looks at Joss.
  @Ray
  - And you?
  @Joss
  - I'm a Jasper. I don't pick. I already know.
  * The audience goes "ooooh" and laughs. Rook and Joss look at each other. Then Rook holds out a fist across the booth. Joss looks at it for a second, then bumps it.
  @Alina
  - They did it again! Did the cameras get that? Somebody tell me the cameras got that!
  @Alina
  - Dex, Ray, Greer, Rook and Joss, everybody! The match is signed. We'll be right back.
  [BREAK]
  [THE CRYSTAL HOUR · CLOSING]
  * Alina stands at the front of the stage, alone, her cup back in her hand. The lights dim to gold.
  @Alina
  - That's our show, Gempire. Before I go, a few thank yous.
  - Thank you to Vik, who said sorry on holovision and meant it, and to Ira, who came out from behind a curtain without knowing what was on the other side. And to the song Hollow Promise, which is about a boat now.
  - Thank you to Remy, who went two whole minutes without a joke, which I'm told is a personal best. And thank you to Liv, who didn't come, and still had the best line of the night.
  - Thank you to Dex and Ray. The card is signed. I'll be in the front row. Please don't land on me.
  - Thank you to Greer, who blew her whistle three times and stopped two fights and one flexing picture.
  - And thank you to Rook and Joss, who bumped fists for the second night in a row. At this point, it's a tradition. I expect it every time. I'll send a card for that too.
  * The audience laughs.
  - And Vevila Dei, over at The Homeworld Times, I know you're watching. You can have the match card story. I'll keep the boat.
  - Tomorrow there'll be new stories, new feuds, and new gems who swear the song was about a boat. And we'll be right here.
  - Keep smiling, Gempire. Remember, you are never fully dressed without a smile!
  - I'm Alina, and this has been The Crystal Hour. Goodnight!
  * Tambour and the band play the theme. Alina waves to the audience as the lights fade, and the screen cuts to the Crystal Hour logo.
