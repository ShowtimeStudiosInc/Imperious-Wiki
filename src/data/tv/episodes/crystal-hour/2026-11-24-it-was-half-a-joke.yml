title: It Was Half a Joke
date: 2026-11-24
host: Alina
story:
  arc: a-rogues-story
  when: Morning edition
guests:
  - Sable
  - Chet
  - Rook
  - Joss
  - Nia
  - Vale
credits: ''
summary: Alina gets the shortest romance of the year from both sides, puts the colosseum's feuding voices on one couch, and asks a singer and a music house lawyer who owns a song once it's been sung.
transcript: |
  [THE CRYSTAL HOUR · LIVE FROM DISTRICT 4]
  * The studio lights come up in pink and gold. The house band, led by a tall Spinel named Tambour, kicks into the theme. The audience is already on its feet.
  * Alina walks out from behind the curtain in a red pleated blouse with a pink bow at the collar, a black vest, and a long striped red skirt, her big pink curls bouncing with every step. She waves with one gloved hand and holds a cup of something warm in the other. Her smile is as wide as it always is.
  @Alina
  - Thank you! Thank you, sit down, sit down, you'll wear out your legs and I need you clapping for the next hour.
  - Good morning, Gempire, and welcome to The Crystal Hour! I'm Alina, and this morning's show is so full of drama I had to ask Court Saturn for a bigger studio. They said no. So we're all just going to sit a little closer this morning.
  * A few gems in the front row shuffle their seats closer together. The audience laughs.
  - Now, it has been a week. Let's start with the Gem Awards, because I watched the whole thing and I have notes.
  - First, Rosa. Rosa the Rhodochrosite, everybody. She shows up for the first time in ages, wearing a black lace gown and a pair of antique turquoise earrings, and she looks gorgeous. A Rhodochrosite never underdresses, it's the law of their people.
  - Then she walks out to present an award, and one earring is just gone. Gone! She walked onto that stage with one ear dressed for a gala and the other ear dressed for a Tuesday.
  * Alina reaches into her pocket and pulls out a single turquoise earring. She holds it up to the camera.
  - Rosa, sweetie, if you're watching, it's not this one. I traded a Peridot two spare holopad chargers for it at a market stall in District 3. But it looks like it, and I wanted to feel what it's like to hold a mystery.
  * The audience laughs. Tambour plays a sad little trombone line.
  - And she posed for pictures afterwards with one earring like nothing happened. If I lost half my jewelry on live holovision, I'd fake a fainting spell and have security carry me out.
  - Also at the Gem Awards, the biggest surprise of the night. The Hollow Choir, the horror picture out of District 3, won Best Cast. And Bram, a Jasper, won Best Lead.
  - Now, I have to be honest with you. Nobody picked it. Not one gossip cast in this district picked it. I didn't pick it. My Pearl half didn't pick it, and she picks everything.
  * Alina points to herself with both thumbs.
  - Bram, if you're watching, congratulations. You proved that a picture where a choir slowly sings everyone into a wall can win the biggest night of the year. That's the dream, isn't it?
  - In sports news, I'm sorry to report that the crystal courts and the District 2 field team are no longer dating. Kit, the court champion, and Zara, the striker, have split after a good long while together.
  - Now the real question is who gets the trophy shelf, because I've seen that shelf, and it's nicer than my apartment.
  * The audience laughs and applauds.
  - And love isn't doing much better over at The Rose Court. June the Jade, the lead from the matchmaking show, says she and Theo, the Spinel singer, have called it off.
  - She says they're still friends. She says they still talk. And she says she hopes he doesn't write a song about her. June, sweetie. He's a Spinel. He's written three already. They're just not out yet.
  * Tambour plays a quick, sour chord on the keys. The audience groans and laughs.
  - Okay. That's the warm up. That's me stretching before the real workout.
  - Because this morning, we have three stories, and every single one of them has two sides. And I made sure to invite both sides. Some of them even showed up.
  - Stay with us. When we come back, the shortest romance in the history of the Gempire. It started on Monday. It ended before the week even got its boots on. And she's here!
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT ONE]
  * The camera opens on the couch. Alina sits in her big gold armchair, her cup set on the little table beside her. On the couch beside her is Sable, a Sardonyx with a sharp bob of red and white hair and a sequined jacket. She's smiling, but she keeps adjusting her sleeve.
  @Alina
  - My first guest hosts the most watched dance contest in District 4. She's a Sardonyx, which means she has excellent taste, and she's also my competition for best smile in the district. Please welcome Sable!
  * The audience cheers. Sable gives a little bow from her seat.
  @Sable
  - Thank you, thank you. It's so good to be here. I love this show.
  @Alina
  - You love this show. You also said yes to coming on this show three days ago, which was, if I have my timeline right, two days after you started seeing someone, and one day after you stopped.
  * The audience laughs. Sable covers her face with one hand.
  @Sable
  - You did your research.
  @Alina
  - I didn't have to, sweetie. All of District 4 did it for me. Walk me through it. From the start.
  @Sable
  - Okay. So. A while back, at the Gem Awards, someone on the carpet asked if I was seeing anyone, and I said I was off the market. And that was true! In my heart, it was true.
  @Alina
  - In your heart.
  @Sable
  - In my heart, there was someone. I just hadn't told him yet.
  * Alina leans back in her chair and looks at the audience with her eyebrows raised. The audience laughs.
  @Alina
  - So you announced a relationship to the whole Gempire before you announced it to the gem you were in the relationship with.
  @Sable
  - When you say it like that, it sounds bad.
  @Alina
  - I'm a Sardonyx. I say everything like that. Keep going.
  @Sable
  - So his name is Chet. He's a Citrine. He runs training sessions at the District 4 halls, the ones where performers go to build up for a big tour. He's very good. Very encouraging. Very loud.
  @Alina
  - Very loud?
  @Sable
  - He counts every rep out loud. Every one. You'll be on your fortieth, and he'll be shouting forty like it's the best number he's ever met.
  @Alina
  - That is the most Citrine thing I've ever heard. And so the two of you went out.
  @Sable
  - We went out the night before it hit the gossip casts. It was a nice night! We got a table at Club Imperious, we danced a little, he only counted the steps for the first song.
  @Alina
  - Only the first song. That's growth.
  @Sable
  - Then the next morning, someone had pictures of us leaving the club, and suddenly it's on every cast in the district. Sable's new romance. Who is the mystery Citrine. And I'm reading this, and I'm thinking, okay, this is fine, this could be fun.
  @Alina
  - And then?
  @Sable
  - And then by that same night, we'd talked, and we'd decided it wasn't going to work. And by the next morning, I told the press it was over.
  * The audience gasps and laughs at the same time. Alina holds up one finger.
  @Alina
  - One day. Sable. Sweetie. I've had arguments with my own Pearl half that lasted longer than that.
  @Sable
  - I know! I know.
  @Alina
  - So what happened? Something went wrong in about twelve hours, and I need to know what it was, because I'm a professional, and also because I'm nosy.
  * Sable laughs and shakes her head.
  @Sable
  - It wasn't one thing. It was the pictures. When it was just us, it was easy. As soon as everyone was watching, he got really quiet, and I got really loud, and it felt like we were performing a date instead of being on one.
  * Alina's smile softens a little. She nods.
  @Alina
  - That's a real thing. I know that one. When the whole district is watching, it's hard to tell which parts are you and which parts are for them.
  @Sable
  - Exactly. And I do that for a living. He doesn't. He counts reps.
  @Alina
  - Well, here's the thing. I like to hear both sides of a story. It's the polite thing to do. And it's also the fun thing to do.
  * Alina snaps her fingers. A hologram screen lights up beside the couch.
  @Alina
  - Chet, are you there, sweetie?
  * The screen flickers, and a Citrine appears on it, standing in what looks like a training hall. He's wearing a sweatband and holding a towel. He waves.
  @Chet
  - Hi! Hi, Alina. Hi, Sable.
  * Sable waves back at the screen, a little stiff.
  @Sable
  - Hi, Chet.
  @Alina
  - Chet, thank you for joining us. Where are you right now?
  @Chet
  - I'm at the halls. I've got a group in ten minutes. They're doing warmups behind me.
  * Behind him, out of focus, several gems are doing squats.
  @Alina
  - So we've got about ten minutes to sort out your love life. That's plenty. That's longer than the relationship.
  * The audience laughs. Chet laughs too, rubbing the back of his neck.
  @Chet
  - Yeah, that's fair. That's fair.
  @Alina
  - Sable says it felt like a performance once everyone started watching. Is that how you saw it?
  @Chet
  - Honestly? Yeah. I'm not used to that. I train performers. I'm usually the one telling them to smile for the crowd. I didn't know how hard it was until I was the one in the pictures.
  @Chet
  - I opened a gossip cast in the morning and there was a whole segment about my sweatband. Somebody said it was a fashion choice. It's not a fashion choice. It's a sweatband.
  * The audience laughs. Sable laughs too, a real one this time.
  @Sable
  - It's a good sweatband.
  @Chet
  - Thank you. It's my lucky one.
  @Alina
  - So no hard feelings?
  @Chet
  - None. Sable's great. She's way better at all of this than me. I just think I'm a gem who likes to be in the back of the room, and she's a gem who owns the room. And that's okay.
  * Alina presses her hand to her chest and looks at the audience.
  @Alina
  - Oh, that was nice. That was a nice thing to say. Did everyone hear that? That's how you end a one-day romance, Gempire. Take notes.
  @Alina
  - Chet, one last question, and then I'll let you get back to your squats. Out of ten, what would you rate the date?
  * Chet thinks about it seriously.
  @Chet
  - The date? Nine. The morning after? Two.
  @Alina
  - That's an average of five and a half, which in District 4 is basically an engagement.
  * The audience laughs. Chet waves goodbye, and someone behind him shouts that he's late. The screen goes dark.
  @Alina
  - Sable, how are you feeling?
  @Sable
  - Better, actually. I think I needed to hear him say it out loud.
  @Alina
  - Then my work here is done. Sable, everybody! You can catch her dance contest on Fourth Night, tonight, right before your bedtime.
  * The audience cheers. Sable stands, hugs Alina, and walks off waving.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT TWO]
  * The couch has been pulled apart into two halves. One half sits on the far left of the stage, and the other on the far right, with a good ten feet of empty floor between them. Alina stands in the middle with a microphone.
  @Alina
  - Welcome back! Some of you are wondering why the couch is broken. The couch isn't broken. The couch is fine. The couch is just reflecting the mood of my next two guests.
  * The audience laughs.
  @Alina
  - For a dozen seasons, these two have been the voices of the colosseum matches in District 2. If you've ever watched a Grand Final, you've heard them. One of them shouts. One of them explains why the other one is shouting. And right now, they are not speaking to each other.
  - So I invited them both on the same morning. I'm not a mediator. I'm just a gem who likes a good show. Please welcome Rook and Joss!
  * From stage left comes Rook, a broad, short Ruby in a red jacket with a broadcaster's pin on the collar. From stage right comes Joss, a tall Jasper in a pressed gray suit. They both wave to the audience. Neither one looks at the other. They sit on their separate halves of the couch.
  @Alina
  - Welcome, both of you. Rook, how are you?
  @Rook
  - I'm good, Alina. Real good. Thanks for having me.
  @Alina
  - Joss, how are you?
  @Joss
  - Very well, thank you. It's a lovely studio.
  @Alina
  - It is a lovely studio. Rook, did you know Joss thinks my studio is lovely?
  @Rook
  - I didn't. We don't talk much these days.
  * The audience laughs. Joss sighs and looks at the ceiling.
  @Alina
  - Let's get into it. The Crystal Broadcast House is putting the two of you front and center for the Grand Final. Your faces are on every poster from here to the landing platforms. And then, on the first of next month, there's a big press day to promote it, and neither of you is going.
  - Rook. Why aren't you going?
  @Rook
  - Because I found out he signed a new deal. Bigger quarters at the Broadcast House, first pick of seats at every match, the works. And he didn't tell me.
  @Alina
  - Joss. Did you sign a better deal and not tell him?
  * Joss pauses.
  @Joss
  - I signed a new deal. I didn't think the details were anyone's business but mine.
  @Rook
  - We've sat in the same booth for twelve seasons! Twelve! I know how you take your energy drinks. I know you tap the desk with two fingers when a match goes to overtime.
  * Joss turns to look at Rook for the first time.
  @Joss
  - I do not do that.
  @Rook
  - You do it every time!
  @Alina
  - Gentlemen. Gentlemen. Let's keep the tiny details for the Grand Final. Rook, after you found out, you asked for the same deal, didn't you?
  @Rook
  - I did. Because if he's worth more, then so am I. We're a pair. You can't reward one half of a pair.
  @Alina
  - That's true. I'm a pair. If you only gave my Hessonite half the nice dressing room, my Pearl half would set the building on fire.
  * The audience laughs.
  @Alina
  - And then you went on that radio cast. The District 4 one. And you said, and I wrote this down so I'd get it right, that Joss would be happier calling matches all by himself.
  @Rook
  - It was a joke.
  @Joss
  - It wasn't.
  @Rook
  - It was half a joke.
  @Alina
  - Half a joke. Joss, how did that half land with you?
  @Joss
  - Badly. Because it isn't true, and he knows it isn't true. I've never wanted the booth to myself. I just wanted to be treated like I know what I'm doing.
  * Rook opens his mouth, then closes it. The audience goes quiet.
  @Alina
  - Say more about that, Joss.
  @Joss
  - Every season, the posters put Rook in front. The fans chant his catchphrases. He's the voice everybody does an impression of. And that's fine. He's earned it. But when the house offered me a better deal, I took it quietly, because I knew if I said it out loud, it would turn into exactly this.
  * He gestures at the ten feet of floor between them.
  @Rook
  - You could have told me.
  @Joss
  - I could have. I should have. I'm sorry I didn't.
  * Rook looks at Joss for a long moment. Then he looks at the audience. Then back at Joss.
  @Rook
  - That's the first time you've apologized to me in twelve seasons.
  @Joss
  - It's the first time I've been wrong in twelve seasons.
  * The audience bursts out laughing. Even Rook laughs, shaking his head.
  @Alina
  - Oh, I like you two. I like you two a lot. Okay. I have an idea, and you're both going to hate it, so let's do it fast.
  * Alina waves at the side of the stage. Two of the studio crew wheel out a small table with two microphones on it, and set it down right in the middle of the empty floor.
  @Alina
  - Tambour! Are you ready?
  * The band leader stands up from behind the keys and stretches.
  @Tambour
  - I was born ready, Alina.
  @Alina
  - Tambour and our stage manager are going to have a thumb wrestling match. Right now. Rook, Joss, you're going to call it. Together. At one table. And if you can call one thumb wrestling match together without biting each other's heads off, maybe there's hope for the Grand Final.
  * Rook and Joss look at each other. Slowly, they both get up and walk to the table in the middle. They sit side by side.
  * On a small platform, Tambour and the stage manager, a Bismuth in a headset, lock thumbs.
  @Rook
  - And we're LIVE from the Crystal Hour Studio, folks, for what might be the biggest thumb wrestling match this district has ever seen!
  @Joss
  - It's the only thumb wrestling match this district has ever seen, Rook, which technically makes it the biggest.
  @Rook
  - Tambour comes in with the long reach, he's a Spinel, those fingers go on forever!
  @Joss
  - But the Bismuth has the grip strength. You don't build half of Homeworld with a weak thumb.
  @Rook
  - One, two, three, four, I declare a thumb war! And they're OFF!
  * The two thumbs circle each other. The audience starts cheering.
  @Rook
  - Tambour goes high, Tambour goes HIGH!
  @Joss
  - A bold move. Spinels love to show off. It's a known weakness.
  @Rook
  - And the Bismuth comes down from the side, oh, she's got him, she's got him!
  @Joss
  - She's pinned him. That's a count. One. Two. Three.
  @Rook and Joss
  - AND THAT'S THE MATCH!
  * The audience jumps to its feet and cheers. The Bismuth throws both arms in the air. Tambour flops back into his chair like he's been poofed. Rook and Joss turn to each other and, without thinking, bump fists.
  * They both freeze, looking at their fists. The audience laughs harder.
  @Alina
  - Did everyone see that? Did the cameras get that? Rook and Joss, everybody! Back in the same booth!
  @Rook
  - That doesn't mean anything.
  @Joss
  - It means a little.
  @Alina
  - So. The press day. The first of next month. Are you going?
  * Rook and Joss look at each other.
  @Joss
  - I'll go if he goes.
  @Rook
  - I'll go if he tells me how big his new quarters are.
  @Joss
  - Absolutely not.
  @Alina
  - We'll call that a maybe! Rook and Joss, everybody! The Grand Final is in a few weeks, and whatever happens, it's going to be loud.
  * The audience cheers. Rook and Joss walk off the same side of the stage this time, still arguing about something.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT THREE]
  * The couch is back in one piece. A small stool has been added at the end of it. Alina is back in her armchair.
  @Alina
  - Welcome back. This next one is a little more serious, but only a little, because I don't do serious, it gives me wrinkles.
  * The audience laughs.
  @Alina
  - My next guest is one of the most played voices on the crystal casts in District 4. You've heard her singing in every shop and every club in this district. And right now, she's in a fight with the music house that made her famous. Please welcome Nia!
  * The audience cheers. Nia, a small Spinel with long pink braids and a jacket covered in hand-sewn patches, walks out and drops onto the couch. She waves to the crowd.
  @Nia
  - Hi! Hi, everyone! Hi, Alina!
  @Alina
  - Nia, sweetie, you look like a concert.
  @Nia
  - Thank you! I sewed all the patches myself. That one's from my first tour. That one's from my second tour. That one's from a snack bar.
  @Alina
  - A snack bar?
  @Nia
  - It was a really good snack bar.
  * The audience laughs.
  @Alina
  - So. Let's talk about the house. For anyone who hasn't been following this, the big music house in District 4 says you didn't finish the records your contract promised them. And they want everything your channel ever earned you in trade to make up for it.
  @Nia
  - They do.
  @Alina
  - And you said, "Fine, then I'm suing you back."
  @Nia
  - I didn't say it like that! I said it in a much more legal way. I had help.
  @Alina
  - Tell me what you're actually fighting for.
  * Nia sits up and gets serious for a moment.
  @Nia
  - My crystal-cast channel. My own channel. Where I post me singing in my room, me writing songs at three in the morning, me falling off a stool once, that one got very popular.
  @Alina
  - I've seen it. You fell very well.
  @Nia
  - Thank you! So that channel is mine. I started it before the house even knew who I was. But the house has been taking a cut of every gift and trade that channel brings in, because they say anything I sing belongs to them. And I don't think that's fair.
  @Alina
  - And you also used the old release rule to get out of your contract earlier this year.
  @Nia
  - I did. The rule says after enough years, a performer can walk away. And I walked. And then they said I owed them records. And then I said they owed me my channel. And now we're here.
  @Alina
  - And now you're here, on my couch, in a snack bar patch. This is the most important legal moment of the season.
  * The audience laughs. Alina turns toward the stool at the end of the couch.
  @Alina
  - Now, I always like both sides. So I asked the music house if they'd send someone. And they did. They sent their lawyer. Please welcome Vale!
  * The applause is a little thinner. Vale, a Kyanite in a long blue coat, walks out holding a thin holopad. She nods politely at the audience and sits on the stool.
  @Vale
  - Good morning.
  @Alina
  - Vale, thank you for coming. I know it's not easy to walk into a room full of Nia's fans.
  @Vale
  - I've walked into worse rooms. I work in Epsilon Blue's courts most days.
  * The audience laughs. Nia laughs too.
  @Alina
  - Vale, let's start with the big question. The one everybody in this district wants answered. Who owns a song once it's been sung?
  @Vale
  - It depends on the contract.
  @Alina
  - Oh, come on. That's a lawyer answer.
  @Vale
  - I'm a lawyer.
  * The audience laughs.
  @Vale
  - But I'll give you a real one. When Nia signed with the house, the house covered her studio time, her tours, her posters, and her cast promotions. In return, the songs she made for the house belong to the house. That's the deal. It's a fair deal. Most performers would be thrilled to get it.
  @Nia
  - The songs I made for the house, sure. But my channel isn't for the house. My channel is for me.
  @Vale
  - Your channel got popular because the house made you famous.
  @Nia
  - My channel was popular before! I had forty followers!
  @Vale
  - Forty.
  @Nia
  - Forty very loyal followers!
  * The audience cheers for Nia. Somebody in the back shouts that they were one of the forty.
  @Nia
  - See? He was one!
  @Alina
  - Vale, I have to say, the room is not on your side.
  @Vale
  - The room isn't the judge.
  @Alina
  - That's fair. That's very fair, and it's also very cold, and I respect it.
  * Alina leans forward.
  @Alina
  - Let me ask you both something. Is there a version of this where you both walk away happy? Or is this going all the way to court?
  * Vale looks down at her holopad. Nia looks at Vale. For a moment, nobody says anything.
  @Vale
  - Off the record?
  @Alina
  - Sweetie, this is live holovision. Nothing is off the record.
  @Vale
  - Then on the record. The house would be open to talking. If Nia agreed to finish the records she owes, the house would be willing to look again at what it takes from her channel.
  * Nia's eyes go wide.
  @Nia
  - Wait, really?
  @Vale
  - I said look again. I didn't say anything else. Please don't put that on a patch.
  * The audience laughs and applauds.
  @Nia
  - I'm going to put that on a patch.
  @Alina
  - Look at that. A music house and a Spinel, almost agreeing, on my couch. The courts owe me a favor for this.
  @Alina
  - Nia, before you go, would you sing us something? Something that definitely belongs to you?
  @Nia
  - Something from my channel?
  * Alina looks at Vale. Vale sighs and gestures for her to go ahead.
  @Vale
  - Fine. It's her channel. Probably.
  * The audience cheers. Tambour hands Nia a small hard light guitar from behind the band stand. She sits on the edge of the couch, plays a few quick notes, and sings a short, silly song about losing a shoe on the way to a concert. By the end, half the audience is singing along with the last line.
  * When she finishes, the studio erupts. Even Vale claps, quietly, twice.
  @Alina
  - Nia and Vale, everybody! Whatever happens in court, at least now we all know the shoe song.
  [BREAK]
  [THE CRYSTAL HOUR · CLOSING]
  * Alina stands at the front of the stage, alone, her cup back in her hand. The lights dim to gold.
  @Alina
  - That's our show, Gempire. Before I go, a few thank yous.
  - Thank you to Sable for being brave enough to talk about the shortest romance of the year, and to Chet for calling in from the gym and being the nicest gem to ever end a relationship.
  - Thank you to Rook and Joss, who started the morning ten feet apart and ended it bumping fists. We'll see you both at the Grand Final.
  - Thank you to Nia, who I'm sure will be fine, and to Vale, who walked into the most hostile room in District 4 and still got clapped for.
  - And to Vevila Dei over at The Homeworld Times. Vevila, sweetie, I know you're watching. I know you're taking notes. You can have the earring story. I've had it all hour.
  * The audience laughs.
  @Alina
  - We'll be back tomorrow with whatever the Gempire gets up to next.
  - Keep smiling, Gempire. Remember, you are never fully dressed without a smile!
  - I'm Alina, and this has been The Crystal Hour. Have a lovely day!
  * Tambour and the band play the theme. Alina waves to the audience as the lights fade, and the screen cuts to the Crystal Hour logo.
