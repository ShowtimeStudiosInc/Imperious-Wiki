title: You Can't Miss Paper
date: 2026-11-28
host: Alina
guests:
  - Wendell
  - Garrick
  - Lena
  - Noel
  - Tilly
credits: ''
summary: Alina takes everyone's cast slates at the door so two old stars can finally say hello, gives Lena the seat Mira left open, and sits a stage actor down with a fan whose letter ended up in the recycling.
transcript: |
  [THE CRYSTAL HOUR · LIVE FROM DISTRICT 4]
  * The lights come up warm. Tambour and the band play the theme at an easy morning pace.
  * Alina walks out in a mint blouse with a big white bow, a brown vest, and a long skirt striped in cream and green. Her pink curls are tied back with a ribbon. She carries her warm cup in one hand and a wide wicker basket in the other.
  @Alina
  - Good morning, Gempire! Look at you, all awake already. Sit down.
  * The audience laughs and sits.
  - You might be wondering about the basket. Hold that thought. It's for later, and some of you are going to be very upset with me.
  - Welcome to The Crystal Hour! I'm Alina. Let's go through the news.
  - First, a sad one. Selene, the singer, and Rowan, a Quartz who used to play in the ball league, have ended their engagement. They were together eight years. Eight! I've had this couch for less time than that.
  - Rowan shared the news himself, on his cast. He said it was a hard time, and that he had pictured a future with her. From the way he wrote it, it sounds like Selene was the one who ended it. Selene hasn't said anything yet.
  - Rowan, I'm sorry. Selene, the couch is here if you ever want it. No pressure. It's a very comfortable couch. I've been told it's the best seat in District 4. By me.
  * The audience laughs.
  - Next. You all remember The House of Harmony. Six seasons, a lot of singing, one very dramatic staircase. Emmett, the Spinel who played the music ruler on that show, took the house that books his work to a hearing. He says they talked him into taking less for his work, while they were also working for the gems who made the show.
  - The judge threw his case out a few months ago. This week, the same judge looked at it again and changed her mind. Two of his claims are going to a hearing after all.
  - I didn't know a judge could do that. I asked my producers. They didn't know either. So, Emmett, good luck. And judge, if you're watching, I respect a gem who can say "I was wrong" in writing.
  * A few gems in the audience clap.
  - All right. On the couch today, two old stars are finally going to say hello, which has taken them a whole week. And later, there's somebody I've been trying to get on this couch for a while, and this morning, she said yes.
  - Stay with us.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT ONE]
  * The band plays a short sting. Alina stands in the middle of the stage with the basket.
  @Alina
  - Okay. Now, the basket. Here's the story, for anyone who missed it. Wendell is a Spinel. He makes fright pictures. If you've ever had to sleep with the lamp on after a picture, it was probably one of his.
  - Garrick is a Quartz. A long time ago, he played the captain in Far Stars, the starship saga. Some of you grew up on it. I know I did.
  - Last month, at a fan gathering here in District 4, Wendell walked up to Garrick in the green room and said hello. Garrick didn't look up from his cast slate. Wendell told a cast show about it this week, and he called Garrick a name I'm not allowed to say before noon.
  * The audience laughs.
  - Then Garrick wrote him a note. In his own hand. He said he never heard Wendell at all. And he joked that he was probably reading a nice review of one of Wendell's pictures. Wendell wrote back and said he'd give him another chance.
  - So today, they're going to have that chance. And to make sure nobody misses it, I'm taking the slates. All of them.
  * Alina walks to the front row and holds out the basket. The audience groans.
  @Alina
  - I know. I know. You'll get them back. Every single one. Come on, in the basket.
  * Gems in the front rows drop their slates in. Alina walks over to the band.
  @Alina
  - Tambour.
  @Tambour
  - I'm not on mine.
  @Alina
  - It's in your hand.
  @Tambour
  - I'm holding it. I'm not on it.
  * Tambour drops his slate in the basket. The audience laughs.
  @Alina
  - Thank you. Now, please welcome Wendell and Garrick!
  * Two gems walk out from opposite sides of the stage. Wendell is a thin Spinel in a long black coat with a red scarf. Garrick is a broad, gray-haired Quartz in a captain's jacket that still fits him. They both stop at the couch and look at each other.
  @Alina
  - Before anyone sits. Garrick, is there a slate on you?
  @Garrick
  - No, ma'am.
  @Alina
  - Turn out your pockets.
  * Garrick turns out his jacket pockets. One slate falls out. The audience bursts out laughing.
  @Garrick
  - That's my backup.
  @Alina
  - Basket.
  * Garrick puts the slate in the basket. Alina sets the basket down next to the couch.
  @Alina
  - Okay. Wendell, the floor is yours.
  * Wendell holds out a hand.
  @Wendell
  - Hello. I'm Wendell. I make fright pictures.
  * Garrick shakes his hand, looking right at him.
  @Garrick
  - Hello, Wendell. I'm Garrick. I know exactly who you are.
  * The audience cheers. Tambour plays a big fanfare on the keys.
  @Alina
  - Thank you! It took a week and a basket, but we got there. Sit, both of you.
  * They sit, one at each end of the couch.
  @Alina
  - Garrick, I have to ask. When you say you know exactly who he is, what does that mean?
  @Garrick
  - It means I've seen every picture he's made. The one with the mirror is my favorite. I didn't sleep for two nights.
  @Wendell
  - Really?
  @Garrick
  - I slept with the lamps on.
  @Wendell
  - That's the nicest thing anyone has said about that picture.
  @Alina
  - Wendell, how did it feel, in that green room, when he didn't look up?
  @Wendell
  - I felt small, honestly. I'm old, and I've been making pictures a long time. I walked up to a gem I grew up watching, I said my name, and he just kept reading. I felt like the new gem on set again.
  @Garrick
  - I really didn't hear you.
  @Wendell
  - I know that now. That day, I was just mad.
  @Alina
  - And you called him a name on a cast show.
  @Wendell
  - I did. I shouldn't have said it on a cast show. I should have said it to his face.
  * The audience laughs.
  @Alina
  - Garrick, what were you reading?
  @Garrick
  - You want the truth?
  @Alina
  - Always.
  @Garrick
  - I don't remember. I said in the note that it was a review of one of his pictures. That was a joke. It was probably a message about where to park my ship.
  @Wendell
  - It was a good joke.
  @Garrick
  - I thought so.
  @Alina
  - So what do you two do now? Is this a friendship? Is it a picture? Please tell me it's a picture.
  * Wendell and Garrick look at each other.
  @Wendell
  - I do have a script with a captain in it.
  @Garrick
  - Is he scary?
  @Wendell
  - He's scared. That's different.
  @Garrick
  - Send it to me.
  @Wendell
  - I'll write to you on paper. You can't miss paper.
  * The audience laughs and claps.
  @Alina
  - You heard it first on The Crystal Hour. Now, before we go, I want to ask the room. Who here has ever said hello to someone, and they didn't look up from their slate?
  * Almost every hand in the audience goes up.
  @Alina
  - And who here has been the one who didn't look up?
  * Most of the hands go down. A few gems in the back slowly raise their hands. Garrick raises his.
  @Garrick
  - Guilty.
  @Alina
  - Thank you for being honest. Wendell and Garrick, everybody! Don't worry, you'll get your slates back after the next break. Probably.
  * The audience groans and laughs.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT TWO]
  * The band plays a short sting. The lights are a little softer. On the couch sits a Rhodochrosite in a fitted gray dress with her dark hair pulled back. She sits at the very edge of the cushion with her hands in her lap.
  @Alina
  - Welcome back. A few days ago, Mira sat on this couch and told us how her friendship with Lena ended. At the end of that show, I said the seat was still open. This morning, someone took it. Please welcome Lena.
  * The audience claps politely. A few gems whisper.
  @Lena
  - Good morning, Alina.
  @Alina
  - Good morning. Thank you for coming. I know you said no the first time.
  @Lena
  - I did. I'm sorry about that. I didn't want to sit here and fight with someone who wasn't in the room.
  @Alina
  - So why now?
  @Lena
  - Because now Mira is saying I cost her a job. And that isn't what happened. If I stay quiet, everyone will believe it.
  @Alina
  - Okay. Let's do that first. Here's what Mira says. A casting crew wanted both of you for the same show. You told them you didn't feel right with her there. And the booking fell through, right when she was getting ready to travel.
  @Lena
  - Part of that is true.
  @Alina
  - Which part?
  @Lena
  - The crew did want both of us. And the casting lead did ask me if I'd be all right working next to Mira. She asked me in private. And I told her the truth. I said no. Not that week.
  * The audience goes "ooh."
  @Lena
  - But I never asked them to drop her. I want to be very clear. I thought they'd put us on different days, or different ends of the runway. That happens all the time. I found out they let her go when Mira's agent did. The same day.
  @Alina
  - Did you try to fix it?
  @Lena
  - I wrote to the crew. I said I didn't mean for that to happen. They said the booking was already done.
  @Alina
  - Did you tell Mira that?
  * Lena looks down at her hands.
  @Lena
  - No.
  @Alina
  - Why not?
  @Lena
  - Because she wouldn't have believed me. And I'm not sure I'd blame her.
  * Alina doesn't say anything for a second.
  @Alina
  - Lena, I'm going to ask about Dane, because everyone at home wants me to, and I'd be bad at my job if I didn't.
  @Lena
  - Go ahead.
  @Alina
  - Are you still courting him?
  @Lena
  - Yes.
  @Alina
  - Was it worth it?
  * Lena takes a moment before she answers.
  @Lena
  - I don't think that's a fair question. It wasn't a trade. I didn't give up Mira to get Dane. I fell for someone I shouldn't have. I told her, and I lost her. I didn't plan any of it.
  @Alina
  - Mira said on this couch that you were always better at writing to him than she was.
  * Lena laughs and covers her mouth.
  @Lena
  - She said that?
  @Alina
  - She did.
  @Lena
  - That's so her. That's exactly the kind of thing she'd say. She's the funniest gem I know, and nobody knows it, because she always looks so serious on the runway.
  @Alina
  - You miss her.
  @Lena
  - Every day. I walk past our old dressing room and I still look in.
  @Alina
  - If she's watching, and I think she might be, what do you want her to know?
  * Lena looks into the camera for the first time.
  @Lena
  - Mira, I didn't take the job from you. I told the casting lead the truth, and you're the one who lost the job. I'm sorry. If you ever want to hear the rest, I'll tell you. You know where I live. It's still across the hall.
  * Nobody claps right away. Then a few gems do, and then more.
  @Alina
  - Lena, thank you. That took a lot. We'll be right back.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT THREE]
  * The band plays a bright sting. On the couch sits a Spinel with curly purple hair and a stage actor's big smile. Next to him sits a small Ruby holding a pink envelope with both hands. Alina's basket of slates sits on the floor at her feet.
  @Alina
  - Okay, something lighter. Please welcome Noel, from the District 4 stage, and Tilly, who is a fan!
  * The audience cheers. Tilly waves, very fast.
  @Alina
  - Noel, you had a week.
  @Noel
  - I had a week.
  @Alina
  - For anyone who missed it. A fan found a pile of letters to Noel in a recycling bin. Some of the envelopes looked just like the ones he showed on his cast when he thanked his fans. And people were very upset.
  @Noel
  - They had every right to be.
  @Alina
  - So what happened?
  @Noel
  - I was cleaning my rooms. I had a bag full of letters I'd already read, and I put it down next to a box of old scripts that were going out. And then I put the wrong thing in the box. That's it. That's the whole story. It's very boring and very bad.
  @Alina
  - Did you get them back?
  @Noel
  - Most of them. The fan who found them brought them to the stage door. I've been ironing them.
  @Alina
  - You've been ironing the letters?
  @Noel
  - They got a little wet.
  * The audience laughs.
  @Alina
  - Tilly, you write to Noel.
  @Tilly
  - Every week. For three years.
  @Alina
  - Three years! Was one of yours in the bin?
  @Tilly
  - Two.
  * Noel puts a hand over his face. The audience laughs.
  @Noel
  - I'm so sorry.
  @Tilly
  - It's okay! I wasn't mad. Well, I was mad for a day. And then I thought, he kept them long enough to read them. That's more than most gems do.
  @Alina
  - Tilly, what do you want from the stars you write to?
  @Tilly
  - Nothing, really. I don't need a letter back. I just want them to know somebody was in the third row, and it was a good show. That's all I ever say. "It was a good show." Sometimes I draw a little picture.
  @Alina
  - What kind of picture?
  @Tilly
  - Usually it's him. Sometimes it's his hat.
  @Noel
  - The hat ones are my favorite.
  @Alina
  - Noel, what's a fan letter worth, once you've read it?
  @Noel
  - I used to think, once I read it, the letter did its job. Now I keep thinking about how somebody sat down and wrote it, when they could have been doing anything else. I'm getting a box. A real box, with a lid. Nothing goes in the recycling again unless I check it twice.
  @Alina
  - What's in the envelope, Tilly?
  @Tilly
  - It's this week's letter. I wanted to give it to him myself, so I know where it went.
  * Tilly holds out the envelope. Noel takes it with both hands.
  @Noel
  - Can I open it?
  @Tilly
  - It's yours.
  * Noel opens the envelope and pulls out a card. He looks at it and laughs.
  @Alina
  - What is it?
  * Noel turns the card around. On it is a drawing of Noel's hat, sitting in a recycling bin.
  @Tilly
  - It says "It was a good show."
  * The audience bursts out laughing. Noel laughs so hard he has to lean on the arm of the couch.
  @Noel
  - That's going in the box. That's going at the top of the box.
  @Alina
  - Noel and Tilly, everybody! And now, as promised.
  * Alina picks up the basket and walks to the front row.
  @Alina
  - Your slates. Come get them. If it's not yours, don't take it. Tambour, that's not yours.
  @Tambour
  - It looks like mine!
  @Alina
  - They all look like yours.
  * The audience laughs.
  [BREAK]
  [THE CRYSTAL HOUR · CLOSING]
  * Alina stands at the front of the stage with the empty basket under one arm.
  @Alina
  - That's our show, Gempire. Thank you for spending your morning with me.
  - Thank you to Wendell and Garrick, who said hello in front of all of District 4. Garrick, I still have your backup slate. I'm keeping it.
  * The audience laughs.
  - Thank you to Lena, for taking the seat. Mira, if you want it back, it's yours too.
  - And thank you to Noel and Tilly. Noel, get the box with the lid. Tilly, keep drawing the hat.
  - We'll be back tonight with whatever the Gempire gets up to next.
  - Keep smiling, Gempire. Remember, you are never fully dressed without a smile!
  - I'm Alina, and this has been The Crystal Hour. Have a lovely day!
  * Tambour and the band play the theme. Alina waves the basket over her head as the lights fade, and the screen cuts to the Crystal Hour logo.
