title: That's a Very Nice Log
date: 2026-11-26
host: Alina
guests:
  - Mira
  - Nadia
  - Elsa
  - Piper
  - Otto
credits: ''
summary: Alina asks a runway star what's left when a friendship ends over a ball player, hands the Wilds camp's feuding cooks one stew pot and one ladle, and sits a lamp keeper next to the Bismuth who built her lamps to talk about the night District 0 went dark.
transcript: |
  [THE CRYSTAL HOUR · LIVE FROM DISTRICT 4]
  * The lights come up warm and gold. Tambour and the house band play the theme a little slower than usual, because it's morning and the horn player hasn't finished his tea.
  * Alina walks out in a rose pleated blouse with a black bow, a gray vest, and a long skirt striped in red and cream. Her pink curls are pinned up on one side. She has her warm cup in one gloved hand and a second cup in the other.
  @Alina
  - Good morning, Gempire! Good morning. Sit down, it's early, nobody needs to stand for me before noon.
  * The audience laughs and sits.
  - I brought two cups today. One is mine. The other one is also mine. It's been that kind of week.
  - Welcome to The Crystal Hour! I'm Alina. We have a full show, so let's go through the news fast, before my second cup gets cold.
  - First, love. Cleo, a Spinel, who co-hosts the Grand Dance, was seen out with Marcus, a Quartz. Marcus runs the morning training casts. If you've ever done squats in your quarters at dawn while a very loud Quartz counted for you, that was Marcus.
  - Marcus posted a picture of Cleo holding her pet. Everyone said how sweet. The next day, Cleo said they courted for a short while and it's over.
  - Now, some of you might remember Sable sitting on this couch with the shortest romance of the year. Sable, sweetie, I'm sorry. You've been passed. It was a good run.
  * The audience laughs. Tambour plays a sad little trombone.
  - Cleo, if you're watching, I'm not here to judge. I'm here to ask. Later. On this couch. Please.
  - Next, the courts. Ivy and Jett, both Spinels, rented a glass house in District 1 to shoot a short clip for their new song, Bright as Glass. Then they shot the entire song-cast there. The owner of the house said a short clip and a whole song-cast are not the same trade, and took them to the courts.
  - This week, they settled in private. Nobody will say what changed hands.
  * Alina leans toward the camera.
  - I will find out. Not today. But I will.
  * The audience laughs.
  - And finally, something sweet. Stella, the pop star, went home to her settlement for the harvest feast for the first time in years. She'd been on the outs with her family for a long time, and this week she's at the table. I don't have a joke for that one. I just think it's nice.
  * A few gems in the audience clap.
  - All right. On the couch today we have a runway star, the two cooks from the Wilds, and a lamp keeper from District 0 who says she saw something last night. She brought a Bismuth who thinks she saw nothing.
  - Stay with us. First, the most stylish breakup in District 4.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT ONE]
  * The band plays a short sting. On the couch sits a tall Rhodochrosite in a long cream coat with a high collar, her legs crossed and her back very straight.
  @Alina
  - Please welcome one of the best-known faces on the District 4 runways, Mira!
  * The audience cheers. Mira gives a small wave.
  @Mira
  - Good morning, Alina. Thank you for having me.
  @Alina
  - Mira, I have to say it. The coat.
  @Mira
  - Thank you. I almost wore something simpler.
  @Alina
  - A Rhodochrosite never underdresses.
  @Mira
  - Not even at breakfast.
  * The audience laughs.
  @Alina
  - So. You went on a cast show this week and said something a lot of gems were already guessing. You and Lena aren't friends anymore.
  @Mira
  - We aren't.
  @Alina
  - You two walked together for years. Every show, every season. I have a picture of you two at the Harvest Ball on my wall at home. Don't ask why. I'm a fan.
  @Mira
  - I think half of District 4 has that picture.
  @Alina
  - And then at the big runway show this year, you weren't together. People noticed.
  @Mira
  - People notice everything. That's the job.
  @Alina
  - Tell me what happened. In your own words.
  * Mira uncrosses her legs and sets both hands on her knees.
  @Mira
  - There was a ball player. Dane. A Quartz. I was courting him for months. It was going well, or I thought it was. And Lena knew everything about it. She helped me write to him.
  @Alina
  - She helped you write the messages?
  @Mira
  - Half of them. She's better with words than I am. I'd say what I wanted to tell him, and she'd say, no, say it like this. And it always sounded better her way.
  * Somebody in the audience says "oh no" out loud.
  @Mira
  - Yes. Oh no. Then it ended with Dane and me, quietly, no drama. And a little while later, Lena came to see me. She said she wanted to talk. And I knew before she sat down.
  @Alina
  - She was courting him.
  @Mira
  - She was courting him.
  * The audience groans. Tambour plays two low notes on the bass, then stops when Alina looks at him.
  @Alina
  - Tambour, not now, sweetie.
  @Mira
  - No, it's fine. It's a little funny. It's funny now.
  @Alina
  - Is it?
  @Mira
  - Some days.
  @Alina
  - Can I ask the thing everyone is thinking? Is this about Dane?
  @Mira
  - No. And I need people to hear that, because every gossip cast in the district is making it about Dane. Dane is a nice Quartz who throws a ball very far. I'm fine without Dane.
  - It's about Lena. I thought I would have her for good. We came up together. We shared a dressing room for three seasons. When I fell off the stage at my first show, she was the one who picked me up and told me to walk it like I meant it.
  @Alina
  - You fell off the stage?
  @Mira
  - Into the front row. Onto a Sapphire.
  @Alina
  - Oh no.
  @Mira
  - She saw it coming, so she didn't move.
  * The audience bursts out laughing. Mira smiles for the first time.
  @Alina
  - So you miss her more than you miss him.
  @Mira
  - Yes. I thought I'd still be talking to her in a hundred years.
  * Nobody in the audience laughs. Alina sets down her cup.
  @Alina
  - Did you invite her? I did. I want everyone to know I did.
  @Mira
  - I know you did. She told me.
  @Alina
  - She told you?
  @Mira
  - She sent me one message this morning. The first one in months. It said, "Alina asked me to come. I said no. Tell her I'm sorry."
  @Alina
  - Oh, that's very polite.
  @Mira
  - She was always polite. She even told me about Dane to my face, before any cast could. She just went ahead and did it anyway.
  @Alina
  - What would you say to her? If she were sitting where I'm sitting.
  * Mira thinks about it. She looks at the empty end of the couch, then back at Alina.
  @Mira
  - I think I'd tell her that she was always better at writing to him than I was. So maybe it makes sense.
  * The audience goes "ooh." Alina laughs and covers her mouth.
  @Alina
  - Mira! That's so cold!
  @Mira
  - I practiced it in the mirror.
  @Alina
  - It shows. Mira, everybody! You can see her on the runway at the Winter Show next month. We'll be right back.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT TWO]
  * The band plays a short sting. In front of the couch, the stagehands have set up a small camp stove. On it sits one large black stew pot. Next to the pot, on a stool, lies one wooden ladle.
  * On the couch sit a small, bouncy Spinel with short blue hair and a Pearl with her hair tied up in a cloth. There is a lot of room between them.
  @Alina
  - Welcome back! If you watch Out in the Wilds, and I know you do, because I've seen the numbers, you know these two. Please welcome Nadia and Elsa!
  * The audience cheers and claps. Nadia waves with both hands. Elsa nods.
  @Alina
  - Ladies, you might notice I've prepared something.
  @Nadia
  - Is that a stew pot?
  @Alina
  - It's a stew pot.
  @Elsa
  - Is there only one ladle?
  @Alina
  - There is only one ladle.
  * The audience goes "ooh." Nadia and Elsa look at the ladle, then at each other, then back at the ladle.
  @Alina
  - For those at home who missed it, and I don't know how you did, the Wilds camp had a very loud night. The two of you argued over who stirs the pot. And it went further than stirring.
  @Elsa
  - It did.
  @Nadia
  - It went a lot further than stirring.
  @Alina
  - Nadia, let's start with you. Why do you stir the pot?
  @Nadia
  - Because I'm good at it! I cooked every night of the first week. Nobody got sick. In the Wilds, that's a record.
  @Alina
  - Elsa?
  @Elsa
  - Because she adds things.
  @Nadia
  - I add flavor.
  @Elsa
  - She added a root she found on the trail. She didn't know what it was. She said it smelled friendly.
  @Nadia
  - It did smell friendly!
  @Elsa
  - Three of us couldn't feel our tongues until morning.
  * The audience bursts out laughing. Nadia covers her face.
  @Nadia
  - One time.
  @Elsa
  - One very long time.
  @Alina
  - Okay. So it's a real argument about cooking. I respect that. But then something got said.
  * The audience goes quiet. Elsa looks down at her hands.
  @Elsa
  - I said something I shouldn't have. I called her a word I'm not going to say again, on a show or anywhere. It was unkind, and it wasn't true.
  @Alina
  - And a lot of viewers wrote in.
  @Elsa
  - Hundreds. The broadcast board is still looking at it. I'd look at it too.
  @Alina
  - You said sorry on the show the next night.
  @Elsa
  - I did. In front of the whole camp.
  @Alina
  - Nadia, what's a sorry worth when the whole camp heard the fight?
  * Nadia thinks about it. She stops bouncing.
  @Nadia
  - I think it's worth more, actually. Anyone can say sorry quietly, behind the supply tent. She said it with everyone watching, and some of them were still mad at her. That's harder.
  @Alina
  - So you took it.
  @Nadia
  - I took it. I'm still a little mad. But I took it.
  @Elsa
  - That's fair.
  @Alina
  - And now the real test.
  * Alina points at the ladle. The audience laughs.
  @Alina
  - The stew is already in there. My stagehands made it. I'll be honest, I don't know what's in it, and neither do they. Somebody has to stir. Who's it going to be?
  * Nadia and Elsa look at each other. Elsa picks up the ladle and holds it out to Nadia.
  @Elsa
  - Go on.
  @Nadia
  - Really?
  @Elsa
  - You're good at it. I never said you weren't.
  * Nadia takes the ladle and stirs. The audience cheers. Then Nadia reaches into her pocket.
  @Elsa
  - What's that?
  @Nadia
  - Nothing.
  @Elsa
  - Nadia, what's in your hand?
  @Nadia
  - It's a root.
  @Elsa
  - Put it down.
  * The audience bursts out laughing. Nadia puts the root back in her pocket. Elsa takes the ladle back, gently, and they both laugh.
  @Alina
  - Look at that. Peace in the Wilds, thanks to one stew pot. Let's taste it.
  * Alina takes the ladle, tastes the stew, and stops. She swallows slowly.
  @Alina
  - Stagehands, we're going to talk after the show.
  * The audience bursts out laughing.
  @Alina
  - Nadia and Elsa, everybody! Out in the Wilds is on every night this week. Keep an eye on the pot, and keep an eye on Nadia's pockets. We'll be right back.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT THREE]
  * The band plays a softer sting. The studio lights are a little lower than before. On the couch sits a small, nervous Peridot holding a thick logbook on her lap with both hands. Next to her sits a broad Bismuth with a tool belt that he forgot to take off.
  @Alina
  - Welcome back. This next story is a little different, so I'm going to ask everyone to be on their best behavior. That includes you, Tambour.
  @Tambour
  - I didn't do anything.
  @Alina
  - Not yet.
  * The audience laughs softly.
  @Alina
  - Before we start, I want to say something clearly, so nobody at home gets the wrong idea. This show doesn't make jokes about the Diamonds. Not today, not ever. I like my job and I like my couch. So what we're going to talk about is what a gem says she saw, and what a lamp log says, and you can decide for yourselves.
  - My guests are Piper, a Peridot who keeps the street lamps of District 0 running through the night, and Otto, a Bismuth who built a lot of those lamps. Welcome, both of you.
  * The audience claps. Piper hugs the logbook a little tighter.
  @Piper
  - Thank you. Sorry. I've never been on a show.
  @Alina
  - You're doing great, sweetie. You haven't said anything yet, and you're already my favorite.
  @Otto
  - She's very good at her job. I want to say that first. Whatever else I say.
  @Alina
  - That's nice of you, Otto.
  @Otto
  - I'm going to say some other things too.
  @Alina
  - I figured.
  * The audience laughs.
  @Alina
  - Piper. Tell me about last night.
  @Piper
  - I was on the long street below the Throne. I check the lamps there every night. They're old, they need a lot of care. It was quiet, almost nobody out.
  - And then the lamp at the far end went out. And then the next one. And the next one. One after another, toward the road out to Court Nightshade. Like something very tall was walking down the street. But I didn't hear a thing.
  @Alina
  - Nothing at all?
  @Piper
  - No. I would have heard steps. I hear everything on that street. I can hear a lamp starting to go before it goes.
  @Alina
  - And then?
  @Piper
  - And then I looked up. And there was a ring, up over the rooftops. A ring of darkness, just hanging there. And then it wasn't there anymore, and the lamps came back on, in the same order they went out.
  * The audience is very quiet. Somebody near the back whispers to the gem next to them.
  @Alina
  - Otto.
  @Otto
  - Lamps go out.
  * The audience laughs.
  @Otto
  - I'm sorry, but they do. I built forty of those lamps. They go out when the light crystals get old. They go out when the cold gets into the wiring. They go out when a ship passes low and its field pulls on the line. Do you know how many ships come in and out of the Throne at night?
  @Alina
  - I don't.
  @Otto
  - A lot.
  @Alina
  - Piper, what do you say to that?
  @Piper
  - He's right. Lamps go out. I've fixed every way a lamp can go out. I know what a lamp looks like when it's tired. These weren't tired.
  * Piper opens the logbook and turns it around so Alina can see.
  @Piper
  - Every lamp on that street went dim within the same minute. In order. Start of the street to the end. I didn't write that down. The lamps write it down themselves. That's what the log is for.
  * Alina leans in and looks at the page for a while. Then she sits back.
  @Alina
  - That's a very nice log.
  * The audience laughs.
  @Piper
  - Thank you. I keep it very neat.
  @Alina
  - You do. Otto, does a passing ship turn off lamps in order, one after another, down a whole street?
  * Otto opens his mouth, closes it, and scratches his chin.
  @Otto
  - It would have to be a very long ship going very slowly.
  @Alina
  - Is that a thing?
  @Otto
  - It's not a common thing.
  * The audience goes "ooh."
  @Otto
  - I'm not saying I believe it. I'm saying I'd like to see that log when we're off the air.
  @Piper
  - You can see it.
  @Otto
  - Thank you.
  @Alina
  - Now, I asked around before the show, because I'm nosy. Some gems are saying it was Nightshade, since the night is his whole Domain, and the lamps went out toward his road. Piper, what do you think?
  @Piper
  - I don't know who it was. I'm not going to say a name. I'm a lamp keeper. I just know what I saw.
  @Alina
  - Good answer. Very safe.
  @Otto
  - It's very smart.
  @Alina
  - Did anyone from the courts get in touch with you?
  @Piper
  - No.
  @Alina
  - Nobody?
  @Piper
  - Nobody. I wrote to Court Alpha's office in the morning, to report the lamps. That's the rule for anything on that street.
  @Alina
  - And?
  @Piper
  - They wrote back that the report was received.
  @Alina
  - That's it?
  @Piper
  - That's it.
  * The audience goes "ooh" again, louder this time.
  @Alina
  - Okay. I'm going to do something I don't usually do. I want to ask the audience. If you think Piper saw what she says she saw, clap.
  * About half the audience claps.
  @Alina
  - And if you think Otto's right, and it was old lamps and a long ship, clap.
  * The other half claps. A few gems clap both times.
  @Alina
  - Half and half. That sounds about right for District 0.
  * Just then, the studio lights dip for half a second and come back. The audience gasps. Every head turns to the band.
  @Tambour
  - That was me. I leaned on the switch. I'm sorry. That was me.
  * The audience bursts out laughing.
  @Alina
  - Tambour, I told you to behave.
  @Tambour
  - I was behaving! I was leaning!
  @Alina
  - Piper and Otto, everybody! If you're in District 0 tonight and the lamps go out, don't panic, and please don't bother Piper. She's working.
  [BREAK]
  [THE CRYSTAL HOUR · CLOSING]
  * Alina stands at the front of the stage with her first cup, which is empty, and her second cup, which is also empty now.
  @Alina
  - That's our show, Gempire. Thank you all for getting up early with me.
  - Thank you to Mira, and her coat. I want that coat. Lena, the seat is still open.
  - Thank you to Nadia and Elsa, who settled the stew pot in front of everyone. Nadia, I saw the second root. Don't think I didn't.
  * The audience laughs.
  - And thank you to Piper and Otto. Piper, keep that log neat. Otto, go look at it. Then come back and tell me what you saw.
  - We'll be back tonight with whatever the Gempire gets up to next.
  - Keep smiling, Gempire. Remember, you are never fully dressed without a smile!
  - I'm Alina, and this has been The Crystal Hour. Have a lovely day!
  * Tambour and the band play the theme, a little faster now that everyone's awake. Alina waves with both cups as the lights fade, and the screen cuts to the Crystal Hour logo.
