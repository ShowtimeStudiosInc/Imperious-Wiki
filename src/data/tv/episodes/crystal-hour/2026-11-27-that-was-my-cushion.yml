title: That Was My Cushion
date: 2026-11-27
host: Alina
guests:
  - Finn
  - Wren
  - Veda
  - Carmen
  - Odette
credits: ''
summary: Alina plays a game of questions with a tennis champ who won't confirm his split, has a Zircon show how a fake cast post gets caught, puts a cushion between the two hosts who came to blows on live cast, and asks the Grand Dance's host how she smiled through a finale hours after her own breakup.
transcript: |
  [THE CRYSTAL HOUR · LIVE FROM DISTRICT 4]
  * The studio lights come up pink and gold. Tambour and the house band play the theme loud and fast, and the audience claps along.
  * Alina comes out in a black blouse with a white collar, a pink vest, and a long skirt striped in pink and gold. Her curls are down tonight. She has her warm cup in one gloved hand and waves with the other.
  @Alina
  - Good evening, Gempire! Thank you, thank you. Please sit, my band can't hear themselves.
  * The audience laughs and sits.
  - Welcome back to The Crystal Hour. I'm Alina. Before we start, I owe my stagehands a sorry. This morning I tasted their stew on air and made a face. I've since learned the stew was mostly a root Nadia left on the set. So that one's on Nadia.
  * The audience laughs. Tambour plays a little sad note on the trombone.
  - Okay, the news. Let's start with something nice, because the rest of tonight is not very nice.
  - At the Gems of the Year honors this week, Priya, a Rhodochrosite, stepped on the train of Anaya's gown on the carpet. Anaya is also a Rhodochrosite, so that's two of the best-dressed gems in the district, in one place, in one accident.
  - Anaya tripped. And before anyone could even gasp, Priya stopped, took her hand, bent down, and lifted the train off the carpet herself. Then they laughed and posed together for the casters like they'd planned it.
  * The audience claps.
  - That's how you do it. If you ever step on someone's gown, and some of you will, you bend down and you fix it. You don't walk away and pretend it was the wind.
  - Next. Delia, a Spinel, posted a public sorry to her partner, Banks, also a Spinel. Here's how it started. Faye, another Spinel, said Delia had cut her off on cast. Then Faye said, and I'm reading this off my card, that Delia "should have cut off Rico instead."
  * The audience goes "ooh."
  - Rico is a Spinel too. I know. It's a lot of Spinels. I need a chart.
  * The audience laughs.
  - That brought back some old talk about Delia and Rico. Delia said it wasn't true. Then she and Faye got on a call that turned into a shouting match. Nothing got settled. And then Delia wrote to Banks, in front of everyone, to say he's made her better and told her to stay out of messy cast rows. Which, Delia, sweetie, was good advice. A little late.
  * The audience laughs.
  - All right. My first guest is a tennis champ who doesn't want to talk about his love life, so we're going to talk about it in a way he'll understand. Then, later on, the host of the Grand Dance comes by, and she's had a week.
  - Stay with us.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT ONE]
  * The band plays a short sting. On the couch sits a tall Quartz in a white athletic jacket, spinning a tennis ball on one finger. He catches it when Alina sits down.
  @Alina
  - Please welcome the best tennis player in District 2, Finn!
  * The audience cheers. Finn raises the ball like it's a trophy.
  @Finn
  - Thanks for having me, Alina.
  @Alina
  - Thank you for coming. I know you almost didn't.
  @Finn
  - I almost didn't.
  @Alina
  - So I'll be fair. The trade papers say you and Sloane have split. Sloane is the star of the District 2 ball league, for anyone who's been living under a rock. You two were together almost two years. And neither of you has said one word about it.
  @Finn
  - That's right.
  @Alina
  - And her picture is still up on your cast.
  @Finn
  - That's also right.
  @Alina
  - Okay. I know you don't want to talk about it. So we're going to play a game. I serve a question. You return it any way you like. If you dodge it, I get the point. If you answer it, you get the point. Tambour is keeping score.
  @Tambour
  - I've got a little board and everything.
  * Tambour holds up a small chalkboard. The audience laughs.
  @Finn
  - All right. Serve.
  @Alina
  - Are you and Sloane still together?
  @Finn
  - Next question.
  @Tambour
  - Fifteen, Alina.
  @Alina
  - Did the papers get it right?
  @Finn
  - The papers get a lot of things right. And a lot of things wrong.
  @Tambour
  - Thirty, Alina.
  @Finn
  - That was an answer!
  @Tambour
  - It was a very nice dodge.
  * The audience laughs.
  @Alina
  - Is there a reason her picture is still on your cast?
  @Finn
  - I like the picture.
  @Alina
  - That's it?
  @Finn
  - It's a good picture. She's holding a trophy. I'm holding her trophy, actually, because her hands were full. It's a good day. I'm not going to take down a good day.
  * A few gems in the audience clap. Alina puts a hand on her chest.
  @Tambour
  - Point to Finn.
  @Alina
  - Yes. That one's yours. That was a real answer.
  @Finn
  - I have a few.
  @Alina
  - Last one. Match point. What does a pair owe the fans, when the papers call the split before the pair does?
  * Finn stops spinning the ball.
  @Finn
  - Honestly? I don't think we owe anyone the first word. The fans come to the court to see me play. They get everything I have, every match. I don't think the part where I go home is part of the ticket.
  - But I'll say this. If there's ever something to say, they'll hear it from us. Not from a paper. And not from a fake post.
  @Alina
  - Ah. You saw that.
  @Finn
  - Everyone saw that.
  @Alina
  - Well, good, because that's where we're going next. Tambour, what's the score?
  @Tambour
  - Two points each. I'm calling it a tie.
  @Alina
  - A tie on my own show. Fine. Finn, stay right there.
  * A slim Zircon in a long blue coat walks out with a holopad under her arm. She sits at the other end of the couch and nods at Finn.
  @Alina
  - Everyone, this is Wren. Wren is a Zircon, and she checks evidence for the courts. These days, she also spends her free time catching fake cast posts, because there are a lot of them. Wren, welcome.
  @Wren
  - Thank you. I don't usually come out in the evening. It's very bright in here.
  @Alina
  - You get used to it. So. After the papers broke the story, a post went around that looked like Sloane wrote it. It said she was going to stay single and focus on her game. And it spread fast.
  @Wren
  - Thousands of shares in one night. Most of them before anyone read it twice.
  @Alina
  - And it wasn't real.
  @Wren
  - It wasn't real. Can I show you?
  @Alina
  - Please.
  * Wren holds up her holopad. A copy of the fake post shows on the big screen behind the couch, with a red line through it.
  @Wren
  - The first thing I check is the little picture in the corner. Every cast page has one. On this post, the picture is Sloane in her old league jersey. She hasn't used that picture on her cast in over a year. Whoever made this found an old image and didn't check.
  @Alina
  - So the mistake was being lazy.
  @Wren
  - It almost always is. The second thing I check is the words. If she posted it, it would be on her page. I went through every post she's ever made. It isn't there. It never was.
  @Alina
  - That's it? That's all it took?
  @Wren
  - That's all it took. Whoever made it was hoping nobody would look. Most gems didn't.
  @Alina
  - Finn, how did it feel, watching that post go around?
  @Finn
  - Bad. Not for me. For her. Somebody put words in her mouth, and a lot of gems believed it because it fit what they already wanted to hear.
  @Wren
  - That's exactly why they work.
  @Alina
  - So what's the one thing everyone at home can do?
  @Wren
  - Go to the page. If they said it, it's on the page. If it's only on someone else's page, wait.
  @Alina
  - Go to the page. Finn and Wren, everybody!
  * The audience cheers. Finn tosses the tennis ball into the crowd. Somebody in the third row catches it and holds it up.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT TWO]
  * The band plays a short sting. On the couch sit two Spinels. One has curly orange hair and a green jacket. The other has straight black hair and a red jacket. Between them, the stagehands have placed one very large, very soft cushion.
  @Alina
  - Welcome back. If you watch cast shows, you know these two. They host The Wild Pair, where they get into trouble on live cast, every week, on purpose. This week, it got a little too live. Please welcome Veda and Carmen!
  * The audience cheers and claps. Veda waves. Carmen points at the cushion.
  @Carmen
  - Is this for us?
  @Alina
  - It's for my couch. That couch has been with me a long time.
  * The audience laughs.
  @Alina
  - For anyone who hasn't seen the clip, and I don't know how you haven't, here's what happened. On this week's stream, you two got into an argument about your past romances. It got personal. And then it got physical, and your crew had to pull you apart.
  @Veda
  - That's what happened.
  @Carmen
  - That's pretty much what happened.
  @Alina
  - So how are you both doing?
  @Veda
  - Good!
  @Carmen
  - Really good.
  @Alina
  - You're both smiling.
  @Veda
  - We made up the next day.
  @Carmen
  - We made up that night, actually. In the hallway. The crew was still holding my arms, and we were already laughing.
  * Alina looks at them, then at the camera, then back at them.
  @Alina
  - Can I ask the question everyone at home is asking?
  @Veda
  - Go ahead.
  @Alina
  - Was it real?
  @Veda and Carmen
  - Yes!
  * The audience goes "ooh."
  @Alina
  - You said that very fast.
  @Carmen
  - Because it was real! Look at my jacket. There's still a tear on the shoulder.
  * Carmen turns to show the tear. Veda leans over the cushion to look.
  @Veda
  - That's from the door.
  @Carmen
  - That's from you.
  @Veda
  - You walked into the door!
  @Carmen
  - Because you pushed me into the door!
  @Veda
  - I didn't push you, I moved you.
  * Carmen picks up the cushion. Veda grabs the other side of it. They both pull. The audience laughs and cheers.
  @Alina
  - Ladies! Ladies. The cushion is a guest. Please put down my guest.
  * They let go at the same time. The cushion drops back onto the couch.
  @Alina
  - Okay. This is very interesting to me. You two had a real fight, on live cast, with the whole district watching. You made up that night. And now your numbers are the best they've ever been.
  @Veda
  - They are.
  @Carmen
  - They're very good.
  @Alina
  - So what's a fight worth, when everyone is watching?
  * Veda thinks about it.
  @Veda
  - Honestly, a lot less than you'd think. The numbers went up for a week. That's nice. But after the clip went around, my friends stopped asking me how the show was going and started asking if I was all right. I don't love that.
  @Carmen
  - And people picked sides. That's the part I hate. There are gems out there who think Veda is a bad gem now. She's not. She's the reason I have a show.
  @Veda
  - Oh, stop it.
  @Carmen
  - No, I mean it. I wouldn't do this with anyone else. I'd just fight them for real.
  * The audience laughs.
  @Alina
  - So it won't happen again?
  @Veda
  - It won't happen again.
  @Carmen
  - It probably won't happen again.
  @Veda
  - Carmen.
  @Carmen
  - It won't happen again on purpose.
  * The audience laughs.
  @Alina
  - That's the most honest thing anyone's said all week. Veda and Carmen, everybody! The Wild Pair is on every week. Watch it. Bring a cushion.
  * Veda and Carmen stand. Carmen takes the cushion with her. Alina watches it go.
  @Alina
  - That was my cushion.
  [BREAK]
  [THE CRYSTAL HOUR · SEGMENT THREE]
  * The band plays a slow version of the Grand Dance theme. A tall Spinel in a short silver dress walks out to big applause and sits down. Her pink hair is cut short. She looks tired, but she's smiling.
  @Alina
  - My last guest tonight is someone I really admire, and I'm not just saying that because she's in my business. She co-hosts the Grand Dance, the biggest dance contest in District 4. Please welcome Odette!
  * The audience stands up and claps. Odette waves and mouths "thank you."
  @Odette
  - Hi, Alina. Thank you for having me. Sorry, I'm a little tired.
  @Alina
  - You're allowed. You had a big week. You hosted the season finale.
  @Odette
  - I did.
  @Alina
  - Live. In front of the whole district.
  @Odette
  - Every gem in District 4 and some outside it.
  @Alina
  - And a few hours before that, word got out that your courtship with Griff had ended.
  @Odette
  - Yes.
  @Alina
  - Griff is a Quartz. He's a drill instructor. I hear he can make a room of Rubies do push-ups just by looking at them.
  @Odette
  - He can. It's a little scary.
  * The audience laughs.
  @Alina
  - Before I ask anything else, I have to ask this. What is going on at the Grand Dance? Your co-host, Cleo, was on the news this morning for a romance that lasted about a day. Now you. Is it the stage? Is something in the water?
  @Odette
  - It's the hours. We rehearse from morning to night. You don't have time for anyone. You meet someone nice, and three weeks later you've seen him twice, and you're both wondering why.
  @Alina
  - Is that what happened with Griff?
  @Odette
  - I'm not going to say why it ended. That's his business too. He didn't ask to be on the news.
  @Alina
  - That's fair.
  @Odette
  - I'll say he's a good gem. He came to every show he could. He sat in the back so nobody would notice him, which didn't work, because he's very tall.
  * The audience laughs.
  @Alina
  - So tell me about that night. Word gets out in the afternoon. The show goes live in a few hours. What did you do?
  @Odette
  - I sat in my dressing room for a while. My stylist came in and asked if I wanted to wear something else. Something darker, something that covered more. And I said no. I'll wear the short silver one, like we planned.
  @Alina
  - Why?
  @Odette
  - Because everyone would be looking. If I came out in something sad, the whole night would be about me. It wasn't my night. It was the dancers' night. They worked all season for it.
  * The audience claps.
  @Alina
  - And you smiled through the whole thing.
  @Odette
  - I did. And I want to be honest about that, because I think people at home think it's easy for us. It's not. There was a moment, right before the last dance, where I forgot my line. Just for a second. And I looked out at the crowd, and I thought, I can't do this.
  @Alina
  - What happened?
  @Odette
  - One of the dancers caught my eye. A little Bismuth, she'd been in the bottom two all season, and she made it to the finale anyway. And she was so scared. And I thought, if I fall apart right now, she's going to fall apart too. So I smiled at her. And she smiled back. And then I remembered my line.
  * The studio is quiet. Alina puts her cup down on the table.
  @Alina
  - You know, people ask me how I do this every night, and I never have a good answer. I think I'm going to steal yours.
  @Odette
  - Go ahead. I stole it from somebody too.
  @Alina
  - Did the Bismuth win?
  @Odette
  - Second place.
  @Alina
  - Oh, I love that.
  @Odette
  - She cried the whole way off the stage. I cried in the dressing room after. We were both crying for different reasons, and we hugged anyway.
  @Alina
  - Okay, I'm not going to cry on my own show. Can you teach me something? Anything from the Grand Dance?
  @Odette
  - Right now?
  @Alina
  - Right now. Tambour?
  @Tambour
  - Ready when you are.
  * Odette stands and pulls Alina up from the couch. Tambour and the band play a slow, simple step. Odette shows her a turn. Alina gets it wrong the first time and steps on Odette's foot.
  @Alina
  - Oh! I'm sorry!
  @Odette
  - It's fine. Do it again.
  * Alina tries again. This time, she gets it. The audience cheers. Odette spins her once more and lets go.
  @Odette
  - See? Easy.
  @Alina
  - That was not easy.
  * The audience laughs.
  @Alina
  - Odette, everybody! The Grand Dance comes back next season, and I'll be in the audience. Not on the stage. Never on the stage.
  [BREAK]
  [THE CRYSTAL HOUR · CLOSING]
  * Alina stands at the front of the stage, a little out of breath. The lights dim to pink.
  @Alina
  - That's our show, Gempire. Thank you all for staying up with me.
  - Thank you to Finn, who tied me at my own game, and to Wren. Everyone at home, go to the page.
  - Thank you to Veda and Carmen, who came in as friends and left with my cushion.
  * The audience laughs.
  - And thank you to Odette, who showed me a turn and didn't even get mad when I stepped on her foot.
  - We'll be back tomorrow with whatever the Gempire gets up to next.
  - Keep smiling, Gempire. Remember, you are never fully dressed without a smile!
  - I'm Alina, and this has been The Crystal Hour. Goodnight!
  * Tambour and the band play the theme. Alina tries the turn one more time on her own, almost gets it, and waves as the lights fade. The screen cuts to the Crystal Hour logo.
