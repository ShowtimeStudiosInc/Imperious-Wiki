# Holovision: every show on the wiki's TV destination (/tv/).
#
# A show either links to a section that already exists (`href`, like The Homeworld Times at /news/),
# or keeps its episodes in src/data/tv/episodes/<slug>/, one .yml file per episode.
# An episode file looks like a Homeworld Times broadcast:
#   title, date (YYYY-MM-DD), host, guests (list), credits, summary, and transcript.
# The transcript uses the same markers as news broadcasts:
#   [ON AIR]          a line in square brackets is an on-screen card
#   * She leans in.   a line starting with "* " is an action or camera note
#   @Alina            switches who is talking
#
# status: on-air (has episodes or a page), coming-soon (shown with a "Coming soon" tag)
# order sets the order on the guide.

