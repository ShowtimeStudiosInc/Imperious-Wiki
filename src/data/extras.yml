  green-serpentine: { components: [lapis, scapolite], threatClass: Champion }
  blue-halite: { components: [lapis, orca-agate], threatClass: Champion, alsoFactions: [rogue], description: "A deep blue gem with small cracks that can be seen inside. It seems to have flowing water inside that shimmers, giving it a striped look." }
  dark-blue-hawk-s-eye: { components: [topaz, jasper], threatClass: Champion, description: "The gem is mostly blue, very dark in color, with stripes of color coming out of it, in this case yellow. It looks like an eye from certain angles, and it's said a stare from this fusion makes even the strongest soldiers flinch." }
