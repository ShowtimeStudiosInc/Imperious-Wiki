# Random events for the Diamond Approval Rating. The world-events workflow picks from this list:
# a small event every 2 hours, a medium event every few days, and a weekly report once a week.
#
# Fields:
#   id:      unique name (used so the same event doesn't repeat too soon)
#   tier:    small, medium or big
#   who:     who it can happen to: any, diamond, regent, deity, ruling, or a list of slugs
#   alpha_ok: Alpha Black stays out of public life, so she only gets events that name her or have this set
#   acts:    true if the Diamond or Regent does something themselves (these come up less often)
#   change:  [lowest, highest] points for the main gem. Negative numbers are drops.
#   other:   points for a second Diamond or Regent ({other} in the text). Add `other_who` to fix who it is.
#   targets: (big events) how many people it hits, each rolled separately on `change`
#   unrest:  how much the event moves the Unrest meter (+ more unrest, - calmer)
#   min_unrest / max_unrest: only happens when Unrest is in that range
#   sets / needs: chains. `sets: strike` marks the gem; a later event with `needs: strike` follows up on it.
#   text:    what happened. {short} = their short name, {name} = full name, {other} = second gem,
#            {gem} = a random Gem-Type, {a_gem} = the same with "a" or "an" in front.
#
# Write events plainly. They should read like news, not a story twist, and nothing so big it changes the plot.

