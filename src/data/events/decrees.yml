# Decrees for the Diamond Approval Rating.
#
# Once a week, the player of each Diamond or Grand Regent may pick ONE decree with Astrid's /decree command.
# Astrid checks `players` below to see who they play, then adds the decree under `pending` at the bottom of
# this file. Every pending decree takes effect with the Sunday weekly report, shows up in the Approval Rating
# log, and is cleared from the list afterwards. Staff can also add one by hand.
#
# A pending entry looks like this:
#   - who: nightshade-violet        (their slug, as in popularity.yml)
#     decree: festival               (one of the ids below)
#     note: A night market in District 1 for the whole court.   (optional, shown with the decree)
#
# Fields on each decree type:
#   change:   [lowest, highest] points for the gem who made it
#   unrest:   how much it moves the Unrest meter
#   cooldown: weeks before the same gem can use it again (1 = every week)
#   risk:     chance (0 to 1) that it goes badly, using `bad_change` and `bad_text` instead
#   follow:   points the week AFTER, with `follow_text` (used by Reform)
#   shield:   true = no random bad news for that gem until the next weekly report (used by Lie Low)
#   text:     {short} = their short name, {note} = the player's note

types:
  - id: appearance
    name: Public Appearance
    about: Show up in person. Usually goes well. Sometimes it really doesn't.
    change: [2, 4]
    risk: 0.2
    bad_change: [-3, -1]
    text: "{short} made a public appearance on Homeworld. {note}"
    bad_text: "{short} made a public appearance on Homeworld, and it didn't go the way their court hoped. {note}"

  - id: crackdown
    name: Crackdown
    about: Come down hard on trouble. Loyal gems like it. Everyone else gets nervous.
    change: [2, 4]
    unrest: 3
    text: "{short} ordered a crackdown in their territory. {note}"

  - id: festival
    name: Festival
    about: Throw a celebration. Calms things down, but it costs the court, so it can't be done two weeks running.
    change: [1, 3]
    unrest: -2
    cooldown: 2
    text: "{short} threw a festival for their court. {note}"

  - id: aid
    name: Send Aid
    about: Send supplies and crews to colonies that need them. Small, safe, and it calms things a little.
    change: [1, 2]
    unrest: -1
    text: "{short} sent supplies and crews to struggling colonies. {note}"

  - id: reform
    name: Reform
    about: Change how the court works. Barely noticed at first, but it pays off the week after.
    change: [0, 1]
    follow: [3, 5]
    text: "{short} announced a reform in their court. Most gems are waiting to see if it does anything. {note}"
    follow_text: "{short}'s reform from last week is starting to show results. Gems in their court have noticed the difference."

  - id: lie-low
    name: Lie Low
    about: Stay out of the spotlight for a week. No points, but no random bad news either.
    change: [0, 0]
    shield: true
    text: "{short} kept out of the public eye this week. {note}"

# Who plays whom: each slug lists the Discord user IDs allowed to issue decrees for that character.
