<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-body: "Nunito", system-ui, sans-serif;
    --font-display: "Orbitron", system-ui, sans-serif;
    --bg: #120d2c; --bg-deep: #241a4a;
    --panel: rgba(30, 22, 62, .9); --panel-2: rgba(30, 22, 62, .9); --panel-solid: rgba(20, 15, 44, .92);
    --ink: #fff4fa; --ink-soft: #f0cfe2; --ink-faint: #b7a3cc;
    --gold: #ff9ccc; --gold-bright: #8fdcf2; --gold-pale: #ffc2df;
    --brown-deep: rgba(16, 12, 36, .95);
    --line: rgba(255, 156, 204, .18); --line-strong: rgba(143, 220, 242, .42);
    --chip: rgba(255, 156, 204, .15);
    --quote-bg: rgba(16, 12, 36, .9); --quote-ink: #fff4fa;
    --shadow: 0 18px 44px rgba(0, 0, 0, .45);
    --sp: #241a4a; --sp-bg: #8fdcf2; --badge-ink: #241a4a;
  }
  body { background: var(--bg); }
  h1 { text-shadow: 0 0 18px rgba(255, 156, 204, .45); }
  .hero { border-top-color: var(--gold-bright) !important; }

  /* Cotton candy space. The sky fades from night into a pink and blue dusk. A sugar planet sits up top,
     signal rings pulse out of a little satellite, morse code drifts past, and a bank of cotton candy
     clouds fills the bottom of the screen. */
  .cc-sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 45% at 25% 100%, rgba(255, 156, 204, .35), transparent 70%),
      radial-gradient(ellipse 60% 40% at 85% 100%, rgba(143, 220, 242, .3), transparent 70%),
      linear-gradient(180deg, #0c0922 0%, #18123a 45%, #2e1f5a 75%, #4a2a6e 100%); }

  .cc-star { position: absolute; border-radius: 50%; background: #fff; opacity: .6; animation: twinkle 5s ease-in-out infinite; }
  .cc-star.p { background: #ffc2df; } .cc-star.b { background: #bfefff; }
  .cc-spark { position: absolute; width: 12px; height: 12px; opacity: .8; animation: twinkle 4s ease-in-out infinite; }
  .cc-spark::before, .cc-spark::after { content: ""; position: absolute; left: 50%; top: 50%; background: #fff; border-radius: 2px; transform: translate(-50%, -50%); }
  .cc-spark::before { width: 2px; height: 12px; } .cc-spark::after { width: 12px; height: 2px; }

  .cc-planet { position: absolute; left: 1.5%; top: 52%; width: 150px; height: 150px; }
  .cc-sat { position: absolute; right: 5%; top: 40%; width: 46px; height: 46px; animation: bob 6s ease-in-out infinite; }
  .cc-ring { position: absolute; right: calc(5% + 23px); top: calc(40% + 23px); width: 40px; height: 40px; margin: -20px -20px 0 0;
    border: 2px solid rgba(143, 220, 242, .55); border-radius: 50%; animation: ping 4.5s ease-out infinite; }
  .cc-ring.p { border-color: rgba(255, 156, 204, .55); }

  .cc-morse { position: absolute; left: 0; font: 700 18px/1 "Orbitron", monospace; letter-spacing: .4em; white-space: nowrap;
    color: rgba(255, 194, 223, .2); animation: drift 80s linear infinite; }
  .cc-morse.b { color: rgba(191, 239, 255, .17); animation-duration: 105s; }

  .cc-shoot { position: absolute; width: 140px; height: 2px; border-radius: 2px; opacity: 0;
    background: linear-gradient(90deg, transparent, #fff 70%, #ffc2df); transform: rotate(-20deg); animation: shoot 11s ease-in infinite; }

  .cc-clouds { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; min-height: 200px; }
  .cc-clouds .back { animation: bob 14s ease-in-out infinite; }
  .cc-clouds .front { animation: bob 10s ease-in-out infinite reverse; }

  @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: .95; } }
  @keyframes drift { from { transform: translateX(-60vw); } to { transform: translateX(120vw); } }
  @keyframes ping { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(5); opacity: 0; } }
  @keyframes shoot { 0%, 82% { opacity: 0; transform: translate(0, 0) rotate(-20deg); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-60vw, 22vw) rotate(-20deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .cc-sky * { animation: none !important; } .cc-ring, .cc-shoot { display: none; } .cc-morse { transform: translateX(10vw); } }
  @media (max-width: 760px) { .cc-planet { width: 100px; height: 100px; left: auto; right: 3%; top: 6%; } .cc-sat, .cc-ring { display: none; } }
</style>
<!--mark-->
<svg class="hero-mark" width="190" height="190" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="34" fill="#ff9ccc"/><ellipse cx="50" cy="54" rx="22" ry="18" fill="#8fdcf2"/><circle cx="24" cy="18" r="12" fill="#ffc2df"/><circle cx="76" cy="18" r="12" fill="#8fdcf2"/></svg>
<!--/mark-->
<div class="cc-sky" id="cc-sky" aria-hidden="true">
  <svg class="cc-planet" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="ccPlanet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2df"/><stop offset=".55" stop-color="#ff9ccc"/><stop offset="1" stop-color="#8fdcf2"/></linearGradient>
      <clipPath id="ccClip"><circle cx="100" cy="100" r="62"/></clipPath>
    </defs>
    <g transform="rotate(-14 100 104)"><ellipse cx="100" cy="104" rx="96" ry="22" fill="none" stroke="#bfefff" stroke-opacity=".4" stroke-width="7"/></g>
    <circle cx="100" cy="100" r="62" fill="url(#ccPlanet)"/>
    <g clip-path="url(#ccClip)">
      <path fill="#fff" fill-opacity=".35" d="M30 78 Q70 64 110 80 T180 76 V90 Q140 98 100 88 T30 92Z"/>
      <path fill="#8fdcf2" fill-opacity=".45" d="M30 122 Q80 108 120 124 T180 118 V132 Q130 142 90 130 T30 136Z"/>
    </g>
    <circle cx="78" cy="78" r="16" fill="#fff" fill-opacity=".25"/>
    <g transform="rotate(-14 100 104)"><path d="M4 104 A96 22 0 0 0 196 104" fill="none" stroke="#bfefff" stroke-opacity=".8" stroke-width="7"/></g>
  </svg>
  <svg class="cc-sat" viewBox="0 0 46 46">
    <rect x="2" y="17" width="12" height="12" rx="2" fill="#8fdcf2"/><rect x="32" y="17" width="12" height="12" rx="2" fill="#8fdcf2"/>
    <rect x="14" y="21" width="18" height="4" fill="#ffc2df"/>
    <circle cx="23" cy="23" r="8" fill="#ff9ccc"/><circle cx="23" cy="23" r="3.5" fill="#fff"/>
    <line x1="23" y1="15" x2="23" y2="5" stroke="#ffc2df" stroke-width="2"/><circle cx="23" cy="4" r="2.5" fill="#fff"/>
  </svg>
  <span class="cc-ring"></span><span class="cc-ring p" style="animation-delay:1.5s"></span><span class="cc-ring" style="animation-delay:3s"></span>
  <span class="cc-shoot" style="right:-10%;top:8%"></span>
  <svg class="cc-clouds" viewBox="0 0 1440 300" preserveAspectRatio="none">
    <g class="back">
      <path fill="#8fdcf2" fill-opacity=".28" d="M0 170 C60 110 140 120 180 150 C210 90 320 90 350 150 C390 110 470 115 500 160 C540 100 650 100 680 155 C720 120 800 120 830 165 C870 95 990 95 1020 155 C1060 115 1140 120 1170 160 C1210 100 1320 105 1350 160 C1380 130 1420 135 1440 150 V300 H0Z"/>
    </g>
    <g class="front">
      <path fill="#ff9ccc" fill-opacity=".34" d="M0 215 C50 165 130 170 160 205 C200 150 300 150 330 205 C370 170 440 172 470 210 C510 158 610 158 640 210 C680 175 760 178 790 215 C830 160 930 160 960 210 C1000 175 1080 178 1110 215 C1150 165 1250 165 1280 210 C1320 180 1400 182 1440 205 V300 H0Z"/>
      <path fill="#ffe3f0" fill-opacity=".2" d="M0 260 C80 225 160 232 210 255 C260 222 360 222 410 255 C470 228 560 230 610 258 C670 224 770 226 820 256 C880 226 980 228 1030 258 C1090 226 1190 228 1240 256 C1300 230 1390 232 1440 250 V300 H0Z"/>
    </g>
  </svg>
</div>
<script>
  (function () {
    var sky = document.getElementById('cc-sky'); if (!sky) return;
    var before = sky.querySelector('.cc-clouds');
    for (var i = 0; i < 70; i++) {
      var s = document.createElement('span'), size = Math.random() < .15 ? 3 : 2;
      s.className = 'cc-star' + (i % 3 === 1 ? ' p' : i % 3 === 2 ? ' b' : '');
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 68 + '%';
      s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
      sky.insertBefore(s, before);
    }
    for (var j = 0; j < 6; j++) {
      var k = document.createElement('span'); k.className = 'cc-spark';
      k.style.left = (8 + Math.random() * 84) + '%'; k.style.top = (5 + Math.random() * 50) + '%';
      k.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      sky.insertBefore(k, before);
    }
    // "HI / BOO", "CECE / HI" and "PRANK" in morse code, since that is the only way Cece talks
    var lines = [['.... ..   /   -... --- ---', 22, ''], ['-.-. . -.-. .   /   .... ..', 48, ' b'], ['.--. .-. .- -. -.-', 61, '']];
    lines.forEach(function (l, i) {
      var m = document.createElement('div'); m.className = 'cc-morse' + l[2];
      m.textContent = l[0]; m.style.top = l[1] + '%'; m.style.animationDelay = (-i * 27) + 's';
      sky.insertBefore(m, before);
    });
  })();
</script>
