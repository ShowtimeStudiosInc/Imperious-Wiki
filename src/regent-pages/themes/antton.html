<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-body: "Nunito Sans", system-ui, -apple-system, Segoe UI, sans-serif;
    --font-display: "Pixelify Sans", "Courier New", monospace;
    --bg: #1f0a2c; --bg-deep: #3b1350;
    --panel: rgba(70, 22, 88, .9); --panel-2: rgba(70, 22, 88, .9); --panel-solid: rgba(36, 11, 50, .9);
    --ink: #fff3fa; --ink-soft: #f4cfe6; --ink-faint: #c99bc4;
    --gold: #ff4fa3; --gold-bright: #ff86c8; --gold-pale: #ffd6ee;
    --brown-deep: rgba(24, 7, 34, .95);
    --line: rgba(255, 134, 200, .2); --line-strong: rgba(127, 224, 168, .45);
    --chip: rgba(255, 79, 163, .16);
    --quote-bg: rgba(20, 6, 28, .9); --quote-ink: #fff3fa;
    --shadow: 0 18px 44px rgba(10, 2, 16, .55);
    --sp: #1f0a2c; --sp-bg: #7fe0a8; --badge-ink: #1f0a2c;
  }
  body { background: var(--bg); }
  h1 { letter-spacing: .02em; font-weight: 700; }
  .card h2, .ability-head h2, .artbox-head h2, .facts-wrap h2 { font-weight: 600; }
  .card h2 .dot { border-radius: 0; background: #7fe0a8; box-shadow: 0 0 0 4px var(--chip); }
  .hero { border-top-color: #7fe0a8; }

  /* ---------- Homeworld at night: original pixel city, nebula sky, Throne spire ---------- */
  .hw-bg { position: fixed; inset: -40px; z-index: 0; pointer-events: none;
    background: #1a0826 url("{{BASE}}images/regents/antton/stage.svg") center bottom / cover no-repeat;
    image-rendering: pixelated; will-change: transform; }
  .hw-shade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(26, 8, 38, .2) 0%, rgba(26, 8, 38, .5) 50%, rgba(26, 8, 38, .72) 100%); }
  .hw-float { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .hw-layer { position: absolute; inset: -80px; will-change: transform; }
  .px-star { position: absolute; image-rendering: pixelated; animation: pxbob 6s ease-in-out infinite alternate; }
  .px-star svg, .px-balloon svg { display: block; }
  .px-balloon { position: absolute; animation: pxrise 9s ease-in-out infinite alternate; }
  @keyframes pxbob { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
  @keyframes pxrise { from { transform: translate(0, 10px) rotate(-4deg); } to { transform: translate(6px, -14px) rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .px-star, .px-balloon { animation: none !important; } }
</style>
<!--mark-->
<svg class="hero-mark" width="200" height="160" viewBox="0 0 20 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="var(--gold)" d="M2 2h16v1h1v10h-1v1H2v-1H1V3h1zM6 0h1v1h1v1H6zM13 0h1v2h-2V1h1zM6 15h2v1H6zM12 15h2v1h-2z"/></svg>
<!--/mark-->
<div class="hw-bg" aria-hidden="true"></div>
<div class="hw-shade" aria-hidden="true"></div>
<div class="hw-float" id="hwFloat" aria-hidden="true">
  <div class="hw-layer" data-depth="0.35"></div>
  <div class="hw-layer" data-depth="0.8"></div>
</div>
<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var bg = document.querySelector(".hw-bg");
  var layers = Array.prototype.slice.call(document.querySelectorAll(".hw-layer"));
  function rand(a, b) { return a + Math.random() * (b - a); }
  // Pixel four-point star, drawn on a 7x7 grid.
  function star(color) {
    return '<svg width="100%" height="100%" viewBox="0 0 7 7" shape-rendering="crispEdges"><path fill="' + color +
      '" d="M3 0h1v2h1v1h2v1H5v1H4v2H3V5H2V4H0V3h2V2h1z"/></svg>';
  }
  // Pixel Holovision screen: frame, antennas, and a star on the screen.
  function balloon(color) {
    return '<svg width="100%" height="100%" viewBox="0 0 14 12" shape-rendering="crispEdges">' +
      '<path fill="#f4cfe6" d="M4 0h1v1h1v1H5V1H4zM9 0h1v1H9v1H8V1h1z"/>' +
      '<path fill="' + color + '" d="M0 2h14v10H0z"/><path fill="#7fe0a8" d="M1 3h12v8H1z"/><path fill="#5cc68c" d="M1 9h12v2H1z"/>' +
      '<path fill="' + color + '" d="M6 4h2v2h2v2H8v2H6V8H4V6h2z"/></svg>';
  }
  var starColors = ["#7fe0a8", "#ff86c8", "#fff3d6", "#ffffff"];
  var balloonColors = ["#ff4fa3", "#ff86c8", "#e8607a"];
  layers.forEach(function (layer, li) {
    var i, el, s;
    for (i = 0; i < (li ? 7 : 10); i++) {
      el = document.createElement("div"); el.className = "px-star";
      s = Math.round(rand(li ? 18 : 10, li ? 30 : 18));
      el.style.width = s + "px"; el.style.height = s + "px";
      el.style.left = rand(0, 96) + "%"; el.style.top = rand(0, 96) + "%";
      el.style.opacity = rand(0.5, 0.95).toFixed(2);
      el.style.animationDuration = rand(4, 8).toFixed(1) + "s"; el.style.animationDelay = (-rand(0, 8)).toFixed(1) + "s";
      el.innerHTML = star(starColors[i % starColors.length]);
      layer.appendChild(el);
    }
    for (i = 0; i < (li ? 3 : 2); i++) {
      el = document.createElement("div"); el.className = "px-balloon";
      s = Math.round(rand(li ? 34 : 22, li ? 46 : 30));
      el.style.width = s + "px"; el.style.height = Math.round(s * 0.86) + "px";
      el.style.left = rand(2, 94) + "%"; el.style.top = rand(10, 90) + "%";
      el.style.opacity = rand(0.6, 0.9).toFixed(2);
      el.style.animationDuration = rand(7, 12).toFixed(1) + "s"; el.style.animationDelay = (-rand(0, 10)).toFixed(1) + "s";
      el.innerHTML = balloon(balloonColors[i % balloonColors.length]);
      layer.appendChild(el);
    }
  });
  if (reduce) return;
  var tx = 0, ty = 0, cx = 0, cy = 0, ticking = false;
  function render() {
    cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
    var sy = window.scrollY || 0;
    if (bg) bg.style.transform = "translate3d(" + (cx * -8).toFixed(1) + "px," + (cy * -6 - Math.min(sy * 0.03, 40)).toFixed(1) + "px,0)";
    layers.forEach(function (l) {
      var d = parseFloat(l.getAttribute("data-depth")) || 0.5;
      l.style.transform = "translate3d(" + (cx * d * 28).toFixed(1) + "px," + (cy * d * 20 - sy * d * 0.18).toFixed(1) + "px,0)";
    });
    if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001) requestAnimationFrame(render); else ticking = false;
  }
  function kick() { if (!ticking) { ticking = true; requestAnimationFrame(render); } }
  window.addEventListener("scroll", kick, { passive: true });
  if (window.matchMedia("(pointer: fine)").matches) {
    window.addEventListener("mousemove", function (e) {
      tx = (e.clientX / window.innerWidth - 0.5) * 2; ty = (e.clientY / window.innerHeight - 0.5) * 2; kick();
    }, { passive: true });
  }
  kick();
})();
</script>
