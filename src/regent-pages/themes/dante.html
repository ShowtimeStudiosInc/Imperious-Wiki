<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-display: "Cinzel", Georgia, serif;
    --bg: #060508; --bg-deep: #120c10;
    --panel: rgba(18, 13, 16, .9); --panel-2: rgba(18, 13, 16, .9); --panel-solid: rgba(12, 9, 11, .93);
    --ink: #ece6dc; --ink-soft: #c9bfb0; --ink-faint: #8a8076;
    --gold: #c9473a; --gold-bright: #ff6a4d; --gold-pale: #f2c2a6;
    --brown-deep: rgba(4, 3, 5, .97);
    --line: rgba(236, 230, 220, .1); --line-strong: rgba(201, 71, 58, .38);
    --chip: rgba(201, 71, 58, .12);
    --quote-bg: rgba(4, 3, 5, .92); --quote-ink: #ece6dc;
    --shadow: 0 18px 44px rgba(0, 0, 0, .65);
    --sp: #120c10; --sp-bg: #ff6a4d; --badge-ink: #120c10;
  }
  body { background: var(--bg); }
  h1 { letter-spacing: .06em; }
  /* The Underworld: a gate in the dark, a slow river of lights below it, ash coming down */
  .dn-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .dn-scene svg { width: 100%; height: 100%; display: block; }
  .dn-soul { animation: dn-flow linear infinite; }
  @keyframes dn-flow { from { transform: translateX(-12%); } to { transform: translateX(112%); } }
  .dn-gate-glow { animation: dn-pulse 6s ease-in-out infinite alternate; }
  @keyframes dn-pulse { from { opacity: .45; } to { opacity: .85; } }
  .dn-ash { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .dn-ash i { position: absolute; top: -10px; width: 2px; height: 2px; background: #a39a90; border-radius: 50%; opacity: .5; animation: dn-fall linear infinite; }
  @keyframes dn-fall { to { transform: translate3d(-40px, 108vh, 0); } }
  .hero::after { content: 'SEALED BY ORDER OF COURT ALPHA'; position: absolute; right: 22px; bottom: 18px; padding: .3rem .7rem; border: 2px solid var(--gold); color: var(--gold); font-family: var(--font-display); font-size: .72rem; letter-spacing: .18em; transform: rotate(-4deg); opacity: .8; }
  @media (max-width: 700px) { .hero::after { position: static; display: inline-block; margin-top: 14px; } }
  @media (prefers-reduced-motion: reduce) { .dn-soul, .dn-gate-glow, .dn-ash i { animation: none; } .dn-ash { display: none; } }
</style>
<!--mark-->
<svg class="hero-mark" width="190" height="190" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--gold)" stroke-width="6"/><circle cx="50" cy="40" r="11" fill="var(--gold)"/><polygon points="44,46 56,46 60,76 40,76" fill="var(--gold)"/></svg>
<!--/mark-->
<div class="dn-scene" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
    <defs>
      <radialGradient id="dnGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5a3c" stop-opacity=".5"/><stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/></radialGradient>
      <linearGradient id="dnRiver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e8f7c" stop-opacity=".55"/><stop offset="1" stop-color="#06120f" stop-opacity="0"/></linearGradient>
      <linearGradient id="dnRock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120d10"/><stop offset="1" stop-color="#050406"/></linearGradient>
    </defs>
    <rect width="1600" height="900" fill="#060508"/>
    <ellipse class="dn-gate-glow" cx="800" cy="560" rx="420" ry="240" fill="url(#dnGlow)"/>
    <!-- cavern walls -->
    <path d="M0 0 H360 C300 160 330 300 250 430 C200 520 230 640 160 900 H0 Z" fill="url(#dnRock)"/>
    <path d="M1600 0 H1230 C1300 170 1260 310 1350 440 C1400 520 1370 650 1440 900 H1600 Z" fill="url(#dnRock)"/>
    <!-- the gate -->
    <g fill="#0b080a" stroke="#3a1714" stroke-width="2">
      <path d="M640 640 V420 C640 330 715 270 800 270 C885 270 960 330 960 420 V640 Z"/>
    </g>
    <g stroke="#5a221b" stroke-width="5">
      <line x1="690" y1="350" x2="690" y2="640"/><line x1="745" y1="300" x2="745" y2="640"/><line x1="800" y1="285" x2="800" y2="640"/><line x1="855" y1="300" x2="855" y2="640"/><line x1="910" y1="350" x2="910" y2="640"/>
      <line x1="650" y1="470" x2="950" y2="470"/>
    </g>
    <rect x="610" y="630" width="380" height="22" fill="#0e0a0c" stroke="#3a1714" stroke-width="2"/>
    <!-- the river -->
    <path d="M0 700 C300 670 520 700 800 690 C1080 680 1300 705 1600 690 V900 H0 Z" fill="#05100d"/>
    <path d="M0 700 C300 670 520 700 800 690 C1080 680 1300 705 1600 690 V760 H0 Z" fill="url(#dnRiver)"/>
    <g fill="#9ff0da">
      <circle class="dn-soul" cx="0" cy="712" r="3" style="animation-duration:46s" opacity=".7"/>
      <circle class="dn-soul" cx="0" cy="728" r="2.4" style="animation-duration:58s;animation-delay:-20s" opacity=".55"/>
      <circle class="dn-soul" cx="0" cy="704" r="2" style="animation-duration:40s;animation-delay:-31s" opacity=".6"/>
      <circle class="dn-soul" cx="0" cy="742" r="3.2" style="animation-duration:64s;animation-delay:-9s" opacity=".45"/>
      <circle class="dn-soul" cx="0" cy="720" r="2.2" style="animation-duration:52s;animation-delay:-44s" opacity=".6"/>
      <circle class="dn-soul" cx="0" cy="735" r="2.6" style="animation-duration:49s;animation-delay:-14s" opacity=".5"/>
    </g>
  </svg>
</div>
<div class="dn-ash" id="dnAsh" aria-hidden="true"></div>
<script>
(function () {
  var box = document.getElementById("dnAsh");
  for (var i = 0; i < 40; i++) {
    var a = document.createElement("i");
    a.style.left = (Math.random() * 105) + "%";
    a.style.animationDuration = (14 + Math.random() * 16).toFixed(1) + "s";
    a.style.animationDelay = (-Math.random() * 30).toFixed(1) + "s";
    box.appendChild(a);
  }
})();
</script>
