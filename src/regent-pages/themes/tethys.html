<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-body: "Spectral", Georgia, "Times New Roman", serif;
    --font-display: "Cormorant Garamond", Georgia, serif;
    --bg: #121524; --bg-deep: #2b3147;
    --panel: rgba(46, 54, 84, .9); --panel-2: rgba(46, 54, 84, .9); --panel-solid: rgba(24, 28, 46, .9);
    --ink: #eef1fa; --ink-soft: #c5d0ea; --ink-faint: #9aa6cd;
    --gold: #aebbe2; --gold-bright: #dbe3f7; --gold-pale: #dbe3f7;
    --brown-deep: rgba(14, 16, 28, .96);
    --line: rgba(197, 208, 234, .16); --line-strong: rgba(197, 208, 234, .3);
    --chip: rgba(154, 166, 205, .16);
    --quote-bg: rgba(12, 14, 24, .9); --quote-ink: #eef1fa;
    --shadow: 0 18px 44px rgba(0, 0, 0, .45);
    --sp: #2b3147; --sp-bg: #dbe3f7; --badge-ink: #2b3147;
  }
  body { background: var(--bg); font-size: 1.06rem; }
  h1 { letter-spacing: .02em; font-weight: 600; }
  .card h2 .dot { background: #a3b5a6; }

  /* ---------- The Quiet Archive: original vector scene, drifting dust and paper ---------- */
  .ar-bg { position: fixed; inset: -30px; z-index: 0; pointer-events: none;
    background: #121524 url("{{BASE}}images/regents/tethys/archive-2.svg") center center / cover no-repeat; will-change: transform; }
  .ar-shade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, rgba(18, 21, 36, .15) 0%, rgba(18, 21, 36, .55) 75%); }
  .ar-float { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .mote { position: absolute; border-radius: 50%; background: #eef1fa; animation: drift ease-in-out infinite alternate; }
  .paper { position: absolute; top: -30px; background: #dbe3f7; border-radius: 1px; opacity: .7; animation: settle linear infinite; }
  @keyframes drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(14px, -22px, 0); } }
  @keyframes settle {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    33%  { transform: translate3d(26px, 38vh, 0) rotate(90deg); }
    66%  { transform: translate3d(-18px, 74vh, 0) rotate(200deg); }
    100% { transform: translate3d(12px, 112vh, 0) rotate(300deg); }
  }
  @media (prefers-reduced-motion: reduce) { .mote, .paper { animation: none; } .paper { display: none; } }
</style>
<!--mark-->
<svg class="hero-mark" width="190" height="170" viewBox="0 0 120 106" aria-hidden="true"><polygon points="60,2 116,56 96,104 24,104 4,56" fill="var(--gold)"/></svg>
<!--/mark-->
<div class="ar-bg" aria-hidden="true"></div>
<div class="ar-shade" aria-hidden="true"></div>
<div class="ar-float" id="arFloat" aria-hidden="true"></div>
<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var box = document.getElementById("arFloat");
  var bg = document.querySelector(".ar-bg");
  function rand(a, b) { return a + Math.random() * (b - a); }
  for (var i = 0; i < 40; i++) {
    var m = document.createElement("span");
    m.className = "mote";
    var s = rand(1.5, 3.5);
    m.style.width = s + "px"; m.style.height = s + "px";
    m.style.left = rand(0, 100) + "%"; m.style.top = rand(0, 100) + "%";
    m.style.opacity = rand(0.2, 0.6).toFixed(2);
    m.style.animationDuration = rand(6, 14).toFixed(1) + "s";
    m.style.animationDelay = (-rand(0, 14)).toFixed(1) + "s";
    box.appendChild(m);
  }
  if (!reduce) {
    for (var j = 0; j < 7; j++) {
      var p = document.createElement("span");
      p.className = "paper";
      var w = rand(8, 13);
      p.style.width = w + "px"; p.style.height = (w * 1.3) + "px";
      p.style.left = rand(0, 100) + "%";
      p.style.animationDuration = rand(26, 40).toFixed(1) + "s";
      p.style.animationDelay = (-rand(0, 40)).toFixed(1) + "s";
      box.appendChild(p);
    }
  }
  if (reduce || !bg) return;
  var tx = 0, ty = 0, cx = 0, cy = 0, ticking = false;
  function render() {
    cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
    var sy = window.scrollY || 0;
    bg.style.transform = "translate3d(" + (cx * -8).toFixed(1) + "px," + (cy * -6 - Math.min(sy * 0.02, 24)).toFixed(1) + "px,0)";
    if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001) requestAnimationFrame(render); else ticking = false;
  }
  function kick() { if (!ticking) { ticking = true; requestAnimationFrame(render); } }
  window.addEventListener("scroll", kick, { passive: true });
  if (window.matchMedia("(pointer: fine)").matches) {
    window.addEventListener("mousemove", function (e) {
      tx = (e.clientX / window.innerWidth - 0.5) * 2; ty = (e.clientY / window.innerHeight - 0.5) * 2; kick();
    }, { passive: true });
  }
  kick();
})();
</script>
