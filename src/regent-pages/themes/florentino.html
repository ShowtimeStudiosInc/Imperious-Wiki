<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: light;
    --font-body: "Nunito Sans", system-ui, -apple-system, Segoe UI, sans-serif;
    --font-display: "DM Serif Display", Georgia, serif;
    --bg: #c2335a; --bg-deep: #8e2350;
    --panel: #fff6ee; --panel-2: #ffefe6; --panel-solid: rgba(255, 249, 243, .94);
    --ink: #3d1a26; --ink-soft: #6e3646; --ink-faint: #a0636f;
    --gold: #d6457f; --gold-bright: #f2a93b; --gold-pale: #ffe1a8;
    --brown-deep: #7a2a46;
    --line: #f2d0c6; --line-strong: #eab07a;
    --chip: #ffe9da;
    --quote-bg: #7a2a46; --quote-ink: #ffe9da;
    --shadow: 0 12px 34px rgba(122, 42, 70, .18);
    --sp: #3d1a26; --sp-bg: #ffc65c; --badge-ink: #3d1a26;
  }
  body { background: var(--bg); }
  .hero { border-top-color: #f2a93b; }
  .card h2 .dot { background: #f2a93b; }
  .crumbs { color: #ffe9da; text-shadow: 0 1px 6px rgba(80, 10, 40, .8); }
  .crumbs a { color: #ffd27a; }

  /* ---------- Field of Pink and Gold at sunset: original vector field, setting sun, drifting petals ---------- */
  .fl-bg { position: fixed; inset: -30px; z-index: 0; pointer-events: none;
    background: #c2335a url("{{BASE}}images/regents/florentino/field-sunset.svg") center bottom / cover no-repeat; will-change: transform; }
  .fl-shade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 240, 236, .05) 0%, rgba(255, 236, 228, .2) 100%); }
  .fl-petals { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .petal { position: absolute; top: -40px; border-radius: 80% 0 80% 0; opacity: .85; will-change: transform;
    animation: fall linear infinite; }
  @keyframes fall {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    25%  { transform: translate3d(-30px, 28vh, 0) rotate(120deg); }
    50%  { transform: translate3d(20px, 55vh, 0) rotate(220deg); }
    75%  { transform: translate3d(-24px, 82vh, 0) rotate(320deg); }
    100% { transform: translate3d(10px, 112vh, 0) rotate(420deg); }
  }
  @media (prefers-reduced-motion: reduce) { .petal { display: none; } }
</style>
<!--mark-->
<svg class="hero-mark" width="200" height="200" viewBox="0 0 100 100" aria-hidden="true"><g fill="#f2a93b"><ellipse cx="50" cy="24" rx="12" ry="22"/><ellipse cx="50" cy="76" rx="12" ry="22"/><ellipse cx="24" cy="50" rx="22" ry="12"/><ellipse cx="76" cy="50" rx="22" ry="12"/><ellipse cx="32" cy="32" rx="10" ry="20" transform="rotate(-45 32 32)"/><ellipse cx="68" cy="68" rx="10" ry="20" transform="rotate(-45 68 68)"/><ellipse cx="68" cy="32" rx="10" ry="20" transform="rotate(45 68 32)"/><ellipse cx="32" cy="68" rx="10" ry="20" transform="rotate(45 32 68)"/></g><circle cx="50" cy="50" r="12" fill="#d6457f"/></svg>
<!--/mark-->
<div class="fl-bg" aria-hidden="true"></div>
<div class="fl-shade" aria-hidden="true"></div>
<div class="fl-petals" id="flPetals" aria-hidden="true"></div>
<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var box = document.getElementById("flPetals");
  var bg = document.querySelector(".fl-bg");
  function rand(a, b) { return a + Math.random() * (b - a); }
  var colors = ["#f2a93b", "#f08a2c", "#ffc65c", "#ff8fb5", "#f77aa6", "#ffd6e4"];
  if (!reduce) {
    for (var i = 0; i < 22; i++) {
      var p = document.createElement("span");
      p.className = "petal";
      var s = rand(8, 16);
      p.style.width = s + "px"; p.style.height = (s * 0.62) + "px";
      p.style.left = rand(0, 100) + "%";
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = rand(14, 26).toFixed(1) + "s";
      p.style.animationDelay = (-rand(0, 26)).toFixed(1) + "s";
      box.appendChild(p);
    }
  }
  if (reduce || !bg) return;
  var tx = 0, ty = 0, cx = 0, cy = 0, ticking = false;
  function render() {
    cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
    var sy = window.scrollY || 0;
    bg.style.transform = "translate3d(" + (cx * -10).toFixed(1) + "px," + (cy * -6 - Math.min(sy * 0.02, 24)).toFixed(1) + "px,0)";
    if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001) requestAnimationFrame(render); else ticking = false;
  }
  function kick() { if (!ticking) { ticking = true; requestAnimationFrame(render); } }
  window.addEventListener("scroll", kick, { passive: true });
  if (window.matchMedia("(pointer: fine)").matches) {
    window.addEventListener("mousemove", function (e) {
      tx = (e.clientX / window.innerWidth - 0.5) * 2; ty = (e.clientY / window.innerHeight - 0.5) * 2; kick();
    }, { passive: true });
  }
  kick();
})();
</script>
