<!--fonts-->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
<!--/fonts-->
<style>
  :root {
    color-scheme: dark;
    --font-display: "Cormorant Garamond", Georgia, serif;
    --bg: #15100a; --bg-deep: #2a1f10;
    --panel: rgba(38, 28, 14, .9); --panel-2: rgba(38, 28, 14, .9); --panel-solid: rgba(28, 21, 11, .92);
    --ink: #fbf3e2; --ink-soft: #e2d2ad; --ink-faint: #b49d6c;
    --gold: #e6b84f; --gold-bright: #ffd97a; --gold-pale: #ffe9b0;
    --brown-deep: rgba(14, 10, 5, .96);
    --line: rgba(230, 184, 79, .16); --line-strong: rgba(230, 184, 79, .34);
    --chip: rgba(230, 184, 79, .14);
    --quote-bg: rgba(14, 10, 5, .9); --quote-ink: #fbf3e2;
    --shadow: 0 18px 44px rgba(0, 0, 0, .5);
    --sp: #2a1f10; --sp-bg: #ffd97a; --badge-ink: #2a1f10;
  }
  body { background: radial-gradient(ellipse at 50% 0%, #3a2a10, var(--bg) 70%) fixed; }
  /* Turning dials: rings with hour marks, slowly turning at different speeds */
  .od-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .od-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(230, 184, 79, .16); animation: od-turn linear infinite; }
  .od-ring::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 6px dotted rgba(230, 184, 79, .14); }
  .od-ring::after { content: ''; position: absolute; left: 50%; top: 6%; width: 2px; height: 44%; background: linear-gradient(rgba(255, 217, 122, .4), transparent); }
  @keyframes od-turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .od-ring { animation: none; } }
</style>
<!--mark-->
<svg class="hero-mark" width="190" height="190" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--gold)" stroke-width="6"/><line x1="50" y1="50" x2="50" y2="18" stroke="var(--gold)" stroke-width="6"/><line x1="50" y1="50" x2="72" y2="60" stroke="var(--gold)" stroke-width="6"/></svg>
<!--/mark-->
<div class="od-bg" aria-hidden="true">
  <span class="od-ring" style="width:900px;height:900px;left:-300px;top:-260px;animation-duration:240s"></span>
  <span class="od-ring" style="width:560px;height:560px;right:-180px;top:30%;animation-duration:160s;animation-direction:reverse"></span>
  <span class="od-ring" style="width:320px;height:320px;left:8%;bottom:-120px;animation-duration:90s"></span>
</div>
