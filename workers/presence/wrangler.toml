name = "ia-wiki-presence"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PageRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageRoom"]

# Voices for the Listen button (/tts). Workers AI must be turned on for the account.
[ai]
binding = "AI"

# A KV namespace that keeps every voiced line forever, so each line is only made once.
# Made with:  npx wrangler kv namespace create TTS_CACHE
[[kv_namespaces]]
binding = "TTS_CACHE"
id = "02200312ff6d41f2b568e62dadfbcc0c"
