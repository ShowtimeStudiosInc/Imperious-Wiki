<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Imperious Authorities Wiki Editor</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Any Gem-Type saved here is marked editorLocked, so the rank-doc import
      // (npm run import) keeps this version instead of overwriting it.
      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          if (entry.get('collection') !== 'gemTypes') return entry.get('data');
          return entry.get('data').set('editorLocked', true);
        },
      });
    </script>
  </body>
</html>
