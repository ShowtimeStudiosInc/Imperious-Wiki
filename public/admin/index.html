<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Imperious Authorities Wiki Editor</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          if (entry.get('collection') !== 'gemTypes') return entry.get('data');
          // Mark it as edited here (so the import keeps it) and date it today (for the "Updated" tag).
          const today = new Date().toISOString().slice(0, 10);
          return entry.get('data').set('editorLocked', true).set('updated', today);
        },
      });
    </script>
  </body>
</html>
