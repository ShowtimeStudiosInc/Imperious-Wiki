# Decap CMS: the form-based editor at /admin.
# Only the owner (Oliver) uses it. He logs in with GitHub. With editorial_workflow on,
# an edit is saved as a draft first and goes live when he publishes it.
backend:
  name: github
  repo: ShowtimeStudiosInc/Imperious-Wiki   # change if the repo name differs
  branch: main
  # GitHub login goes through the Cloudflare Worker below (sveltia-cms-auth). See README "Turning on the editor".
  base_url: https://ia-wiki-auth.dilanrodriguez091.workers.dev
publish_mode: editorial_workflow
logo:
  src: https://showtimestudiosinc.github.io/Imperious-Wiki/images/brand/logo-white.png
  show_in_header: true
site_url: https://showtimestudiosinc.github.io/Imperious-Wiki/
display_url: https://showtimestudiosinc.github.io/Imperious-Wiki/
media_folder: public/images/gem-types
public_folder: /images/gem-types

collections:
  - name: gemTypes
    label: Gem-Types
    label_singular: Gem-Type
    folder: src/data/gem-types
    extension: yml
    format: yml
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{name}} · {{faction}} · Rank {{rank | default('none')}}"
    description: "Saving a Gem-Type here marks it as edited in the editor, so the rank-doc import won't overwrite it. Copy big changes into the RANK docs too."
    fields:
      - { name: name, label: Name, widget: string }
      - { name: slug, label: "URL name (lowercase, dashes)", widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, and dashes only'] }
      - { name: rank, label: Rank, widget: select, required: false, options: ['1.2', '2.1', '2.2', '2.3', '3.1', '3.2', '3.3', '4.1', '4.2', '4.3', '5.1', '5.2'] }
      - { name: side, label: "Side (Rank 2 only)", widget: select, required: false, options: [Aristocratic, Authoritative] }
      - { name: faction, label: Faction, widget: select, default: gempire, options: [{ label: Gempire, value: gempire }, { label: United Frontier, value: united-frontier }, { label: Lost Light, value: lost }, { label: Rogue, value: rogue }] }
      - { name: kind, label: Kind, widget: select, default: standard, options: [standard, sub-type, fusion, geode, alloy, group] }
      - { name: parent, label: "Parent type slug (sub-types only)", widget: string, required: false }
      - { name: components, label: "Fusion halves (slugs)", widget: list, required: false }
      - { name: variant, label: "Variant (e.g. Pyrope)", widget: string, required: false }
      - { name: era, label: "Era (e.g. Era 0-1)", widget: string, required: false }
      - { name: species, label: Species, widget: select, default: gem, options: [gem, metal] }
      - { name: status, label: Status, widget: select, multiple: true, required: false, options: [Legacy, Discontinued, Geode, Sole Essence] }
      - { name: traits, label: Traits, widget: list, required: false, hint: "Bioluminescent, Flight, ..." }
      - { name: court, label: Court, widget: string, required: false }
      - { name: threatClass, label: "Threat Class (fusions)", widget: select, required: false, options: [Minion, Standard, Elite, Champion, Titan, Leviathan, Colossus, Apocalypse, Extinction] }
      - { name: height, label: "Height (e.g. 8'0\")", widget: string, required: false }
      - name: stats
        label: "Base Stats (leave empty for fusions)"
        widget: object
        required: false
        fields:
          - { name: hp, label: HP, widget: number, value_type: int }
          - { name: atk, label: ATK, widget: number, value_type: int }
          - { name: def, label: DEF, widget: number, value_type: int }
          - { name: spd, label: SPD, widget: number, value_type: int }
          - { name: int, label: INT, widget: number, value_type: int }
          - { name: mag, label: MAG, widget: number, value_type: int }
      - name: abilities
        label: Abilities
        widget: list
        summary: "{{section}}: {{name}}"
        fields:
          - { name: section, label: Section, widget: select, options: [Signature Ability, ACT Bonus, Fusion Ability, Latent Ability] }
          - { name: name, label: Name, widget: string, required: false }
          - { name: tags, label: "Tags (PASSIVE, 2 SP, REACTION, Minor...)", widget: list, required: false }
          - { name: cost, label: "SP cost", widget: number, value_type: int, required: false }
          - { name: text, label: Text, widget: text }
          - name: moves
            label: Moves
            widget: list
            required: false
            fields:
              - { name: name, label: Name, widget: string }
              - { name: tags, label: Tags, widget: list, required: false }
              - { name: cost, label: "SP cost", widget: number, value_type: int, required: false }
              - { name: text, label: Text, widget: text }
      - { name: role, label: "Role (Job Lore)", widget: text }
      - { name: interactions, label: Interactions, widget: text, required: false }
      - { name: description, label: "Description (gemstone and looks)", widget: text, required: false }
      - { name: image, label: "Art or gemstone vector", widget: image, required: false }
      - { name: credit, label: "Design credit", widget: string, required: false }
      - { name: updated, label: "Last updated", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { name: gemstone, label: "Gemstone vector (set by the build)", widget: string, required: false }
      - { name: notes, label: Notes, widget: list, required: false, field: { name: note, label: Note, widget: text } }
      - { name: descendedFrom, label: "Descended from (slug)", widget: string, required: false }
      - { name: shiftOf, label: "Shift of (UF Quartz only, slug)", widget: string, required: false }
      - { name: alsoFactions, label: "Also in factions", widget: list, required: false }
      - { name: attachments, label: "Attached Gem-Types (slugs)", widget: list, required: false }
      - name: modifiers
        label: "Stat modifiers (UF Quartz shifts)"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: hp, label: HP, widget: number, value_type: int, required: false }
          - { name: atk, label: ATK, widget: number, value_type: int, required: false }
          - { name: def, label: DEF, widget: number, value_type: int, required: false }
          - { name: spd, label: SPD, widget: number, value_type: int, required: false }
          - { name: int, label: INT, widget: number, value_type: int, required: false }
          - { name: mag, label: MAG, widget: number, value_type: int, required: false }
      - name: extraBlocks
        label: "Extra blocks (tables like Fated Draw)"
        widget: list
        required: false
        collapsed: true
        fields:
          - { name: title, label: Title, widget: string }
          - { name: lines, label: Lines, widget: list, field: { name: line, label: Line, widget: text } }
      - { name: editorLocked, label: "Edited in the wiki editor (set on save)", widget: hidden, required: false }

  # ---------- The Homeworld Times ----------
  - name: news
    label: The Homeworld Times
    label_singular: Broadcast
    folder: src/data/news
    extension: yml
    format: yml
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{date}} · {{title}} · {{anchor}}"
    sortable_fields: [date, title]
    description: "News broadcasts, once they're done being roleplayed. Publishing one puts it on the Homeworld Times page and posts it to Discord. Any rating changes reach the Diamond Approval Rating on the next automatic update (within about 3 hours)."
    fields:
      - { name: title, label: Headline, widget: string }
      - { name: date, label: "Aired on", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: anchor, label: Anchor, widget: string, default: Vevila Dei }
      - { name: guests, label: "Guests (one per line)", widget: list, required: false }
      - { name: credits, label: "Written by (optional)", widget: string, required: false }
      - { name: summary, label: "Short summary (one or two sentences)", widget: text }
      - name: transcript
        label: Transcript
        widget: text
        hint: "Paste the broadcast as posted. Put @Name on its own line before someone talks (@Vevila Dei, @Black Star Sapphire). Lines starting with * are actions. A line in [square brackets] is an on-screen card. Code fences and # - are fine to leave in."
      - name: changes
        label: "Approval Rating changes (optional)"
        label_singular: change
        widget: list
        required: false
        summary: "{{fields.who}} {{fields.change}}"
        fields:
          - { name: who, label: Who, widget: select, options: [{ label: Alpha Black, value: alpha-black }, { label: Epsilon Blue, value: epsilon-blue }, { label: Theta Gold, value: theta-gold }, { label: Saturn Light, value: saturn-light }, { label: Nightshade Violet, value: nightshade-violet }, { label: Maroon Red, value: maroon-red }, { label: Bi-Colored Kandy, value: bi-colored-kandy }, { label: Antton, value: antton }, { label: Florentino, value: florentino }, { label: Tethys, value: tethys }, { label: Reina, value: reina }, { label: Magda, value: magda }, { label: Law, value: law }, { label: Ordr, value: ordr }, { label: Dante, value: dante }] }
          - { name: change, label: "Points (+3, -2)", widget: number, value_type: int }
          - { name: text, label: "Why (shown on the Approval Rating)", widget: text }
      - { name: unrest, label: "Unrest change (optional, + or -)", widget: number, value_type: int, required: false }
      - { name: unrest_text, label: "Why Unrest moved (optional)", widget: text, required: false }

  # ---------- Diamond Approval Rating ----------
  - name: approval
    label: Diamond Approval Rating
    description: "This updates by itself every 3 hours. To change it by hand after a story event, change the Score and add a log line at the top. Previous is filled in automatically (the score 7 days ago). For news broadcasts, use The Homeworld Times collection instead."
    files:
      - name: rating
        label: Approval Rating and log
        file: src/data/popularity.yml
        format: yml
        fields:
          - { name: updated, label: "Update date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
          - name: deity
            label: "Deity Diamonds"
            widget: list
            allow_add: false
            summary: "{{slug}}: {{score}} (was {{previous}})"
            fields:
              - { name: slug, label: Who, widget: hidden }
              - { name: name, label: "Name (only if there's no page yet)", widget: string, required: false }
              - { name: score, label: Score, widget: number, value_type: int, min: 0, max: 100 }
              - { name: previous, label: "Previous score", widget: number, value_type: int, min: 0, max: 100 }
              - { name: votes, label: "Gems polled", widget: number, value_type: int, min: 0 }
          - name: ruling
            label: "Ruling Diamonds"
            widget: list
            allow_add: false
            summary: "{{slug}}: {{score}} (was {{previous}})"
            fields:
              - { name: slug, label: Who, widget: hidden }
              - { name: name, label: "Name (only if there's no page yet)", widget: string, required: false }
              - { name: score, label: Score, widget: number, value_type: int, min: 0, max: 100 }
              - { name: previous, label: "Previous score", widget: number, value_type: int, min: 0, max: 100 }
              - { name: votes, label: "Gems polled", widget: number, value_type: int, min: 0 }
          - name: regents
            label: "Grand Regents"
            widget: list
            allow_add: false
            summary: "{{slug}}: {{score}} (was {{previous}})"
            fields:
              - { name: slug, label: Who, widget: hidden }
              - { name: name, label: "Name (only if there's no page yet)", widget: string, required: false }
              - { name: score, label: Score, widget: number, value_type: int, min: 0, max: 100 }
              - { name: previous, label: "Previous score", widget: number, value_type: int, min: 0, max: 100 }
              - { name: votes, label: "Gems polled", widget: number, value_type: int, min: 0 }
          - name: log
            label: "What moved the numbers"
            widget: list
            add_to_top: true
            summary: "{{date}} · {{who}} · {{change}} · {{kind}}"
            fields:
              - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { name: who, label: Who, widget: select, options: [alpha-black, epsilon-blue, theta-gold, saturn-light, nightshade-violet, maroon-red, bi-colored-kandy, antton, florentino, tethys, reina, magda, law, ordr, dante] }
              - { name: change, label: "Points (+3, -2, 0)", widget: number, value_type: int }
              - { name: kind, label: Kind, widget: select, options: [{ label: "Event (something they did)", value: event }, { label: "Update roll", value: roll }] }
              - { name: text, label: "What happened", widget: text }

  # ---------- Lore ----------
  - name: nuggets
    label: Nuggets of Lore
    files:
      - name: nuggets
        label: Nuggets of Lore
        file: src/data/nuggets.yml
        format: yml
        fields:
          - name: nuggets
            label: Nuggets
            widget: list
            add_to_top: true
            summary: "#{{n}} · {{tags}}"
            fields:
              - { name: n, label: "Number", widget: number, value_type: int }
              - { name: tags, label: "Tags (used by the filter buttons)", widget: list }
              - { name: text, label: "Text (one paragraph per item)", widget: list, field: { name: p, label: Paragraph, widget: text } }
              - { name: note, label: "Note (optional)", widget: text, required: false }
              - { name: link, label: "Link (optional, a page on the wiki)", widget: string, required: false }
  - name: glossary
    label: Glossary
    description: "Each term gets a hover definition the first time it shows up on a Rules or Lore page, and is listed on the Glossary page."
    files:
      - name: glossary
        label: Glossary terms
        file: src/data/glossary.yml
        format: yml
        fields:
          - name: terms
            label: Terms
            widget: list
            summary: "{{term}}"
            fields:
              - { name: term, label: Term, widget: string }
              - { name: match, label: "Spellings to look for (plural, lowercase, etc.)", widget: list }
              - { name: def, label: "Short definition", widget: text }
              - { name: href, label: "Read more link (starts with /, e.g. /lore/glossary/)", widget: string }
  - name: loreFactions
    label: "Lore: Factions"
    label_singular: Page
    folder: src/content/docs/lore/factions
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Short description (for link previews)", widget: string }
      - { name: sidebar, label: Sidebar, widget: object, required: false, collapsed: true, fields: [{ name: order, label: "Order in sidebar", widget: number, value_type: int, required: false }] }
      - { name: body, label: Text, widget: markdown, modes: [raw], hint: "The In-World and Rules labels are written as <span class=\"ia-label in-world\">In-World</span> and <span class=\"ia-label\">Rules · out of character</span>." }
  - name: loreLife
    label: "Lore: Gempire Life"
    label_singular: Page
    folder: src/content/docs/lore/gempire-life
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Short description (for link previews)", widget: string }
      - { name: sidebar, label: Sidebar, widget: object, required: false, collapsed: true, fields: [{ name: order, label: "Order in sidebar", widget: number, value_type: int, required: false }] }
      - { name: body, label: Text, widget: markdown, modes: [raw], hint: "The In-World and Rules labels are written as <span class=\"ia-label in-world\">In-World</span> and <span class=\"ia-label\">Rules · out of character</span>." }
  - name: loreGems
    label: "Lore: How Gems Work"
    label_singular: Page
    folder: src/content/docs/lore/how-gems-work
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Short description (for link previews)", widget: string }
      - { name: sidebar, label: Sidebar, widget: object, required: false, collapsed: true, fields: [{ name: order, label: "Order in sidebar", widget: number, value_type: int, required: false }] }
      - { name: body, label: Text, widget: markdown, modes: [raw], hint: "The In-World and Rules labels are written as <span class=\"ia-label in-world\">In-World</span> and <span class=\"ia-label\">Rules · out of character</span>." }
  - name: loreWorld
    label: "Lore: Wildlife & Ships"
    label_singular: Page
    folder: src/content/docs/lore/world
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Short description (for link previews)", widget: string }
      - { name: sidebar, label: Sidebar, widget: object, required: false, collapsed: true, fields: [{ name: order, label: "Order in sidebar", widget: number, value_type: int, required: false }] }
      - { name: body, label: Text, widget: markdown, modes: [raw], hint: "The In-World and Rules labels are written as <span class=\"ia-label in-world\">In-World</span> and <span class=\"ia-label\">Rules · out of character</span>." }

  # ---------- Diamonds and Grand Regents (page text) ----------
  - name: diamondPages
    label: "Diamonds: page text"
    label_singular: Diamond page
    folder: src/data/diamond-pages
    extension: json
    format: json
    create: false
    identifier_field: slug
    summary: "{{slug}}"
    description: "Text on each Diamond's page. Height, color, domains and the other facts in the chips live in src/lib/diamonds.ts, and themes are code."
    fields:
      - { name: slug, label: Slug, widget: hidden }
      - { name: courtLine, label: "Line above the name", widget: string }
      - { name: heroSub, label: "Intro line", widget: text }
      - { name: partial, label: "Partial page note (clear it when the page is complete)", widget: text, required: false }
      - { name: quote, label: Quote, widget: text, required: false }
      - { name: personality, label: Personality, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
      - { name: purpose, label: Purpose, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
      - { name: weakness, label: Weakness, widget: list, required: false, field: { name: p, label: Paragraph, widget: text } }
      - { name: credits, label: "Art credits", widget: list, required: false, fields: [{ name: label, label: "What (Art, Design...)", widget: string }, { name: name, label: Who, widget: string }] }
  - name: regentPages
    label: "Grand Regents: page text"
    label_singular: Grand Regent page
    folder: src/data/regents
    extension: json
    format: json
    create: false
    identifier_field: name
    summary: "{{name}}"
    fields:
      - { name: name, label: Name, widget: string }
      - { name: heroSub, label: "Intro line", widget: text }
      - { name: personality, label: Personality, widget: list, field: { name: p, label: Paragraph, widget: text } }
      - { name: likes, label: Likes, widget: list }
      - { name: dislikes, label: Dislikes, widget: list }
      - { name: fear, label: Fear, widget: string, required: false }
      - { name: credits, label: "Art credits", widget: list, required: false, fields: [{ name: label, label: "What (Art, Design...)", widget: string }, { name: name, label: Who, widget: string }] }

  # ---------- Site settings ----------
  - name: settings
    label: Site settings
    files:
      - name: seasons
        label: Seasonal themes
        file: src/data/seasons.yml
        format: yml
        fields:
          - { name: force, label: "Lock a theme (leave empty to go by date)", widget: select, required: false, options: [none, winter, spring, summer, autumn, easter, halloween, thanksgiving, winter-holidays, new-year, valentines] }
          - name: holidays
            label: Holidays
            widget: list
            summary: "{{name}}: {{from}} to {{to}}"
            fields:
              - { name: key, label: "Theme", widget: select, options: [easter, halloween, thanksgiving, winter-holidays, new-year, valentines] }
              - { name: name, label: Name, widget: string }
              - { name: from, label: "From (MM-DD)", widget: string, pattern: ['^\d\d-\d\d$', 'Write it as MM-DD'] }
              - { name: to, label: "To (MM-DD)", widget: string, pattern: ['^\d\d-\d\d$', 'Write it as MM-DD'] }
          - name: seasons
            label: "Seasons (months)"
            widget: object
            collapsed: true
            fields:
              - { name: winter, label: Winter, widget: list, field: { name: m, label: Month, widget: number, value_type: int } }
              - { name: spring, label: Spring, widget: list, field: { name: m, label: Month, widget: number, value_type: int } }
              - { name: summer, label: Summer, widget: list, field: { name: m, label: Month, widget: number, value_type: int } }
              - { name: autumn, label: Autumn, widget: list, field: { name: m, label: Month, widget: number, value_type: int } }
